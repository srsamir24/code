<style>/* inlined from ../_kit/reel.css */
/* Shared shell for the Cursed UI pages: palette, backdrop, hook/outro, reel canvas, cursor. */
:root{
  --bg:#f3f2ee; --ink:#121214; --ink-2:#5f5f66; --ink-3:#8d8c92;
  --line:rgba(18,18,20,.085); --line-2:#e6e3dc;
  --gold-1:#ffd772; --gold-2:#f2a43a; --gold-ink:#a8681a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Satoshi",ui-sans-serif,sans-serif; -webkit-font-smoothing:antialiased;
  overflow:hidden; -webkit-user-select:none; user-select:none;
}
.backdrop{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(60% 45% at 50% 46%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
    linear-gradient(var(--bg),var(--bg));
}
.backdrop::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(18,18,20,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,18,20,.045) 1px,transparent 1px);
  background-size:28px 28px; background-position:center;
  -webkit-mask-image:radial-gradient(55% 42% at 50% 46%,#000 10%,transparent 75%);
          mask-image:radial-gradient(55% 42% at 50% 46%,#000 10%,transparent 75%);
}
.stage{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px}

.tag{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 9px;border-radius:99px;
  background:#fff;border:1px solid var(--line);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  box-shadow:0 4px 10px -6px rgba(40,34,20,.18)}
.tag i,.outro i{display:block;width:7px;height:7px;border-radius:50%;background:linear-gradient(var(--gold-1),var(--gold-2))}
.hook{font-weight:900;font-size:27px;line-height:1.12;letter-spacing:-.025em;text-align:center;max-width:430px;text-wrap:balance}
.handle{display:block;margin-top:10px;font-weight:500;font-size:12.5px;letter-spacing:.01em;color:var(--ink-3)}
.outro{font-weight:900;font-size:30px;letter-spacing:-.025em;color:var(--ink);opacity:0;text-align:center}
.outro span{display:inline-flex;align-items:center;gap:10px}
.outro i{width:14px;height:14px}
.outro b{display:inline-block;font-weight:900;background:var(--ink);color:#fff;border-radius:10px;padding:1px 10px 3px;margin:0 1px;letter-spacing:.01em}
.outro small{display:block;margin-top:14px;font-weight:700;font-size:19px;letter-spacing:-.01em;color:#34343a}
.outro small em{font-style:normal;font-weight:500;color:var(--ink-2)}

.card{position:relative;width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 40px 70px -32px rgba(40,34,20,.22),0 10px 24px -12px rgba(0,0,0,.08);
}
.app{display:flex;align-items:center;gap:12px}
.icon{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(160deg,#2a2a33,#101014);display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 14px -6px rgba(0,0,0,.35)}
.app b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em}
.app span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:1px}
.x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-3)}

/* reel mode: fixed 540x960 phone canvas (recorded at 2x = 1080x1920) */
body.reel .stage{display:block;width:540px;height:960px;margin:0 auto;padding:0}
body.reel .tag{position:absolute;top:154px;left:50%;transform:translateX(-50%)}
body.reel .hook{position:absolute;top:198px;left:50%;transform:translateX(-50%);width:450px;font-size:30px}
body.reel .card{position:absolute;top:318px;left:60px}
body.reel .outro{position:absolute;top:192px;left:0;right:0;font-size:25px}
body:not(.reel) .outro{display:none}
body.reel, body.reel *{cursor:none !important}
#cursor{position:fixed;left:0;top:0;width:0;height:0;z-index:99;pointer-events:none;display:none}
body.reel #cursor{display:block}
#cursor svg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
#ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(18,18,20,.5);opacity:0}
</style>
<style>/* inlined from component.css */

.cu-cap .head small{display:block;font-weight:500;font-size:13.5px;letter-spacing:.005em;opacity:.92}

.cu-cap .chk{position:absolute;left:5px;top:5px;width:24px;height:24px;border-radius:50%;background:var(--blue);display:grid;place-items:center;
  box-shadow:0 0 0 2px #fff,0 3px 8px -2px rgba(20,40,120,.45);opacity:0;transform:scale(.4);pointer-events:none}

.cu-cap .foot{position:relative;display:flex;align-items:center;gap:4px;height:58px;margin:4px 8px 8px;padding:0 0 0 6px;border-top:1px solid var(--line)}
.cu-cap .ico{width:34px;height:34px;border:0;border-radius:10px;background:none;color:#7a7980;display:grid;place-items:center;cursor:pointer;padding:0}
.cu-cap .icons{display:flex;gap:2px}
.cu-cap .err{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:230px;font-weight:700;font-size:13px;line-height:1.22;letter-spacing:-.005em;color:var(--err);opacity:0;pointer-events:none}
.cu-cap .go{margin-left:auto;height:40px;min-width:96px;padding:0 18px;border:0;border-radius:11px;color:#fff;font:900 13.5px "Satoshi",sans-serif;letter-spacing:.09em;cursor:pointer;
  background:linear-gradient(170deg,oklch(.64 .15 255),oklch(.53 .18 262));box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 16px -8px oklch(.45 .18 262 / .8)}

/* ---- the tiles: small, real-looking dark patterns ---- */
.cu-cap .t-cookie{background:linear-gradient(#f6f2ea,#efe9de);justify-content:flex-end;padding:0}
.cu-cap .t-cookie .pg{position:absolute;left:10px;right:10px;top:11px;display:grid;gap:5px}
.cu-cap .t-cookie .pg i{display:block;height:5px;border-radius:3px;background:#ddd5c6}
.cu-cap .t-cookie .pg i:nth-child(2){width:70%}
.cu-cap .t-cookie .sh{position:relative;width:100%;background:#fff;padding:8px 9px 6px;border-top:1px solid rgba(0,0,0,.06);box-shadow:0 -6px 14px -8px rgba(0,0,0,.25)}
.cu-cap .t-cookie .sh p{font-size:9.5px;font-weight:700;text-align:left}
.cu-cap .t-cookie .btn{margin-top:5px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:900}
.cu-cap .t-cookie .rej{display:block;margin-top:3px;font-size:6.5px;font-weight:500;color:#a19d94}

.cu-cap .t-shame{background:radial-gradient(90% 80% at 30% 0%,oklch(.95 .06 90),oklch(.9 .07 70))}
.cu-cap .t-shame big{font-size:19px;font-weight:900;letter-spacing:-.03em}
.cu-cap .t-shame .btn{width:100%;height:22px;border-radius:99px;background:var(--ink);color:#ffd772;display:grid;place-items:center;font-size:10px;font-weight:900}
.cu-cap .t-shame u{font-size:9px;font-weight:500;color:#7d7462;text-underline-offset:1.5px}

.cu-cap .t-timer{background:radial-gradient(80% 70% at 50% 30%,#2a2530,#141217);color:#fff}
.cu-cap .t-timer small{font-size:8px;letter-spacing:.14em;font-weight:900;color:#ffd772}
.cu-cap .t-timer big{font-size:21px;font-weight:900;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:oklch(.7 .19 28)}
.cu-cap .t-timer span{font-size:9px;font-weight:700;color:#a49fab}

.cu-cap .t-pre{background:linear-gradient(170deg,oklch(.97 .015 250),oklch(.93 .025 250));align-items:flex-start;text-align:left;padding:12px}
.cu-cap .t-pre .row{display:flex;gap:6px;align-items:flex-start;font-size:10px}
.cu-cap .t-pre .bx{flex:none;width:14px;height:14px;border-radius:4px;background:var(--blue);display:grid;place-items:center;margin-top:-1px}
.cu-cap .t-pre .row.off .bx{background:#fff;box-shadow:inset 0 0 0 1.5px #b9bdc8}
.cu-cap .t-pre small{font-size:9px;font-weight:500;color:#7c8090;margin-left:20px;margin-top:-3px}

.cu-cap .t-dl{background:#eef1ec;gap:4px}
.cu-cap .t-dl .b{width:100%;height:19px;border-radius:5px;background:linear-gradient(#45b85f,#2f9a49);color:#fff;font-size:9px;font-weight:900;letter-spacing:.06em;display:flex;align-items:center;justify-content:center;gap:4px;position:relative}
.cu-cap .t-dl .b:nth-child(2){background:linear-gradient(#3da2e8,#2a84cf)}
.cu-cap .t-dl .b:nth-child(3){background:linear-gradient(#f08a3a,#d96d22)}
.cu-cap .t-dl .b sup{position:absolute;right:3px;top:2px;font-size:5.5px;opacity:.8}
.cu-cap .t-dl u{font-size:8.5px;font-weight:500;color:#8b9187}

.cu-cap .t-tinyx{background:repeating-linear-gradient(135deg,#d9d6d0 0 6px,#d2cfc8 6px 12px)}
.cu-cap .t-tinyx .m{position:relative;width:100%;padding:10px 8px 9px;border-radius:8px;background:#fff;box-shadow:0 8px 16px -8px rgba(0,0,0,.4)}
.cu-cap .t-tinyx .m big{display:block;font-size:11.5px;font-weight:900;letter-spacing:-.02em}
.cu-cap .t-tinyx .m .btn{margin-top:6px;height:20px;border-radius:5px;background:oklch(.6 .2 15);color:#fff;font-size:9px;font-weight:900;display:grid;place-items:center}
.cu-cap .t-tinyx .m .tx{position:absolute;right:3px;top:2px;font-size:5px;color:#c9c6bf;font-weight:500}

.cu-cap .t-spin{background:#fbfaf8}
.cu-cap .t-spin .ring{width:28px;height:28px;border-radius:50%;border:3px solid #e6e3dc;border-top-color:var(--ink)}
.cu-cap .t-spin span{font-size:9px;font-weight:500;color:var(--ink-3)}

.cu-cap .t-scarce{background:linear-gradient(170deg,oklch(.96 .03 30),oklch(.91 .06 30))}
.cu-cap .t-scarce big{font-size:16px;font-weight:900;color:oklch(.55 .21 27);letter-spacing:-.02em}
.cu-cap .t-scarce span{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:#7a4b45}
.cu-cap .t-scarce span i{width:6px;height:6px;border-radius:50%;background:oklch(.62 .2 27)}

.cu-cap .t-fee{background:linear-gradient(170deg,oklch(.97 .03 155),oklch(.92 .05 155));gap:2px}
.cu-cap .t-fee small{font-size:9px;font-weight:700;color:#3d6a4c}
.cu-cap .t-fee big{font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1}
.cu-cap .t-fee big sup{font-size:12px;vertical-align:14px}
.cu-cap .t-fee span{font-size:8.5px;font-weight:700;color:#6f8f7a;line-height:1.15;margin-top:4px}

.cu-cap .t-notif{background:#f1efea;align-items:stretch;justify-content:flex-start;padding:8px}
.cu-cap .t-notif .p{background:#fff;border-radius:8px;padding:8px;text-align:left;box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
.cu-cap .t-notif .p p{font-size:8.5px;font-weight:500;color:var(--ink-2)}
.cu-cap .t-notif .p b{display:flex;gap:4px;align-items:center;font-size:9.5px;margin-top:3px}

.cu-cap .t-notif .bs i+i{background:var(--blue);color:#fff;box-shadow:none}
.cu-cap .t-notif .when{font-size:8.5px;font-weight:500;color:var(--ink-3);margin-top:6px;text-align:center}

.cu-cap .t-roach{background:linear-gradient(170deg,#fff,#f2efe9);gap:3px}
.cu-cap .t-roach big{font-size:14px;font-weight:900;letter-spacing:-.02em}
.cu-cap .t-roach span{font-size:9px;line-height:1.15;font-weight:500;color:var(--ink-3)}

.cu-cap .t-robot{background:#f6f5f3}
.cu-cap .t-robot .r{display:flex;align-items:center;gap:6px;width:100%;padding:8px 6px;border-radius:4px;background:#fafafa;box-shadow:0 0 0 1px #d9d9d9,0 2px 4px rgba(0,0,0,.08);font-size:9px;font-weight:500;text-align:left}

.cu-cap .t-auto{background:radial-gradient(90% 80% at 50% 35%,#33303a,#121116);color:#fff;justify-content:space-between;padding:10px 9px 9px}
.cu-cap .t-auto .play{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;margin-top:12px}
.cu-cap .t-auto .bar{width:100%;display:flex;align-items:center;gap:5px;font-size:7.5px;font-weight:700;color:#ffd772}
.cu-cap .t-auto .bar i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.2);position:relative;overflow:hidden}
.cu-cap .t-auto .bar i b{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:2px}

.cu-cap .t-nag{background:linear-gradient(170deg,oklch(.97 .02 280),oklch(.92 .04 285));gap:4px}
.cu-cap .t-nag big{font-size:12px;font-weight:900}
.cu-cap .t-nag .st{display:flex;gap:1px}
.cu-cap .t-nag span{font-size:8.5px;font-weight:500;color:#7f7a92}

.cu-cap .t-exit{background:linear-gradient(170deg,oklch(.95 .05 350),oklch(.9 .07 350));gap:4px}
.cu-cap .t-exit big{font-size:14px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.cu-cap .t-exit .btn{width:100%;height:20px;border-radius:99px;background:oklch(.55 .2 355);color:#fff;font-size:9px;font-weight:900;display:grid;place-items:center}
.cu-cap .t-exit u{font-size:8px;font-weight:500;color:#a77d8d}

</style>

<script>/* inlined from ../_kit/reel.js */
/* Shared runtime for the Cursed UI pages.
   - a simulation clock (K.now, ms) advanced by K.tick(ms): rAF in the browser, stepped by the recorder (?manual)
   - tweens, easing, the hook <-> outro swap (window.__outro), and the reel cursor driven by real pointer events
   - opts.embedded: a private clock for a component mounted elsewhere (the game): no reel cursor, no globals, own rAF loop,
     K.stop() ends it. Pointer position is still tracked (K.px/K.py) */
window.ReelKit = function (opts) {
  if (opts.embedded) return ReelKit.embedded(opts);
  const qs = new URLSearchParams(location.search);
  const REEL = qs.has('reel'), MANUAL = qs.has('manual');
  if (REEL) document.body.classList.add('reel');

  const K = { REEL, MANUAL, now: 0, px: -999, py: -999, down: false };
  const tweens = [];
  K.ease = {
    lin: t => t,
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
    back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  K.tween = (dur, fn, e = K.ease.out, delay = 0) => { const tw = { t0: K.now + delay, dur, fn, e }; tweens.push(tw); return tw; };
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.lerp = (a, b, t) => a + (b - a) * t;
  /* critically-ish damped spring step: z = damping ratio */
  K.spring = (s, target, k, z, dt) => { s.v += (k * (target - s.x) - 2 * Math.sqrt(k) * z * s.v) * dt; s.x += s.v * dt; };

  /* ---------- cursor ---------- */
  document.body.insertAdjacentHTML('beforeend', `<div id="cursor">
    <div id="ring"></div>
    <svg id="c-arrow" width="26" height="34" viewBox="0 0 26 34"><path d="M2 2 L2 26 L8.2 20.4 L12.4 30.4 L16.6 28.6 L12.5 18.9 L20.8 18.6 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    <svg id="c-hand" width="30" height="34" viewBox="0 0 30 34" style="display:none;left:-9px;top:-2px"><path d="M10 15V5.2a2.6 2.6 0 0 1 5.2 0V13 M15.2 12.6a2.5 2.5 0 0 1 5 0v1.8 M20.2 13.6a2.5 2.5 0 0 1 5 0v6.2c0 6.6-4 11.2-10 11.2-4.6 0-6.7-2.2-9.4-6.5L3 19.6a2.5 2.5 0 0 1 4.2-2.7L10 20.8V15" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>

ReelKit.embedded = function (opts) {
  const K = { REEL: false, MANUAL: false, embedded: true, now: 0, px: -999, py: -999, down: false };
  const tweens = [];
  K.ease = {
    lin: t => t,
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
    back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  K.tween = (dur, fn, e = K.ease.out, delay = 0) => { const tw = { t0: K.now + delay, dur, fn, e }; tweens.push(tw); return tw; };
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.lerp = (a, b, t) => a + (b - a) * t;
  K.spring = (s, target, k, z, dt) => { s.v += (k * (target - s.x) - 2 * Math.sqrt(k) * z * s.v) * dt; s.x += s.v * dt; };
  K.moveCursor = () => {};
  const mv = e => { K.px = e.clientX; K.py = e.clientY; };
  const dn = () => { K.down = true; }, up = () => { K.down = false; };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerdown', dn); window.addEventListener('pointerup', up);
  function tick(ms) {
    const n = Math.max(1, Math.ceil(ms / 4));
    for (let i = 0; i < n; i++) { K.now += ms / n; opts.update(ms / n / 1000); }
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (K.now < tw.t0) continue;
      const p = tw.dur <= 1 ? 1 : Math.min(1, (K.now - tw.t0) / tw.dur);
      tw.fn(tw.e(p));
      if (p >= 1) tweens.splice(i, 1);
    }
    opts.render();
  }
  K.tick = tick;
  let raf = 0, alive = false;
  K.start = () => {
    if (alive) return; alive = true;
    let last = performance.now();
    raf = requestAnimationFrame(function loop(t) { if (!alive) return; tick(Math.min(50, t - last)); last = t; raf = requestAnimationFrame(loop); });
  };
  K.stop = () => {
    alive = false; cancelAnimationFrame(raf);
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerdown', dn); window.removeEventListener('pointerup', up);
  };
  return K;
};

        const el = grid.lastElementChild;
        tiles.push({ el, img: el.querySelector('.img'), chk: el.querySelector('.chk'), kind: '', sel: false, s: { x: 0, v: 0 }, face: null });
      }
      const errS = { x: 0, v: 0 };
