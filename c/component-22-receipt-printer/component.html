<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt printer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: oklch(0.71 0.175 50);
    --stage-lift: oklch(0.78 0.16 58);
    --ink: oklch(0.24 0.05 50);
    --paper: oklch(0.985 0.004 90);
    --paper-ink: oklch(0.24 0.012 60);
    --paper-ink-2: oklch(0.47 0.012 60);
    --body: oklch(0.955 0.006 80);
    --body-deep: oklch(0.86 0.008 80);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter Tight", system-ui, sans-serif;
    background: radial-gradient(60% 50% at 50% 42%, var(--stage-lift), var(--stage));
    background-color: var(--stage);
    color: var(--ink);
    display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: var(--ink); color: var(--paper); }
  em, i { font-style: normal; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* a fixed 440 x 700 object, scaled as one piece. The slot sits at y = 548 */
  .fit { position: relative; width: 440px; height: 700px; flex: none; }

  /* the paper. It leaves the slot going up, header first, like a real thermal printer */
  .feed { position: absolute; left: 0; right: 0; top: 0; height: 548px; }
  .feed.printing { clip-path: inset(-60px -200px 0 -200px); }
  .feed.printing .shadowbox { filter: none; }
  .shadowbox {
    position: absolute; left: 52px; top: 0; width: 336px;
    will-change: transform;
    filter: drop-shadow(0 1px 1px oklch(0.3 0.08 45 / 0.28)) drop-shadow(0 16px 20px oklch(0.3 0.1 45 / 0.26));
  }
  .paper { position: relative; width: 336px; background: var(--paper); color: var(--paper-ink); padding: 26px 26px 34px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .paper:active { cursor: grabbing; }
  /* paper shade near the slot, as the printer's lip lifts it */
  .curl { position: absolute; inset: auto 0 0; height: 46px; background: linear-gradient(oklch(0.5 0.02 60 / 0), oklch(0.5 0.02 60 / 0.09)); pointer-events: none; }
  .paper h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; text-align: center; }
  .paper .where { margin-top: 2px; text-align: center; font-size: 13px; font-weight: 500; color: var(--paper-ink-2); }
  .meta { display: flex; justify-content: space-between; margin-top: 16px; font-size: 13px; font-weight: 500; color: var(--paper-ink-2); font-variant-numeric: tabular-nums; }
  .rows { margin-top: 12px; padding-top: 12px; background: repeating-linear-gradient(90deg, var(--paper-ink) 0 3px, transparent 3px 7px) top / 100% 1.5px no-repeat; }
  .rowline { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px; padding: 3.5px 0; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .rowline b { font-weight: 500; color: var(--paper-ink-2); }
  .rowline small { display: block; grid-column: 2; font-size: 12.5px; font-weight: 400; color: var(--paper-ink-2); }
  .sums { margin-top: 10px; padding-top: 10px; background: repeating-linear-gradient(90deg, var(--paper-ink) 0 3px, transparent 3px 7px) top / 100% 1.5px no-repeat; font-variant-numeric: tabular-nums; }
  .sumline { display: flex; justify-content: space-between; padding: 2px 0; font-size: 13.5px; font-weight: 500; color: var(--paper-ink-2); }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 27px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .total span:first-child { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .code { display: flex; justify-content: center; gap: 2px; height: 44px; margin-top: 16px; }
  .code i { display: block; background: var(--paper-ink); }
  .thanks { margin-top: 8px; text-align: center; font-size: 13px; font-weight: 500; color: var(--paper-ink-2); font-variant-numeric: tabular-nums; }

  /* what stays in the slot: a jagged stub, the same edge the receipt tore along */
  .stub { position: absolute; left: 52px; top: 524px; width: 336px; height: 26px; background: var(--paper); }

  /* the printer, seen from above on the desk */
  .printer {
    position: absolute; left: 0; right: 0; top: 540px; height: 152px; z-index: 5; border-radius: 16px 16px 34px 34px;
    background: linear-gradient(oklch(0.985 0.004 80), var(--body) 30%, var(--body-deep));
    box-shadow: inset 0 1.5px 0 oklch(1 0 0), 0 2px 3px oklch(0.3 0.08 45 / 0.35), 0 34px 44px -18px oklch(0.3 0.12 40 / 0.6);
  }
  .lip { position: absolute; left: 24px; right: 24px; top: 0; height: 18px; border-radius: 0 0 8px 8px; background: linear-gradient(oklch(0.22 0.01 60), oklch(0.32 0.01 60)); box-shadow: inset 0 -1px 0 oklch(0.5 0.01 60), 0 1px 0 oklch(1 0 0); }
  .teeth { position: absolute; left: 24px; top: -7px; width: 392px; height: 9px; display: block; }
  .controls { position: absolute; left: 24px; right: 24px; top: 36px; bottom: 22px; display: flex; align-items: center; gap: 20px; }
  /* a window onto the roll: it spins with the feed and gets thinner */
  .roll { flex: none; width: 92px; height: 92px; border-radius: 50%; background: oklch(0.27 0.012 60); box-shadow: inset 0 3px 6px oklch(0 0 0 / 0.55), 0 1px 0 oklch(1 0 0); display: grid; place-items: center; overflow: hidden; position: relative; }
  .roll svg { display: block; }
  .roll::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, oklch(1 0 0 / 0.22), transparent 42%); pointer-events: none; }
  .state { flex: 1; min-width: 0; }
  .state b { display: block; font-size: 17px; font-weight: 700; letter-spacing: -0.015em; color: oklch(0.25 0.012 60); }
  .state small { display: block; margin-top: 2px; font-size: 13.5px; font-weight: 500; color: oklch(0.47 0.012 60); font-variant-numeric: tabular-nums; }
  .go {
    flex: none; width: 112px; height: 62px; border: 0; border-radius: 16px; padding: 0 6px;
    background: oklch(0.71 0.175 50); color: oklch(0.21 0.05 50); font: inherit; font-size: 15.5px; font-weight: 800; letter-spacing: -0.01em;
    cursor: pointer;
    box-shadow: 0 1px 1px oklch(0.3 0.08 45 / 0.5), 0 7px 12px -4px oklch(0.3 0.1 45 / 0.55);
    transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out), opacity 160ms var(--ease-out);
  }
  .go:active:not([aria-disabled="true"]) { transform: translateY(3px); box-shadow: 0 1px 1px oklch(0.3 0.03 60 / 0.4); }
  .go:focus-visible { outline: 3px solid oklch(0.24 0.05 50); outline-offset: 3px; }
  .go[aria-disabled="true"] { cursor: default; opacity: 0.55; }
</style>
</head>
<body>
<div class="fit" id="fit">
  <div class="stub" id="stub" aria-hidden="true"></div>
  <div class="feed" id="feed">
    <div class="shadowbox" id="box">
      <div class="paper" id="paper" aria-label="Receipt" role="group"></div>
    </div>
  </div>
  <div class="printer">
    <svg class="teeth" viewBox="0 0 392 9" aria-hidden="true"><defs><linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="oklch(0.62 0.006 250)"/><stop offset="0.35" stop-color="oklch(0.9 0.004 250)"/><stop offset="0.7" stop-color="oklch(0.66 0.006 250)"/><stop offset="1" stop-color="oklch(0.84 0.004 250)"/></linearGradient></defs><path id="teethPath" fill="url(#steel)"/></svg>
    <div class="lip"></div>
    <div class="controls">
      <div class="roll" aria-hidden="true">
        <svg width="92" height="92" viewBox="0 0 92 92"><circle id="rollPaper" cx="46" cy="46" r="38" fill="var(--paper)"/><circle id="rollRings" cx="46" cy="46" r="30" fill="none" stroke="oklch(0.86 0.006 80)" stroke-width="1"/><g id="rollCore"><circle cx="46" cy="46" r="13" fill="oklch(0.74 0.05 70)"/><circle cx="46" cy="46" r="7" fill="oklch(0.27 0.012 60)"/><rect x="44.5" y="33" width="3" height="6" fill="oklch(0.5 0.05 60)"/></g></svg>
      </div>
      <div class="state"><b id="stateName">Ready</b><small id="stateInfo">Order 0418</small></div>
      <button class="go" id="go" type="button">Print</button>
    </div>
  </div>
</div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const fit = $('fit'), feedEl = $('feed'), box = $('box'), paper = $('paper'), stub = $('stub'), go = $('go');
  const WIDTH = 336, SLOT = 548, TEARLINE = 16;  // the tear runs 16px above the slot
  const TEETH = 24, FLICK = 0.11, TEAR_AT = 150;

  let scale = 1;
  function resize() {
    // 780: a corner of the receipt rises above the box during a full tear
    scale = Math.min(1, (innerWidth - 16) / 440, (innerHeight - 16) / 780);
    fit.style.transform = `scale(${scale})`;
    fit.style.margin = `${(700 * scale - 700) / 2}px ${(440 * scale - 440) / 2}px`;
  }
  addEventListener('resize', resize); resize();
  $('teethPath').setAttribute('d', 'M0 9' + Array.from({ length: 40 }, (_, i) => `L${i * 9.8 + 4.9} 0.5L${(i + 1) * 9.8} 9`).join('') + 'Z');

  // prices include 15% VAT, the Norwegian rate for food and drink. Everything below is added up, not typed.
  const ORDERS = [
    { no: '0418', time: '14:22', items: [[2, 'Filter coffee', 42], [1, 'Cardamom bun', 48], [1, 'Oat flat white', 62, 'extra shot'], [1, 'Rye sandwich', 96], [1, 'Beans, Halden blend', 189, '250 g, whole']] },
    { no: '0419', time: '14:26', items: [[1, 'Cortado', 52], [2, 'Cinnamon bun', 46], [1, 'Sparkling water', 38]] },
    { no: '0420', time: '14:31', items: [[3, 'Filter coffee', 42], [1, 'Chocolate cake', 72, 'to go'], [1, 'Oat milk, carton', 39], [2, 'Rye sandwich', 96]] },
  ];
  const kr = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace(',', ' ');
  function receipt(o) {
    const sum = o.items.reduce((s, [q, , p]) => s + q * p, 0);
    const vat = sum - sum / 1.15;
    // bars from the order number: decorative, not a scannable symbology
    const bars = [...(o.no + o.no + o.no)].flatMap(d => [+d % 3 + 1, +d % 2 + 2]).map((w, i) => `<i style="width:${w + (i % 3 === 0 ? 1 : 0)}px;margin-right:${(i % 4) + 1}px"></i>`).join('');
    return `<h1>Halden Kaffe</h1><p class="where">Storgata 14, 0184 Oslo</p>
      <div class="meta"><span>Order ${o.no}</span><span>3 Nov, ${o.time}</span></div>
      <div class="rows">${o.items.map(([q, n, p, note]) => `<div class="rowline"><b>${q}</b><span>${n}</span><span>${kr(q * p)}</span>${note ? `<small>${note}</small>` : ''}</div>`).join('')}</div>
      <div class="sums"><div class="sumline"><span>Includes VAT 15%</span><span>${kr(vat)}</span></div>
      <div class="total"><span>Total NOK</span><span>${kr(sum)}</span></div></div>
      <div class="code" aria-hidden="true">${bars}</div>
      <p class="thanks">Thanks. Paid by card ending 4021</p><div class="curl"></div>`;
  }

  // the edge: a seeded zigzag. The same points cut the receipt's bottom, the stub's top, and the next receipt's top.
  function edge(seed) {
    let s = seed * 9301 + 49297;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    return Array.from({ length: TEETH * 2 + 1 }, (_, i) => [
      i / (TEETH * 2) * WIDTH,
      (i % 2 ? 5 : 0) + (rnd() - 0.5) * 3.2,
    ]);
  }
  const edgePoly = (e, y) => e.map(([x, d]) => `${x.toFixed(1)}px ${(y + d).toFixed(1)}px`);
  function clipPaper(top, bottom, h) {
    paper.style.clipPath = `polygon(${[...edgePoly(top, 5), ...edgePoly(bottom, h - 5).reverse()].join(',')})`;
  }
  function clipStub(e) {
    stub.style.clipPath = `polygon(${[...edgePoly(e, 3), `${WIDTH}px 26px`, '0 26px'].join(',')})`;
  }

  /* state: idle (nothing out, Print) -> printing -> ready (attached, Tear off) -> torn (Print next) */
  let state = 'idle', orderIndex = 0, seed = 3;
  let topEdge = edge(seed), nextEdge = edge(seed + 1);
  let H = 0, fed = 0;                            // receipt height, how far it's out
  let printedTotal = 0;                          // paper used, for the roll
  const say = t => { live.textContent = ''; setTimeout(() => live.textContent = t, 30); };
  const live = $('live');
  clipStub(topEdge);

  // transform state
  const T = { x: 0, y: 0, r: 0, vx: 0, vy: 0, vr: 0, tx: 0, ty: 0, tr: 0, ox: 168, p: 0, vp: 0, tp: 0, side: 1, sway: 0, vsway: 0 };

  function place() {
    // the feed offset puts the paper's bottom edge at the tear line once it's fully out
    const baseY = SLOT - TEARLINE - fed;
    box.style.top = baseY + 'px';
    box.style.transformOrigin = `${T.ox}px ${H}px`;
    const swayRot = T.sway;
    box.style.transform = `translate3d(${T.x.toFixed(2)}px, ${T.y.toFixed(2)}px, 0) rotate(${(T.r + swayRot).toFixed(3)}deg)`;
  }
  function spinRoll() {
    const left = Math.max(0, 1 - printedTotal / 2500);
    const r = 19 + 19 * Math.sqrt(left);         // area of a roll, not its radius, goes down with the paper used
    $('rollPaper').setAttribute('r', r.toFixed(2));
    $('rollRings').setAttribute('r', Math.max(15, r - 7).toFixed(2));
    $('rollCore').setAttribute('transform', `rotate(${(-printedTotal / r * 57.3).toFixed(1)} 46 46)`);
  }

  function setUI(name, info, btn, on = true) {
    $('stateName').textContent = name; $('stateInfo').textContent = info;
    // aria-disabled, not disabled: the button keeps focus while it prints
    go.textContent = btn; go.setAttribute('aria-disabled', !on);
  }

  // print: the motor moves in steps, so the paper does too
  function print(instant) {
    if (state === 'printing') return;
    const o = ORDERS[orderIndex % ORDERS.length];
    paper.innerHTML = receipt(o);
    paper.style.height = 'auto';
    box.style.display = 'block';
    H = paper.offsetHeight;
    paper.style.height = H + 'px';
    clipPaper(topEdge, nextEdge, H);
    Object.assign(T, { x: 0, y: 0, r: 0, vx: 0, vy: 0, vr: 0, tx: 0, ty: 0, tr: 0, p: 0, tp: 0, vp: 0, sway: 0, vsway: 0 });
    fed = 0;
    feedEl.classList.add('printing');
    state = 'printing';
    setUI('Printing', `Order ${o.no}`, 'Printing', false);
    say(`Printing order ${o.no}`);
    place();
    if (instant || reduce) { finishPrint(o, instant); return; }
    let lastT = performance.now(), acc = 0;
    const STEP = 7, EVERY = 22;                  // 7px every 22ms
    (function step(now) {
      if (state !== 'printing') return;
      acc += now - lastT; lastT = now;
      while (acc >= EVERY && fed < H) {
        acc -= EVERY;
        fed = Math.min(H, fed + STEP);
        printedTotal += STEP;
        // each step gives the free end a tiny kick, which springs out
        T.vsway += (Math.random() - 0.5) * 2.4;
      }
      T.vsway += (-90 * T.sway - 9 * T.vsway) * 0.016; T.sway += T.vsway * 0.016;
      if (fed > 14) clipStub(nextEdge);
      place(); spinRoll();
      if (fed < H) requestAnimationFrame(step);
      else finishPrint(o);
    })(lastT);
  }
  function finishPrint(o, instant) {
    if (fed < H) printedTotal += H - fed;
    fed = H; T.sway = 0;
    feedEl.classList.remove('printing');
    clipStub(nextEdge);
    place(); spinRoll();
    state = 'ready';
    setUI('Printed', 'Pull one side to tear', 'Tear off');
    if (!instant) say(`Order ${o.no} printed. Tear it off.`);
  }

  // the tear: pull one side up and the rip runs across the teeth from that side.
  // The receipt pivots on the tip of the rip, which walks along the bottom edge.
  function setTear(p) {
    T.p = p;
    const walked = p * WIDTH;
    T.ox = T.side > 0 ? WIDTH - walked : walked;
    T.r = -T.side * p * 13;                      // right side up = anticlockwise
    T.y = -p * 6;
    if (state === 'ready') {
      const on = p > 0.02;
      $('stateName').textContent = on ? 'Tearing' : 'Printed';
      $('stateInfo').textContent = on ? `Rip is ${Math.round(p * 100)}% across` : 'Pull one side to tear';
    }
  }

  let spring = 0, drag = null, lastTooth = 0, walking = false;
  function loop(now) {
    spring = 0;
    const dt = Math.max(0, Math.min(0.032, (now - loopT) / 1000)); loopT = now;
    let moving = false;
    let t = dt;
    while (t > 0) {
      const h = Math.min(t, 1 / 240); t -= h;
      if (state === 'torn') {
        T.vx += (150 * (T.tx - T.x) - 15 * T.vx) * h; T.x += T.vx * h;
        T.vy += (150 * (T.ty - T.y) - 15 * T.vy) * h; T.y += T.vy * h;
        T.vr += (120 * (T.tr - T.r) - 13 * T.vr) * h; T.r += T.vr * h;
      } else {
        T.vp += (T.k * (T.tp - T.p) - T.c * T.vp) * h;
        setTear(Math.max(0, T.p + T.vp * h));
      }
    }
    moving = state === 'torn'
      ? Math.abs(T.vx) + Math.abs(T.vy) + Math.abs(T.vr) + Math.abs(T.tx - T.x) + Math.abs(T.ty - T.y) + Math.abs(T.tr - T.r) > 0.03
      : Math.abs(T.vp) + Math.abs(T.tp - T.p) > 0.0008;
    place();
    if (moving || drag) spring = requestAnimationFrame(loop);
  }
  let loopT = 0;
  function wake() { if (!spring) { loopT = performance.now(); spring = requestAnimationFrame(loop); } }
  T.k = 700; T.c = 48;

  function rip(vx, vy) {
    if (state === 'torn') return;
    state = 'torn'; drag = null;
    T.p = 1;
    const o = ORDERS[orderIndex % ORDERS.length];
    // velocity kept: px/ms to px/s, damped by the desk
    T.vx = vx * 600; T.vy = vy * 600; T.vr = -T.side * 40 + vx * 40;
    // it slides up the desk, further the harder you flicked, and rests at a slight angle
    T.tx = T.side * 6 + Math.max(-34, Math.min(34, vx * 50));
    T.ty = -24 + Math.max(-20, Math.min(0, vy * 30));
    T.tr = T.side * -2.6;
    topEdge = nextEdge; seed += 2; nextEdge = edge(seed);
    orderIndex++;
    const next = ORDERS[orderIndex % ORDERS.length];
    setUI('Torn off', `Next: order ${next.no}`, 'Print next');
    say(`Order ${o.no} torn off`);
    if (reduce) { T.x = T.tx; T.y = T.ty; T.r = T.tr; T.vx = T.vy = T.vr = 0; place(); return; }
    wake();
  }

  paper.addEventListener('pointerdown', e => {
    if (!e.isPrimary || e.button !== 0 || drag || walking || state !== 'ready') return;
    paper.setPointerCapture(e.pointerId);
    const b = paper.getBoundingClientRect();
    T.side = e.clientX > b.left + b.width / 2 ? 1 : -1;   // the rip starts on the side you hold
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, lt: e.timeStamp, vx: 0, vy: 0 };
    T.k = 1400; T.c = 70; wake();
  });
  paper.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dt = Math.max(1, e.timeStamp - drag.lt);
    drag.vx = 0.6 * drag.vx + 0.4 * ((e.clientX - drag.lx) / scale / dt);
    drag.vy = 0.6 * drag.vy + 0.4 * ((e.clientY - drag.ly) / scale / dt);
    drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = e.timeStamp;
    // pulling up or out to your side both count, sliding back does not
    const pull = Math.max(0, -(e.clientY - drag.sy) / scale + T.side * (e.clientX - drag.sx) / scale * 0.6);
    T.tp = Math.min(1, pull / TEAR_AT);
    const tooth = Math.floor(T.tp * TEETH);
    if (tooth !== lastTooth) { lastTooth = tooth; if (navigator.userActivation?.hasBeenActive) navigator.vibrate?.(3); }   // a tick per tooth, where phones allow it
    if (T.tp >= 1) { const d = drag; drag = null; rip(d.vx, d.vy); return; }
    wake();
  });
  const release = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    const speed = Math.hypot(d.vx, d.vy);
    if (T.p > 0.55 || (speed > FLICK && e.timeStamp - d.lt < 90 && d.vy < 0 && T.p > 0.04)) { rip(d.vx, d.vy); return; }
    T.tp = 0; T.k = 900; T.c = 60; wake();       // let go early: it snaps back in under 200ms
  };
  paper.addEventListener('pointerup', release);
  paper.addEventListener('pointercancel', release);

  // the button is the same three steps, so keyboard and touch can do it all
  function autoTear() {
    if (reduce) { T.side = 1; setTear(1); rip(0, 0); T.x = T.tx; T.y = T.ty; T.r = T.tr; T.vx = T.vy = T.vr = 0; place(); return; }
    if (walking) return;
    T.side = 1; T.tp = 0; T.k = 70; T.c = 12;
    walking = true;
    const start = performance.now();
    (function walk(now) {
      if (state !== 'ready') { walking = false; return; }
      const u = Math.max(0, Math.min(1, (now - start) / 420));
      setTear(u * u * (3 - 2 * u)); place();
      if (u < 1) requestAnimationFrame(walk); else { walking = false; rip(0.12, -0.25); }
    })(start);
  }
  go.addEventListener('click', () => {
    if (state === 'idle' || state === 'torn') {
      // the last receipt slides away up the desk
      if (state === 'torn') {
        const ghost = box.cloneNode(true);
        ghost.removeAttribute('id'); ghost.querySelector('.paper').removeAttribute('id');
        ghost.inert = true; ghost.style.pointerEvents = 'none';
        feedEl.parentNode.insertBefore(ghost, feedEl);
        const from = getComputedStyle(box).transform;
        ghost.animate([{ transform: from, opacity: 1 }, { transform: `${from} translateY(-90px)`, opacity: 0 }],
          { duration: reduce ? 1 : 260, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' }).onfinish = () => ghost.remove();
      }
      box.style.display = 'none';
      print();
    } else if (state === 'ready') autoTear();
  });

  // stills and the demo loop
  const params = new URLSearchParams(location.search);
  const still = params.get('still');
  box.style.display = 'none';
  // the receipt's height is measured, so wait for the real font
  document.fonts.ready.then(() => {
    if (still) print(true);
    if (still === 'tear') {
      T.side = 1; setTear(Number(params.get('p') || 0.62)); T.tp = T.p; place();
    }
    if (still === 'torn') {
      T.side = 1; setTear(1); rip(0, 0);
      cancelAnimationFrame(spring); spring = 0;
      T.x = T.tx; T.y = T.ty; T.r = T.tr; T.vx = T.vy = T.vr = 0; place();
    }
  });
  if (params.has('demo')) {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async function loop2() {
      await wait(800); go.click();
      await wait(2600); go.click();
      await wait(1800); loop2();
    })();
  }
</script>
</body>
</html>
