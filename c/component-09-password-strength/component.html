<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password strength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
<style>
  :root {
    --stage: oklch(0.3 0.05 252);
    --stage-lift: oklch(0.37 0.06 252);
    --panel: oklch(0.99 0.004 252);
    --soft: oklch(0.955 0.01 252);
    --line: oklch(0.9 0.012 252);
    --ink: oklch(0.21 0.025 252);
    --ink-2: oklch(0.49 0.02 252);
    --focus: oklch(0.55 0.15 255);
    --s0: oklch(0.58 0.2 25);
    --s1: oklch(0.68 0.17 50);
    --s2: oklch(0.78 0.15 85);
    --s3: oklch(0.68 0.15 140);
    --s4: oklch(0.58 0.14 160);
    /* darker shades of the same hues for text, so the word passes contrast */
    --w0: oklch(0.5 0.19 25); --w1: oklch(0.5 0.14 50); --w2: oklch(0.5 0.1 75);
    --w3: oklch(0.48 0.12 145); --w4: oklch(0.46 0.12 160);
    --spring: linear(0, 0.08 3%, 0.29 7.5%, 0.62 14%, 0.86 21%, 0.99 28%, 1.04 34%, 1.045 39%, 1.03 46%, 1.005 58%, 0.997 70%, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter Tight", system-ui, sans-serif;
    background: radial-gradient(60% 45% at 50% 45%, var(--stage-lift), var(--stage));
    color: var(--ink);
    display: grid; place-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--line); color: var(--ink); }
  em, i { font-style: normal; }

  .card {
    width: min(420px, 100%);
    background: var(--panel);
    border-radius: 28px;
    padding: 26px 24px 24px;
    box-shadow: 0 50px 90px -40px oklch(0.1 0.04 252 / 0.85), 0 10px 24px -12px oklch(0.1 0.04 252 / 0.4);
  }
  label { display: block; font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .field { position: relative; }
  .field input {
    width: 100%; height: 54px; padding: 0 54px 0 16px; border-radius: 16px;
    border: 1.5px solid var(--line); background: var(--panel); outline: none;
    font: inherit; font-size: 17px; font-weight: 500; color: var(--ink); caret-color: var(--focus);
    letter-spacing: 0.01em;
    transition: border-color 200ms, box-shadow 200ms;
  }
  .field input:focus { border-color: var(--focus); box-shadow: 0 0 0 4px oklch(0.55 0.15 255 / 0.15); }
  .field input::placeholder { color: var(--ink-2); }
  .eye {
    position: absolute; right: 6px; top: 7px; width: 40px; height: 40px; border-radius: 12px;
    border: 0; background: none; color: var(--ink-2); display: grid; place-items: center; cursor: pointer;
  }
  .eye:hover { background: var(--soft); color: var(--ink); }
  .eye:focus-visible { outline: 2px solid var(--focus); }
  .eye svg { width: 19px; height: 19px; }

  /* four segments; the score decides how many fill and which colour they share */
  .meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 10px; }
  .meter i { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
  .meter i::after {
    content: ""; display: block; height: 100%; background: var(--c, var(--s0));
    transform: scaleX(0); transform-origin: left;
    transition: transform 420ms var(--spring), background 300ms;
    transition-delay: calc(var(--n) * 60ms);
  }
  .meter i.on::after { transform: scaleX(1); }
  .verdict { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--ink-2); min-height: 20px; font-variant-numeric: tabular-nums; }
  .verdict b { color: var(--cw, var(--ink)); font-weight: 700; transition: color 300ms; }

  .rules { list-style: none; padding: 0; display: grid; gap: 9px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .rules li { display: flex; align-items: center; gap: 10px; font-size: 14.5px; color: var(--ink-2); transition: color 200ms; }
  .rules .dot {
    width: 20px; height: 20px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    box-shadow: inset 0 0 0 1.5px var(--line); color: transparent;
    transition: background 250ms, box-shadow 250ms, color 250ms;
  }
  .rules .dot svg { width: 13px; height: 13px; stroke-width: 3; }
  .rules li.ok { color: var(--ink); }
  .rules li.ok .dot { background: var(--s4); box-shadow: none; color: var(--panel); animation: tick 460ms var(--spring); }
  @keyframes tick { 40% { transform: scale(1.25); } }
  .hint:empty { display: none; }
  .hint { margin-top: 14px; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); min-height: 20px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; transition-delay: 0ms !important; animation-duration: 1ms !important; }
  }
</style>
</head>
<body>
<main class="card">
  <label for="pw">Create a password</label>
  <div class="field">
    <input id="pw" type="password" autocomplete="new-password" placeholder="At least 12 characters"
      aria-describedby="verdict rules hint" spellcheck="false">
    <button class="eye" type="button" id="eye" aria-label="Show password" aria-pressed="false"><i data-lucide="eye"></i></button>
  </div>
  <div class="meter" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i></div>
  <p class="verdict" id="verdict" aria-live="polite"><b id="word"></b><span id="time"></span></p>
  <ul class="rules" id="rules">
    <li data-rule="len"><span class="dot"><i data-lucide="check"></i></span>12 characters or more</li>
    <li data-rule="mix"><span class="dot"><i data-lucide="check"></i></span>Upper and lower case</li>
    <li data-rule="num"><span class="dot"><i data-lucide="check"></i></span>A number or a symbol</li>
    <li data-rule="leak"><span class="dot"><i data-lucide="check"></i></span>Not a known password or pattern</li>
  </ul>
  <p class="hint" id="hint"></p>
</main>
<script>
  lucide.createIcons({ attrs: { 'stroke-width': 2.2 } });
  const pw = document.getElementById('pw');
  const eye = document.getElementById('eye');
  const segs = [...document.querySelectorAll('.meter i')];
  const WORDS = ['Too easy', 'Weak', 'Weak', 'Strong', 'Very strong'];
  const card = document.querySelector('.card');

  // zxcvbn guesses like an attacker would: dictionaries, names, dates, keyboard patterns
  function check() {
    const v = pw.value;
    const r = zxcvbn(v);
    const score = v ? r.score : -1;
    card.style.setProperty('--c', `var(--s${Math.max(score, 0)})`);
    card.style.setProperty('--cw', `var(--w${Math.max(score, 0)})`);
    const fill = v ? [1, 1, 2, 3, 4][score] : 0;
    segs.forEach((s, i) => s.classList.toggle('on', i < fill));
    document.getElementById('word').textContent = v ? WORDS[score] : '';
    document.getElementById('time').textContent = v
      ? `${r.crack_times_display.offline_slow_hashing_1e4_per_second} to crack` : '';
    const rules = {
      len: v.length >= 12,
      mix: /[a-z]/.test(v) && /[A-Z]/.test(v),
      num: /[\d\W_]/.test(v),
      // common passwords and keyboard runs fail; plain words in a long phrase are fine
      leak: v.length > 0 && !r.sequence.some(m => m.dictionary_name === 'passwords'
        || ['spatial', 'repeat', 'sequence'].includes(m.pattern)),
    };
    for (const [k, ok] of Object.entries(rules)) document.querySelector(`[data-rule="${k}"]`).classList.toggle('ok', ok);
    document.getElementById('hint').textContent = !v ? ''
      : score >= 3 && !r.feedback.warning ? 'Long and unusual. Nice.'
      : r.feedback.warning || r.feedback.suggestions[0] || '';
  }
  function init() {
  pw.addEventListener('input', check);
  eye.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', show);
    eye.innerHTML = `<i data-lucide="${show ? 'eye-off' : 'eye'}"></i>`;
    lucide.createIcons({ attrs: { 'stroke-width': 2.2 } });
    pw.focus();
  });
  check();

  const params = new URLSearchParams(location.search);
  if (params.has('pw')) {
    pw.value = params.get('pw');
    if (params.has('show')) eye.click();
    pw.focus(); check();
  }
  if (params.has('demo')) {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async function loop() {
      pw.value = ''; check(); if (pw.type === 'password') eye.click(); await wait(800);
      for (const ch of 'Summer2026') { pw.value += ch; check(); await wait(110); }
      await wait(1300);
      pw.value = ''; check(); await wait(300);
      for (const ch of 'Quiet tram, 4 lanterns') { pw.value += ch; check(); await wait(90); }
      await wait(2600); loop();
    })();
  }
  }
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
