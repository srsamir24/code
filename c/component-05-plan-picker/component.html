<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --stage: oklch(0.9 0.07 128);
    --stage-lift: oklch(0.94 0.05 125);
    --panel: oklch(0.995 0.004 128);
    --soft: oklch(0.96 0.012 128);
    --line: oklch(0.91 0.015 128);
    --ink: oklch(0.22 0.035 140);
    --ink-2: oklch(0.47 0.03 140);
    --accent: oklch(0.32 0.07 150);
    --on-accent: oklch(0.96 0.04 125);
    --save: oklch(0.86 0.15 125);
    --spring: linear(0, 0.08 3%, 0.29 7.5%, 0.62 14%, 0.86 21%, 0.99 28%, 1.04 34%, 1.045 39%, 1.03 46%, 1.005 58%, 0.997 70%, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter Tight", system-ui, sans-serif;
    background: radial-gradient(60% 45% at 50% 45%, var(--stage-lift), var(--stage));
    color: var(--ink);
    display: grid; place-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--save); color: var(--ink); }
  em, i { font-style: normal; }

  .panel {
    width: min(440px, 100%);
    background: var(--panel);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 50px 90px -40px oklch(0.35 0.08 130 / 0.6), 0 10px 24px -12px oklch(0.35 0.08 130 / 0.25);
  }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

  /* slide:css */
  .period { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: var(--soft); }
  .period::before {
    content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
    border-radius: 10px; background: var(--panel);
    box-shadow: 0 2px 6px -2px oklch(0.3 0.05 140 / 0.25);
    transition: translate 460ms var(--spring);
  }
  .period:has(#yearly:checked)::before { translate: 100% 0; }
  .digit { display: inline-block; height: 1em; overflow: hidden; vertical-align: top; }
  .digit > span { display: block; transition: transform 700ms var(--spring); transform: translateY(calc(var(--d) * -1em)); }
  /* /slide */
  .period label {
    position: relative; z-index: 1; padding: 8px 14px; text-align: center; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--ink-2); transition: color 200ms; white-space: nowrap;
  }
  .period input { position: absolute; opacity: 0; pointer-events: none; }
  .period input:checked + label { color: var(--ink); }
  .period input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }

  .plans { display: grid; gap: 8px; }
  .plan {
    position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
    padding: 16px 18px; border-radius: 18px; cursor: pointer;
    background: var(--soft);
    transition: background 300ms, color 300ms;
  }
  .plan input { position: absolute; opacity: 0; pointer-events: none; }
  .dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line); background: var(--panel); display: grid; place-items: center; transition: box-shadow 300ms var(--ease-out); }
  .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); scale: 0; transition: scale 400ms var(--spring); }
  .name { font-size: 16.5px; font-weight: 600; line-height: 1.3; }
  .name small { display: block; font-size: 13.5px; font-weight: 500; color: var(--ink-2); transition: color 300ms; }
  .price { text-align: right; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  .price small { font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; transition: color 300ms; }
  .plan:has(input:checked) { background: var(--accent); color: var(--on-accent); }
  .plan:has(input:checked) small { color: oklch(0.82 0.05 130); }
  .plan:has(input:checked) .dot { box-shadow: inset 0 0 0 2px var(--save); background: var(--save); }
  .plan:has(input:checked) .dot::after { scale: 1; }
  .plan:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
  .plan:not(:has(input:checked)):hover { background: oklch(0.94 0.018 128); }

  .save {
    display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 7px;
    font-size: 12px; font-weight: 700; background: var(--save); color: var(--ink);
    display: none;
  }
  .panel:has(#yearly:checked) .save { display: inline-block; animation: pop 420ms var(--spring); }
  @keyframes pop { from { opacity: 0; scale: 0.7; } }

  .cta {
    width: 100%; height: 54px; margin-top: 16px; border: 0; border-radius: 16px;
    background: var(--ink); color: var(--panel);
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-variant-numeric: tabular-nums;
    transition: transform 160ms var(--ease-out), background 160ms;
  }
  .cta:hover { background: oklch(0.28 0.04 140); }
  .cta:active { transform: scale(0.98); }
  .cta:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .cta svg { width: 18px; height: 18px; }
  .fine { margin-top: 12px; text-align: center; font-size: 13.5px; color: var(--ink-2); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
  @media (max-width: 400px) {
    .top { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<main class="panel">
  <div class="top">
    <h1>Pick a plan</h1>
    <!-- slide:html -->
    <div class="period" role="radiogroup" aria-label="Billing period">
      <input type="radio" name="period" id="monthly" value="monthly" checked><label for="monthly">Monthly</label>
      <input type="radio" name="period" id="yearly" value="yearly"><label for="yearly">Yearly</label>
    </div>
    <!-- /slide -->
  </div>
  <div class="plans" role="radiogroup" aria-label="Plan">
    <label class="plan"><input type="radio" name="plan" value="solo"><span class="dot"></span>
      <span class="name">Solo<small>1 seat, 3 projects</small></span><span class="price" data-m="15" data-y="12"></span></label>
    <label class="plan"><input type="radio" name="plan" value="studio" checked><span class="dot"></span>
      <span class="name">Studio<small>5 seats, unlimited projects</small></span><span class="price" data-m="39" data-y="31"></span></label>
    <label class="plan"><input type="radio" name="plan" value="agency"><span class="dot"></span>
      <span class="name">Agency<small>20 seats, client portals</small></span><span class="price" data-m="99" data-y="79"></span></label>
  </div>
  <button class="cta" type="button" id="cta"></button>
  <p class="fine">Billed <span id="billed">monthly</span><span class="save">Save 20%</span> · Cancel any time</p>
</main>
<script>
  lucide.createIcons();
  const prices = [...document.querySelectorAll('.price')];
  const cta = document.getElementById('cta');
  const billed = document.getElementById('billed');

  // slide:js
  const COL = [...'0123456789'].join('<br>');
  // each digit is a column 0-9, only --d changes
  function digits(el, value) {
    const s = String(value);
    if (el.dataset.len !== String(s.length)) {
      el.dataset.len = s.length;
      el.innerHTML = '$' + [...s].map(() =>
        `<span class="digit"><span>${COL}</span></span>`).join('') +
        '<small> /mo</small>';
    }
    el.querySelectorAll('.digit > span').forEach((col, i) => col.style.setProperty('--d', s[i]));
    el.setAttribute('aria-label', `$${value} a month`);
  }
  // /slide
  function update() {
    const yearly = document.getElementById('yearly').checked;
    prices.forEach(p => digits(p, yearly ? p.dataset.y : p.dataset.m));
    const plan = document.querySelector('input[name=plan]:checked').closest('.plan');
    const name = plan.querySelector('.name').firstChild.textContent;
    const val = plan.querySelector('.price').dataset[yearly ? 'y' : 'm'];
    cta.innerHTML = `Start ${name} for $${val}/mo <i data-lucide="arrow-right"></i>`;
    lucide.createIcons({ attrs: { 'stroke-width': 2.2 } });
    billed.textContent = yearly ? 'yearly' : 'monthly';
  }
  document.querySelectorAll('input').forEach(i => i.addEventListener('change', update));
  update();

  const params = new URLSearchParams(location.search);
  if (params.has('yearly')) { document.getElementById('yearly').checked = true; update(); }
  if (params.has('demo')) {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const set = (sel) => { document.querySelector(sel).checked = true; update(); };
    (async function loop() {
      await wait(1000); set('#yearly');
      await wait(1600); set('input[value=agency]');
      await wait(1400); set('#monthly');
      await wait(1400); set('input[value=studio]');
      loop();
    })();
  }
</script>
</body>
</html>
