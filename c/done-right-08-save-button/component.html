<!-- Demo page only. Not part of the component. -->
<style>

  body {

  .demo-card { background: #FFFFFF; border: 1px solid rgba(40, 32, 20, .12); border-radius: 24px; padding: 24px 28px; box-shadow: 0 24px 50px -28px rgba(40, 32, 20, .28); }
  .demo-notes { font: 400 .8125rem/1.7 "Geist Mono", ui-monospace, monospace; color: #645E55; margin-top: 20px; }

<!-- Component: copy this block. -->
<style id="component">
  .post {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    color: #1D1B18;
  }
  .post-kind { margin: 0 0 4px; font-size: .8125rem; font-weight: 500; color: #5A544B; letter-spacing: .02em; }
  .post-title { margin: 0; font-size: 1.1875rem; font-weight: 600; line-height: 1.3; }
  .post-meta { margin: 4px 0 0; font-size: .875rem; color: #5A544B; }

  .save { display: grid; justify-items: end; gap: 8px; flex: none; }
  .save-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 18px 0 14px;
    border: 1.5px solid #857E73;    /* 4.0:1 on white */
    border-radius: 999px;
    background: #FFFFFF;
    color: #1D1B18;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .save-btn svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linejoin: round;
  }
  /* Saved = filled shape + dark button. Never colour alone. */
  .save-btn[aria-pressed="true"] {
    border-color: #1D1B18;
    background: #1D1B18;
    color: #FFFFFF;
  }
  .save-btn[aria-pressed="true"] svg { fill: currentColor; }

  .save-btn:hover { border-color: #1D1B18; }
  .save-btn[aria-pressed="false"]:hover { background: #F2EFEA; }
  .save-btn:focus-visible { outline: 2.5px solid #1D1B18; outline-offset: 3px; }

  .save-status {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 240px;
    margin: 0;
    font-size: .8125rem;
    font-weight: 500;
    line-height: 1.35;
    color: #B3261E;                   /* 6.5:1 on white */
    text-align: right;
  }
  .save-status:empty { display: none; }
  .save-status::before {
    content: "!"; flex: none; display: grid; place-items: center;
    width: 1rem; height: 1rem; border-radius: 50%;
    background: #B3261E; color: #FFFFFF; font-size: .6875rem; font-weight: 700;
  }

<body>
<main class="demo">
  <p class="demo-eyebrow">Done right #8 · @zellap.app</p>
  <h1>Save button</h1>
  <p class="demo-lede">It fills the moment you tap, then asks the server. If the server says no, it rolls back and tells you in words. Fast taps never race.</p>

  <div class="demo-card">
    <article class="post">
      <div>
        <p class="post-kind">Recipe</p>
        <h2 class="post-title">Sourdough, the 24-hour way</h2>
        <p class="post-meta">12 min read</p>
      </div>
      <div class="save" data-id="sourdough-24h">
        <button class="save-btn" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17L12 16.2l-5.5 4.3z"/></svg>
          Save
        </button>
        <p class="save-status" role="status"></p>
      </div>
    </article>
  </div>

  <p class="demo-notes">
    <label><input type="checkbox" id="offline"> Make requests fail</label><br>
    Fake server: 600 ms per request.
  </p>
</main>

<!-- Demo page only: a fake server. Delete this and the component uses fetch(). -->
<script>
  window.saveRequest = () => new Promise((resolve, reject) => {
    const fail = document.getElementById('offline').checked;
    setTimeout(() => (fail ? reject(new Error('offline')) : resolve()), 600);
  });
</script>

<!-- Component: copy this block. -->
<script id="component">
  // Your API call. Resolve on success, throw on failure.
  const request = (id, saved) => window.saveRequest
    ? window.saveRequest(id, saved)
    : fetch(`/api/saved/${id}`, { method: saved ? 'PUT' : 'DELETE' })
        .then((r) => { if (!r.ok) throw new Error(r.status); });

  for (const save of document.querySelectorAll('.save')) {
    const btn = save.querySelector('.save-btn');
    const status = save.querySelector('.save-status');
    const shown = () => btn.getAttribute('aria-pressed') === 'true';
    const show = (on) => btn.setAttribute('aria-pressed', String(on));
    let server = shown();   // what the server has
    let busy = false;

    // One request at a time. Last tap wins.
    const sync = async () => {
      if (busy) return;
      busy = true;
      while (shown() !== server) {
        const want = shown();
        try {
          await request(save.dataset.id, want);
          server = want;
        } catch {
          if (shown() !== server) {
            status.textContent = shown()
              ? "Couldn't save. Try again."
              : "Couldn't remove. Try again.";
            show(server);   // roll back to the truth
          }
          break;
        }
      }
      busy = false;
    };

    btn.addEventListener('click', () => {
      show(!shown());           // 1. Update the UI now.
      status.textContent = '';
      sync();                   // 2. Then tell the server.
    });
  }
</script>
</body>
</html>
