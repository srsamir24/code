<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --stage: oklch(0.91 0.1 96);
    --stage-lift: oklch(0.95 0.07 98);
    --panel: oklch(0.995 0.004 96);
    --soft: oklch(0.96 0.014 96);
    --band: oklch(0.93 0.06 96);
    --line: oklch(0.91 0.02 96);
    --ink: oklch(0.22 0.025 75);
    --ink-2: oklch(0.5 0.025 75);
    --ink-3: oklch(0.68 0.02 75);
    --pick: oklch(0.24 0.03 75);
    --on-pick: oklch(0.97 0.05 98);
    --spring: linear(0, 0.08 3%, 0.29 7.5%, 0.62 14%, 0.86 21%, 0.99 28%, 1.04 34%, 1.045 39%, 1.03 46%, 1.005 58%, 0.997 70%, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter Tight", system-ui, sans-serif;
    background: radial-gradient(60% 45% at 50% 45%, var(--stage-lift), var(--stage));
    color: var(--ink);
    display: grid; place-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--band); color: var(--ink); }
  em, i { font-style: normal; }

  .card {
    width: min(400px, 100%);
    background: var(--panel);
    border-radius: 28px;
    padding: 20px 20px 18px;
    box-shadow: 0 50px 90px -40px oklch(0.4 0.09 85 / 0.55), 0 10px 24px -12px oklch(0.4 0.09 85 / 0.25);
  }
  .month { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .month h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .nav { display: flex; gap: 4px; }
  .nav button {
    width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--soft); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; transition: background 160ms;
  }
  .nav button:hover { background: var(--line); }
  .nav button:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
  .nav svg { width: 17px; height: 17px; }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; }
  .dow { font-size: 12.5px; font-weight: 600; color: var(--ink-3); text-align: center; padding-bottom: 6px; }
  /* the band is drawn per cell; row ends and range ends get the rounded caps */
  .day { position: relative; height: 44px; display: grid; place-items: center; }
  .day::before { content: ""; position: absolute; inset: 0; background: var(--band); opacity: 0; transition: opacity 200ms; }
  .day.in::before, .day.start::before, .day.end::before { opacity: 1; }
  .day:nth-child(7n + 1)::before { border-radius: 22px 0 0 22px; }
  .day:nth-child(7n)::before { border-radius: 0 22px 22px 0; }
  /* the dark circle is the cap: the band starts and stops at the middle of the end days */
  .day.start::before { left: 50%; border-radius: 0; }
  .day.end::before { right: 50%; border-radius: 0; }
  .day.start:nth-child(7n)::before { border-radius: 0 22px 22px 0; }
  .day.end:nth-child(7n + 1)::before { border-radius: 22px 0 0 22px; }
  .grid:not(.ranged) .day.start::before, .day.start.end::before { opacity: 0; }
  .day.preview::before, .grid.previewing .day.start::before { opacity: 0.55; }
  .day button {
    position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: none;
    font: inherit; font-size: 15px; font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums;
    cursor: pointer; transition: background 160ms, color 160ms, transform 300ms var(--spring);
  }
  .day button:hover { background: var(--line); }
  .day button:focus-visible { outline: 2px solid var(--pick); outline-offset: 1px; }
  .day button:disabled { color: var(--ink-3); cursor: default; }
  .day.booked button { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1.5px; text-decoration-color: var(--ink-2); }
  .day button:disabled:hover { background: none; }
  .day.start button, .day.end button { background: var(--pick); color: var(--on-pick); font-weight: 700; }
  .day.today button { box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .day.pop button { animation: pop 420ms var(--spring); }
  @keyframes pop { 40% { transform: scale(0.88); } }
  .day.blank { visibility: hidden; }

  .foot {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line);
  }
  .sum { font-size: 14px; color: var(--ink-2); line-height: 1.35; font-variant-numeric: tabular-nums; }
  .sum b { display: block; font-size: 15.5px; color: var(--ink); font-weight: 600; }
  .apply {
    height: 44px; padding: 0 20px; border-radius: 22px; border: 0;
    background: var(--pick); color: var(--on-pick); font: inherit; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity 200ms, transform 160ms var(--ease-out);
  }
  .apply:disabled { opacity: 0.35; cursor: default; }
  .apply:not(:disabled):active { transform: scale(0.97); }
  .apply:focus-visible { outline: 2px solid var(--pick); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
  }
  @media (max-width: 400px) {
    .day, .day button { height: 40px; } .day button { width: 40px; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="month">
    <h1 id="title" aria-live="polite"></h1>
    <div class="nav">
      <button type="button" id="prev" aria-label="Previous month"><i data-lucide="chevron-left"></i></button>
      <button type="button" id="next" aria-label="Next month"><i data-lucide="chevron-right"></i></button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot">
    <p class="sum" id="sum" aria-live="polite"></p>
    <button class="apply" id="apply" type="button" disabled>Book</button>
  </div>
</main>
<script>
  lucide.createIcons({ attrs: { 'stroke-width': 2.2 } });
  const grid = document.getElementById('grid');
  const sum = document.getElementById('sum');
  const apply = document.getElementById('apply');
  const TODAY = new Date(2026, 10, 3);               // fixed so the demo always looks the same
  const BOOKED = new Set(['2026-11-09', '2026-11-10', '2026-11-24']);  // nights already taken
  const key = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const DOW = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
  let view = new Date(2026, 10, 1), start = null, end = null, hover = null;

  const same = (a, b) => a && b && a.toDateString() === b.toDateString();
  const fmt = d => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const nights = (a, b) => Math.round((b - a) / 864e5);

  function render() {
    document.getElementById('title').textContent = view.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    const lead = (view.getDay() + 6) % 7;            // weeks start on Monday
    const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    let html = DOW.map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < lead; i++) html += '<div class="day blank"></div>';
    for (let n = 1; n <= days; n++) {
      const d = new Date(view.getFullYear(), view.getMonth(), n);
      const booked = BOOKED.has(key(d));
      const off = d < TODAY;
      html += `<div class="day${booked ? ' booked' : ''}" data-n="${n}"><button type="button" ${off ? 'disabled' : ''}
        aria-label="${fmt(d)}${booked ? ', booked, checkout only' : off ? ', not available' : ''}">${n}</button></div>`;
    }
    grid.innerHTML = html;
    paint();
  }
  // mark start, end and every day between; a hover previews the range
  function paint() {
    const to = end || hover;
    grid.classList.toggle('ranged', !!(start && to && to > start));
    grid.classList.toggle('previewing', !!(start && !end && hover && hover > start));
    grid.querySelectorAll('.day[data-n]').forEach(cell => {
      const d = new Date(view.getFullYear(), view.getMonth(), +cell.dataset.n);
      const lo = start && to && to > start ? start : null;
      cell.classList.toggle('start', same(d, start));
      cell.classList.toggle('end', same(d, end) || (!end && same(d, hover) && hover > start));
      cell.classList.toggle('in', !!lo && d > lo && d < to);
      cell.classList.toggle('preview', !end && !!lo && d > lo && d <= to);
      cell.classList.toggle('today', same(d, TODAY));
      cell.querySelector('button').setAttribute('aria-pressed', same(d, start) || same(d, end));
    });
    if (start && end) {
      const n = nights(start, end);
      sum.innerHTML = `<b>${fmt(start)} → ${fmt(end)}</b>${n} night${n > 1 ? 's' : ''}`;
    } else if (start) {
      sum.innerHTML = `<b>${fmt(start)} → ?</b>Pick your last night`;
    } else {
      sum.innerHTML = '<b>When are you staying?</b>Pick your first night';
    }
    apply.disabled = !(start && end);
  }
  // a stay can't include a booked night; a booked day still works as checkout
  function blocked(a, b) {
    for (let d = new Date(a); d < b; d.setDate(d.getDate() + 1))
      if (BOOKED.has(key(d))) return true;
    return false;
  }
  function pick(d) {
    const asEnd = start && !end && d > start && !blocked(start, d);
    if (asEnd) end = d;
    else if (BOOKED.has(key(d))) return;          // can't start a stay on a booked night
    else { start = d; end = null; }
    paint();
    const cell = grid.querySelector(`.day[data-n="${d.getDate()}"]`);
    cell.classList.remove('pop'); cell.offsetWidth; cell.classList.add('pop');
  }
  grid.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    pick(new Date(view.getFullYear(), view.getMonth(), +b.parentElement.dataset.n));
  });
  grid.addEventListener('pointerover', e => {
    const b = e.target.closest('button');
    const d = b && !b.disabled ? new Date(view.getFullYear(), view.getMonth(), +b.parentElement.dataset.n) : null;
    hover = d && start && !blocked(start, d) ? d : null;
    if (start && !end) paint();
  });
  grid.addEventListener('pointerleave', () => { hover = null; if (start && !end) paint(); });
  grid.addEventListener('focusin', e => {
    const b = e.target.closest('button'); if (!b || !start || end) return;
    const d = new Date(view.getFullYear(), view.getMonth(), +b.parentElement.dataset.n);
    hover = !blocked(start, d) ? d : null; paint();
  });
  document.getElementById('prev').addEventListener('click', () => { view.setMonth(view.getMonth() - 1); render(); });
  document.getElementById('next').addEventListener('click', () => { view.setMonth(view.getMonth() + 1); render(); });

  const params = new URLSearchParams(location.search);
  const day = n => new Date(2026, 10, n);
  if (params.has('start')) start = day(+params.get('start'));
  if (params.has('end')) end = day(+params.get('end'));
  if (params.has('hover')) hover = day(+params.get('hover'));
  render();
  if (params.has('demo')) {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async function loop() {
      start = end = hover = null; paint(); await wait(900);
      pick(day(13)); await wait(500);
      for (const n of [15, 17, 19]) { hover = day(n); paint(); await wait(320); }
      pick(day(18)); await wait(2600); loop();
    })();
  }
</script>
</body>
</html>
