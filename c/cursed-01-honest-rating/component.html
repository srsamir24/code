<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Honest Rating</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f2ee; --ink:#121214; --ink-2:#5f5f66; --ink-3:#8d8c92;
    --line:rgba(18,18,20,.085); --line-2:#e6e3dc;
    --gold-1:#ffd772; --gold-2:#f2a43a; --gold-ink:#a8681a;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Satoshi",ui-sans-serif,sans-serif; -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  /* calm backdrop: hairline grid fading out from the centre */
  .backdrop{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 45% at 50% 46%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
      linear-gradient(var(--bg),var(--bg));
  }
  .backdrop::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(18,18,20,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,18,20,.045) 1px,transparent 1px);
    background-size:28px 28px; background-position:center;
    -webkit-mask-image:radial-gradient(55% 42% at 50% 46%,#000 10%,transparent 75%);
            mask-image:radial-gradient(55% 42% at 50% 46%,#000 10%,transparent 75%);
  }
  .stage{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px}

  .hook{font-weight:900;font-size:27px;line-height:1.12;letter-spacing:-.025em;text-align:center;max-width:430px;text-wrap:balance}
  .handle{display:block;margin-top:10px;font-weight:500;font-size:12.5px;letter-spacing:.01em;color:var(--ink-3)}
  .outro{font-weight:700;font-size:19px;letter-spacing:-.015em;color:var(--ink);opacity:0;display:flex;align-items:center;gap:10px}
  .outro .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(var(--gold-1),var(--gold-2))}

  .card{position:relative;width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 40px 70px -32px rgba(40,34,20,.22),0 10px 24px -12px rgba(0,0,0,.08);
  }
  .form{padding:26px 28px 28px}
  .app{display:flex;align-items:center;gap:12px}
  .icon{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(160deg,#2a2a33,#101014);display:grid;place-items:center;
    box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 14px -6px rgba(0,0,0,.35)}
  .app b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em}
  .app span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:1px}
  .x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-3)}
  h1{margin-top:22px;font-weight:700;font-size:28px;letter-spacing:-.025em;line-height:1.1}
  .sub{margin-top:7px;font-size:15px;color:var(--ink-2);font-weight:500}

  .track{position:relative;height:84px;width:330px;max-width:100%;margin:16px auto 0;cursor:pointer;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
            mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);}
  .star{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;padding:0;border:0;background:none;cursor:pointer;will-change:transform}
  .star svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .star .on{transform-origin:50% 55%;filter:drop-shadow(0 6px 9px rgba(242,164,58,.38))}
  .label{height:22px;text-align:center;font-size:16px;font-weight:500;color:var(--ink-3);margin-top:2px}
  .label.hot{color:var(--gold-ink);font-weight:700}

  .field{position:relative;margin-top:18px;height:96px;border-radius:16px;border:1px solid var(--line-2);background:#fff;overflow:hidden}
  .field.focus{border-color:#cdc8bd;box-shadow:0 0 0 4px rgba(18,18,20,.035)}
  .field textarea,.mirror{position:absolute;inset:0;padding:14px 16px;font:500 18px/1.4 "Satoshi",ui-sans-serif,sans-serif;letter-spacing:-.005em;white-space:pre-wrap;word-wrap:break-word}
  .field textarea{resize:none;border:0;outline:0;background:transparent;color:transparent;caret-color:transparent;width:100%}
  .field textarea::placeholder{color:#a9a7a2}
  .mirror{color:var(--ink);pointer-events:none}
  .mirror mark{color:inherit;border-radius:5px;padding:0 2px;margin:0 -2px}
  .caret{display:inline-block;width:1.5px;height:1.1em;vertical-align:-.17em;background:var(--ink);margin-left:1px}

  .actions{display:flex;gap:10px;margin-top:16px}
  .btn{height:48px;border-radius:14px;font:700 15px "Satoshi",sans-serif;letter-spacing:-.01em;cursor:pointer;will-change:transform}
  .ghost{padding:0 18px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2)}
  .primary{flex:1;border:0;background:var(--ink);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 8px 18px -10px rgba(0,0,0,.6)}

  .done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;opacity:0;pointer-events:none}
  .done .big{display:flex;gap:8px;margin-bottom:22px}
  .done .big svg{width:52px;height:52px;overflow:visible;filter:drop-shadow(0 6px 9px rgba(242,164,58,.38))}
  .done h2{font-weight:700;font-size:34px;letter-spacing:-.025em}
  .done p{margin-top:8px;font-size:17px;color:var(--ink-2);font-weight:500}
  .stats{display:flex;margin-top:26px;border:1px solid var(--line-2);border-radius:16px;overflow:hidden}
  .stats div{padding:14px 22px 12px;text-align:left}
  .stats div+div{border-left:1px solid var(--line-2)}
  .stats small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;letter-spacing:.02em;text-transform:uppercase}
  .stats strong{display:block;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .again{margin-top:20px;border:0;background:none;font:500 13.5px "Satoshi",sans-serif;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

  /* reel mode: fixed 540x960 phone canvas */
  body.reel .stage{display:block;width:540px;height:960px;margin:0 auto;padding:0}
  body.reel .hook{position:absolute;top:150px;left:50%;transform:translateX(-50%);width:450px;font-size:30px}
  body.reel .card{position:absolute;top:276px;left:60px}
  body.reel .outro{position:absolute;top:158px;left:0;right:0;justify-content:center;font-size:30px;font-weight:900;letter-spacing:-.025em}
  body.reel .outro .dot{width:14px;height:14px}
  body.reel .again{display:none}
  body:not(.reel) .outro{display:none}
  body.reel, body.reel *{cursor:none !important}
  #cursor{position:fixed;left:0;top:0;width:0;height:0;z-index:99;pointer-events:none;display:none}
  body.reel #cursor{display:block}
  #cursor svg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
  #ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(18,18,20,.5);opacity:0}
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="stage">
  <header class="hook">Our app has never had a 1&#8209;star review.<span class="handle">@zellap.app</span></header>

  <main class="card" id="card">
    <section class="form" id="form">
      <div class="app">
        <div class="icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="5.2" fill="#fff"/><ellipse cx="13" cy="13" rx="11" ry="4.6" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" transform="rotate(-24 13 13)"/><circle cx="22.6" cy="8.6" r="2" fill="#f2a43a"/></svg>
        </div>
        <div><b>Orbit</b><span>Version 3.2 &middot; Updated today</span></div>
        <div class="x" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      </div>
      <h1>Enjoying Orbit?</h1>
      <p class="sub">Tap a star to rate your experience.</p>
      <div class="track" id="track" role="radiogroup" aria-label="Rating"></div>
      <div class="label" id="label">Tap to rate</div>
      <div class="field" id="field">
        <div class="mirror" id="mirror"></div>
        <textarea id="note" placeholder="Tell us more (optional)" spellcheck="false"></textarea>
      </div>
      <div class="actions">
        <button class="btn ghost" id="later">Not now</button>
        <button class="btn primary" id="submit">Submit review</button>
      </div>
    </section>

    <section class="done" id="done" aria-live="polite">
      <div class="big" id="big"></div>
      <h2>Thank you!</h2>
      <p>Your 5-star review is live.</p>
      <div class="stats">
        <div><small>Average</small><strong>5.0 &#9733;</strong></div>
        <div><small>1-star reviews</small><strong>0</strong></div>
      </div>
      <button class="again" id="again">Rate again</button>
    </section>
  </main>

  <footer class="outro" id="outro"><span class="dot"></span>Follow for more cursed UI</footer>
</div>

<div id="cursor">
  <div id="ring"></div>
  <svg id="arrow" width="26" height="34" viewBox="0 0 26 34"><path d="M2 2 L2 26 L8.2 20.4 L12.4 30.4 L16.6 28.6 L12.5 18.9 L20.8 18.6 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
  <svg id="hand" width="30" height="34" viewBox="0 0 30 34" style="display:none;left:-9px;top:-2px"><path d="M10 15V5.2a2.6 2.6 0 0 1 5.2 0V13 M15.2 12.6a2.5 2.5 0 0 1 5 0v1.8 M20.2 13.6a2.5 2.5 0 0 1 5 0v6.2c0 6.6-4 11.2-10 11.2-4.6 0-6.7-2.2-9.4-6.5L3 19.6a2.5 2.5 0 0 1 4.2-2.7L10 20.8V15" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
  <svg id="beam" width="14" height="30" viewBox="0 0 14 30" style="display:none;left:-7px;top:-15px"><path d="M2 2c3 0 5 1 5 3v20c0 2-2 3-5 3M12 2c-3 0-5 1-5 3v20c0 2 2 3 5 3M4 15h6" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round"/><path d="M2 2c3 0 5 1 5 3v20c0 2-2 3-5 3M12 2c-3 0-5 1-5 3v20c0 2 2 3 5 3M4 15h6" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>
</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const REEL = qs.has('reel'), MANUAL = qs.has('manual');
  if (REEL) document.body.classList.add('reel');

  const $ = id => document.getElementById(id);
  const track = $('track'), label = $('label'), note = $('note'), mirror = $('mirror'), field = $('field');
  const form = $('form'), done = $('done'), outro = $('outro');

  /* ---------- star markup ---------- */
  const STAR = 'M25 3.2l6.5 13.4 14.7 2.1-10.7 10.3 2.6 14.6L25 36.7l-13.1 6.9 2.6-14.6L3.8 18.7l14.7-2.1z';
  const starSvg = () => `<svg viewBox="0 0 50 50">
      <path d="${STAR}" fill="#faf9f6" stroke="#d9d5cc" stroke-width="1.5" stroke-linejoin="round"/>
      <g class="on"><path d="${STAR}" fill="url(#gold)" stroke="#e39a32" stroke-width="1" stroke-linejoin="round"/>
      <path d="M25 8.5l4.6 9.4" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/></g></svg>`;
  document.body.insertAdjacentHTML('beforeend',`<svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdb7a"/><stop offset="1" stop-color="#f29d34"/></linearGradient></defs></svg>`);

  const GAP = 66, N = 5, LEAD = N - 1, PERIOD = GAP * N;   // the row wraps around like a carousel
  const stars = [];
  const mk = (i, twin) => {
    const b = document.createElement('button');
    b.className = 'star'; b.type = 'button';
    if (twin) { b.tabIndex = -1; b.setAttribute('aria-hidden','true'); }
    else { b.setAttribute('role','radio'); b.setAttribute('aria-label','5 stars'); }  // every star is honest about it
    b.dataset.value = '5';
    b.innerHTML = starSvg();
    track.appendChild(b);
    return b;
  };
  for (let i = 0; i < N; i++) {
    const el = mk(i, false), tw = mk(i, true);
    const rest = (i - (N - 1) / 2) * GAP;
    stars.push({ el, tw, on: el.querySelector('.on'), on2: tw.querySelector('.on'), rest, x: rest, v: 0,
                 k: 560 - (LEAD - i) * 80,          // the 5th star leads, the rest trail behind it
                 f: 0, fv: 0, delay: 0 });
  }
  const WORDS = ['Terrible', 'Meh', 'Okay', 'Good', 'Amazing'];
  let dodgeAt = 0;
  $('big').innerHTML = Array.from({length:5}, () => `<svg viewBox="0 0 50 50"><path d="${STAR}" fill="url(#gold)" stroke="#e39a32" stroke-width="1" stroke-linejoin="round"/><path d="M25 8.5l4.6 9.4" stroke="#fff" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round"/></svg>`).join('');
  const bigStars = [...$('big').children];

  /* ---------- state ---------- */
  let now = 0;                 // simulation clock (ms)
  let px = -999, py = -999;    // pointer
  let hovering = false, rated = false, focused = false;
  let lastType = -1e9;
  const tweens = [];
  const ease = {
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
    back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  function tween(dur, fn, e = ease.out, delay = 0) {
    const tw = { t0: now + delay, dur, fn, e }; tweens.push(tw); return tw;
  }

  /* ---------- pointer ---------- */
  function hoverZone() {
    const r = track.getBoundingClientRect();
    return px > r.left + 6 && px < r.right - 6 && py > r.top - 10 && py < r.bottom + 10;
  }
  window.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; moveCursor(); });
  window.addEventListener('pointerleave', () => { px = py = -999; });
  track.addEventListener('pointerdown', () => rate());
  stars.forEach(s => s.el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') rate(); }));

  function rate() {
    rated = true;
    stars.forEach((s, i) => { s.fv += 9 + (LEAD - i) * 1.5; });   // little pop
    setLabel('You picked 5. Great choice.', true);
  }
  function setLabel(text, hot) {
    if (label.textContent === text) return;
    label.textContent = text; label.classList.toggle('hot', hot);
    tween(260, p => { label.style.transform = `translateY(${(1 - p) * 5}px)`; label.style.opacity = p; });
  }

  /* ---------- the "autocorrect" ---------- */
  const FIX = { terrible:'terrific', awful:'awesome', bad:'great', hate:'love', slow:'fast', buggy:'flawless',
                worst:'best', broken:'perfect', meh:'wow', useless:'priceless', annoying:'amazing', crashes:'delights' };
  let morph = null, mark = null;   // mark = {start,len,t}
  note.addEventListener('focus', () => { focused = true; field.classList.add('focus'); });
  note.addEventListener('blur',  () => { focused = false; field.classList.remove('focus'); });
  note.addEventListener('input', () => {
    lastType = now;
    const m = note.value.match(/([A-Za-z]+)([^A-Za-z])$/);
    if (m && FIX[m[1].toLowerCase()] && !morph) {
      const start = note.value.length - m[0].length;
      let to = FIX[m[1].toLowerCase()];
      if (m[1][0] === m[1][0].toUpperCase()) to = to[0].toUpperCase() + to.slice(1);
      morph = { start, from: m[1], to, cur: m[1], t0: now + 110 };
    }
  });

  function stepMorph() {
    if (!morph) return;
    const k = Math.floor((now - morph.t0) / 52);
    if (k < 0) return;
    const { from, to, start } = morph;
    const L = Math.max(from.length, to.length);
    const word = k >= L ? to : to.slice(0, k + 1) + from.slice(k + 1, Math.max(from.length, k + 1));
    if (word !== morph.cur) {
      const v = note.value;
      note.value = v.slice(0, start) + word + v.slice(start + morph.cur.length);
      morph.cur = word;
      note.setSelectionRange(note.value.length, note.value.length);
      mark = { start, len: word.length, t: now };
    }
    if (k >= L) { mark = { start, len: to.length, t: now }; morph = null; }
  }

  function renderMirror() {
    const v = note.value;
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
    let html;
    if (mark && now - mark.t < 1400) {
      const a = Math.max(0, 1 - Math.max(0, now - mark.t - 500) / 900);
      html = esc(v.slice(0, mark.start)) +
        `<mark style="background:rgba(255,205,96,${.55*a});box-shadow:inset 0 -2px 0 rgba(226,150,40,${a})">${esc(v.slice(mark.start, mark.start + mark.len))}</mark>` +
        esc(v.slice(mark.start + mark.len));
    } else html = esc(v);
    const blinkOn = (now - lastType) < 500 || Math.floor(now / 530) % 2 === 0;
    if (focused && blinkOn) html += '<span class="caret"></span>';
    mirror.innerHTML = html;
  }

  /* ---------- submit / reset ---------- */
  let doneShown = false;
  function press(el) {
    tween(110, p => el.style.transform = `scale(${1 - .04 * p})`);
    tween(380, p => el.style.transform = `scale(${.96 + .04 * p})`, ease.back, 110);
  }
  ['submit','later'].forEach(id => $(id).addEventListener('pointerdown', () => press($(id))));
  $('submit').addEventListener('click', () => { if (!rated) rate(); showDone(); });
  $('later').addEventListener('click', () => { rate(); showDone(); });   // "Not now" also counts as 5
  $('again').addEventListener('click', () => reset());

  function showDone() {
    if (doneShown) return; doneShown = true; note.blur();
    tween(260, p => { form.style.opacity = 1 - p; form.style.transform = `translateY(${-8 * p}px)`; });
    done.style.pointerEvents = 'auto';
    tween(420, p => { done.style.opacity = p; done.style.transform = `translateY(${10 * (1 - p)}px)`; }, ease.out, 160);
    bigStars.forEach((s, i) => { s.style.transform = 'scale(0)';
      tween(520, p => s.style.transform = `scale(${p}) rotate(${(1 - p) * -40}deg)`, ease.back, 260 + i * 70); });
  }
  function reset() {
    if (!doneShown) return;
    doneShown = false; done.style.pointerEvents = 'none';
    rated = false; note.value = ''; mark = morph = null;
    stars.forEach(s => { s.f = 0; s.fv = 0; });
    label.textContent = 'Tap to rate'; label.classList.remove('hot'); label.style.opacity = 1; label.style.transform = '';
    tween(260, p => { done.style.opacity = 1 - p; });
    tween(300, p => { form.style.opacity = p; form.style.transform = `translateY(${6 * (1 - p)}px)`; }, ease.out, 40);
  }
  let outroOn = false;
  window.__outro = on => {
    if (on === outroOn) return; outroOn = on;
    const hook = document.querySelector('.hook');
    tween(on ? 420 : 320, p => { const q = on ? p : 1 - p;
      hook.style.opacity = 1 - q;
      outro.style.opacity = q; outro.style.transform = `translateY(${(1 - q) * 10}px)`; });
  };
  window.__reset = reset;

  /* ---------- physics ---------- */
  function update(dt) {
    const wasHover = hovering;
    hovering = hoverZone() && !doneShown;
    const tr = track.getBoundingClientRect();
    const local = px - (tr.left + tr.width / 2);
    if (hovering && !wasHover) {
      dodgeAt = now + 260;                                       // behave honestly for a beat...
      stars.forEach((s, i) => s.delay = dodgeAt + 120 + (LEAD - i) * 45);
    }
    if (!hovering && wasHover && !rated) setLabel('Tap to rate', false);
    const dodging = hovering && now >= dodgeAt;
    const offset = dodging ? local - stars[LEAD].rest : 0;     // ...then star #5 always lands under the pointer
    const honestIdx = Math.max(0, Math.min(N - 1, Math.round(local / GAP + (N - 1) / 2)));
    if (hovering && !rated) setLabel(dodging ? '5 stars · Amazing' : WORDS[honestIdx], dodging);

    stars.forEach((s, i) => {
      const k = s.k, c = 2 * Math.sqrt(k) * .72;
      const a = k * (s.rest + offset - s.x) - c * s.v;
      s.v += a * dt; s.x += s.v * dt;
      const ft = rated || (dodging ? now >= s.delay : hovering && i <= honestIdx) ? 1 : 0;
      const fk = 340, fc = 2 * Math.sqrt(fk) * .45;
      s.fv += (fk * (ft - s.f) - fc * s.fv) * dt; s.f += s.fv * dt;
    });
  }
  const wrap = x => ((x + PERIOD / 2) % PERIOD + PERIOD) % PERIOD - PERIOD / 2;
  function render() {
    for (const s of stars) {
      const sp = Math.min(Math.abs(s.v) / 2600, .3);
      const sx = 1 + sp, sy = 1 / Math.pow(sx, .7);
      const rot = Math.max(-16, Math.min(16, s.v / 70));
      const x = wrap(s.x), x2 = x < 0 ? x + PERIOD : x - PERIOD;
      const tail = ` rotate(${rot.toFixed(2)}deg) scale(${sx.toFixed(3)},${sy.toFixed(3)})`;
      s.el.style.transform = `translateX(${x.toFixed(2)}px)` + tail;
      s.tw.style.transform = `translateX(${x2.toFixed(2)}px)` + tail;
      const f = Math.max(0, s.f);
      for (const on of [s.on, s.on2]) {
        on.style.transform = `scale(${f.toFixed(3)})`;
        on.style.opacity = Math.min(1, f * 1.6).toFixed(3);
      }
    }
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (now < tw.t0) continue;
      const p = tw.dur <= 1 ? 1 : Math.min(1, (now - tw.t0) / tw.dur);
      tw.fn(tw.e(p));
      if (p >= 1) tweens.splice(i, 1);
    }
    stepMorph();
    renderMirror();
  }
  function tick(ms) {
    const n = Math.max(1, Math.ceil(ms / 4));
    for (let i = 0; i < n; i++) { now += ms / n; update(ms / n / 1000); }
    render();
  }
  window.__tick = tick;
  if (!MANUAL) {
    let last = performance.now();
    requestAnimationFrame(function loop(t) { tick(Math.min(50, t - last)); last = t; requestAnimationFrame(loop); });
  } else tick(16);

  /* ---------- reel cursor (driven by real pointer events) ---------- */
  const cur = $('cursor'), ring = $('ring'), arrow = $('arrow'), hand = $('hand'), beam = $('beam');
  let curScale = 1;
  function moveCursor() {
    if (!REEL) return;
    const el = document.elementFromPoint(px, py);
    const isHand = el && (el.closest('.track') || el.closest('button'));
    const isBeam = !isHand && el && el.closest('.field');
    arrow.style.display = !isHand && !isBeam ? '' : 'none';
    hand.style.display = isHand ? '' : 'none';
    beam.style.display = isBeam ? '' : 'none';
    cur.style.transform = `translate(${px}px,${py}px) scale(${curScale})`;
  }
  window.addEventListener('pointerdown', () => {
    if (!REEL) return;
    tween(90, p => { curScale = 1 - .14 * p; moveCursor(); });
    tween(300, p => { curScale = .86 + .14 * p; moveCursor(); }, ease.back, 120);
    tween(480, p => { ring.style.opacity = (1 - p) * .9; ring.style.transform = `scale(${.4 + p * 1.1})`; });
  });
})();
</script>
</body>
</html>
