<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segmented tabs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: oklch(0.36 0.09 332);
    --stage-lift: oklch(0.44 0.1 334);
    --panel: oklch(0.99 0.004 332);
    --soft: oklch(0.955 0.012 332);
    --line: oklch(0.92 0.012 332);
    --ink: oklch(0.21 0.03 332);
    --ink-2: oklch(0.5 0.025 332);
    --bar: oklch(0.88 0.04 332);
    --accent: oklch(0.52 0.17 335);
    --spring: linear(0, 0.08 3%, 0.29 7.5%, 0.62 14%, 0.86 21%, 0.99 28%, 1.04 34%, 1.045 39%, 1.03 46%, 1.005 58%, 0.997 70%, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter Tight", system-ui, sans-serif;
    background: radial-gradient(60% 45% at 50% 45%, var(--stage-lift), var(--stage));
    color: var(--ink);
    display: grid; place-items: center;
    padding: 16px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--bar); color: var(--ink); }
  em, i { font-style: normal; }

  .card {
    width: min(440px, 100%);
    background: var(--panel);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 50px 90px -40px oklch(0.15 0.08 332 / 0.8), 0 10px 24px -12px oklch(0.15 0.08 332 / 0.35);
  }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .total { font-size: 14.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .total b { color: var(--ink); font-weight: 700; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .tabs {
    position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
    margin: 18px 0 22px; padding: 4px; border-radius: 14px; background: var(--soft);
  }
  .tab {
    position: relative; z-index: 1; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 14.5px; font-weight: 600; color: var(--ink-2);
    height: 36px; border-radius: 10px; transition: color 200ms;
  }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .thumb {
    position: absolute; top: 4px; left: 0; height: 36px; border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 2px 6px -2px oklch(0.3 0.06 332 / 0.3);
    transform: translateX(var(--x)); width: var(--w);
    transition: transform 460ms var(--spring), width 460ms var(--spring);
  }

  .chart { display: grid; grid-template-columns: repeat(7, 1fr); align-items: end; gap: 10px; height: 180px; }
  .col { display: grid; grid-template-rows: 1fr auto; gap: 8px; height: 100%; text-align: center; }
  .bar {
    align-self: end; border-radius: 8px; background: var(--bar);
    height: calc(var(--v) * 1%);
    transition: height 620ms var(--spring), background 300ms;
    transition-delay: calc(var(--n) * 35ms);
  }
  .col.top .bar { background: var(--accent); }
  .lbl { font-size: 12.5px; font-weight: 500; color: var(--ink-2); transition: opacity 200ms, filter 200ms; }
  .chart.swap .lbl { opacity: 0; filter: blur(3px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; transition-delay: 0ms !important; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="head">
    <h1>Visitors</h1>
    <p class="total"><span aria-hidden="true"><b id="sum">0</b> <span id="span">today</span></span><span class="sr-only" id="said" aria-live="polite"></span></p>
  </div>
  <div class="tabs" role="tablist" aria-label="Period">
    <span class="thumb" aria-hidden="true"></span>
    <button class="tab" role="tab" id="t-day" aria-controls="chart">Today</button>
    <button class="tab" role="tab" id="t-week" aria-controls="chart">Week</button>
    <button class="tab" role="tab" id="t-month" aria-controls="chart">Month</button>
  </div>
  <div class="chart" id="chart" role="tabpanel"></div>
</main>
<script>
  const DATA = {
    'Today': { span: 'today', labels: ['6a', '9a', '12p', '3p', '6p', '9p', '12a'], v: [12, 48, 96, 81, 120, 64, 22] },
    'Week': { span: 'this week', labels: ['M', 'T', 'W', 'T', 'F', 'S', 'S'], v: [310, 284, 342, 398, 451, 205, 168] },
    'Month': { span: 'this month', labels: ['1', '5', '10', '15', '20', '25', '30'], v: [880, 1240, 1110, 1460, 1620, 1380, 1710] },
  };
  const tabs = [...document.querySelectorAll('.tab')];
  const thumb = document.querySelector('.thumb');
  const chart = document.getElementById('chart');
  const sum = document.getElementById('sum'), span = document.getElementById('span');
  const said = document.getElementById('said');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  chart.innerHTML = Array.from({ length: 7 }, (_, n) =>
    `<div class="col" style="--n:${n}"><div class="bar"></div><span class="lbl"></span></div>`).join('');
  const cols = [...chart.children];

  // the thumb follows the tab; on the way it stretches to cover both
  function moveThumb(tab, from) {
    thumb.style.setProperty('--x', tab.offsetLeft + 'px');
    thumb.style.setProperty('--w', tab.offsetWidth + 'px');
    if (!from || from === tab || reduce) return;
    const a = Math.min(from.offsetLeft, tab.offsetLeft);
    const b = Math.max(from.offsetLeft + from.offsetWidth, tab.offsetLeft + tab.offsetWidth);
    thumb.animate([
      { transform: `translateX(${from.offsetLeft}px)`, width: from.offsetWidth + 'px' },
      { transform: `translateX(${a}px)`, width: b - a + 'px', offset: 0.4 },
      { transform: `translateX(${tab.offsetLeft}px)`, width: tab.offsetWidth + 'px' },
    ], { duration: 460, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
  }
  function countTo(to) {
    const from = +sum.dataset.v || 0, t0 = performance.now();
    sum.dataset.v = to;
    const step = t => {
      const k = reduce ? 1 : Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - k, 3);
      sum.textContent = Math.round(from + (to - from) * e).toLocaleString('en-US');
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function select(tab, focus) {
    const from = tabs.find(t => t.getAttribute('aria-selected') === 'true');
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute('aria-selected', on);
      t.tabIndex = on ? 0 : -1;
    });
    chart.setAttribute('aria-labelledby', tab.id);
    if (focus) tab.focus();
    moveThumb(tab, from);
    const d = DATA[tab.textContent], max = Math.max(...d.v);
    cols.forEach((c, i) => {
      c.style.setProperty('--v', (d.v[i] / max) * 100);
      c.classList.toggle('top', d.v[i] === max);
      c.setAttribute('role', 'img');
      c.setAttribute('aria-label', `${d.labels[i]}: ${d.v[i]}`);
    });
    chart.classList.add('swap');
    setTimeout(() => {
      cols.forEach((c, i) => c.querySelector('.lbl').textContent = d.labels[i]);
      chart.classList.remove('swap');
    }, from ? 180 : 0);
    const total = d.v.reduce((a, b) => a + b, 0);
    countTo(total);
    span.textContent = d.span;
    said.textContent = `${total.toLocaleString('en-US')} visitors ${d.span}`;
  }
  tabs.forEach(t => t.addEventListener('click', () => select(t)));
  // arrow keys move between tabs (roving tabindex)
  document.querySelector('.tabs').addEventListener('keydown', e => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    if (e.key === 'ArrowRight') select(tabs[(i + 1) % 3], true);
    if (e.key === 'ArrowLeft') select(tabs[(i + 2) % 3], true);
    if (e.key === 'Home') select(tabs[0], true);
    if (e.key === 'End') select(tabs[2], true);
  });

  const params = new URLSearchParams(location.search);
  select(tabs[+(params.get('tab') || 1)]);
  if (params.has('demo')) {
    let i = 1;
    setInterval(() => { i = (i + 1) % 3; select(tabs[i]); }, 1800);
  }
</script>
</body>
</html>
