:root{
  --bg:#f3f2ee; --ink:#121214; --ink-2:#5f5f66; --ink-3:#8d8c92;
  --line:rgba(18,18,20,.085); --line-2:#e6e3dc;
  --gold-1:#ffd772; --gold-2:#f2a43a; --gold-ink:#a8681a;
  --red:#d9473d; --red-ink:#c23a31; --green:#2f8a3e;
  --cw:min(420px, calc(100vw - 32px));
  --ch:470px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
@supports (height:100dvh){ html,body{height:100dvh} }
body{
  background:var(--bg); color:var(--ink);
  font-family:"Satoshi",ui-sans-serif,system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px;border-radius:10px}
.backdrop{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 50% 50%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),linear-gradient(var(--bg),var(--bg))}
.backdrop::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(18,18,20,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,18,20,.045) 1px,transparent 1px);
  background-size:28px 28px;background-position:center;
  -webkit-mask-image:radial-gradient(55% 42% at 50% 50%,#000 10%,transparent 75%);mask-image:radial-gradient(55% 42% at 50% 50%,#000 10%,transparent 75%)}

/* ---------- shell ---------- */
.game{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 16px 20px}
.col{width:var(--cw)}
.hud{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;height:50px}
.hud-l{min-width:0}
.step{display:block;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.where{display:block;margin-top:3px;font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{position:relative;display:flex;align-items:baseline;gap:2px;height:44px;padding:0 14px 0 15px;border-radius:14px;background:#fff;border:1px solid var(--line);
  box-shadow:0 6px 16px -10px rgba(40,34,20,.28);font-weight:900;font-size:27px;letter-spacing:-.02em;line-height:44px;transform-origin:100% 50%}
.timer .d{display:inline-block;width:.6em;text-align:center}
.timer .dot{display:inline-block;width:.26em;text-align:center}
.timer small{font-size:15px;font-weight:700;color:var(--ink-3);margin-left:3px}
.timer.hot{color:var(--red)}
.pen{position:absolute;right:6px;top:100%;margin-top:4px;font-style:normal;font-weight:900;font-size:15px;color:var(--red);opacity:0;white-space:nowrap;pointer-events:none}
.bar{display:flex;gap:4px;list-style:none;padding:0;margin-top:12px;height:4px}
.bar li{flex:1;border-radius:2px;background:#e4e1da;position:relative;overflow:hidden}
.bar li i{position:absolute;inset:0;border-radius:2px;background:linear-gradient(90deg,var(--gold-1),var(--gold-2));transform-origin:0 50%;transform:scaleX(0)}
.bar li.cur{background:#d8d4cb}
.goal{display:flex;align-items:center;gap:9px;height:44px;font-weight:700;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
.goal i{flex:none;width:8px;height:8px;border-radius:50%;background:linear-gradient(var(--gold-1),var(--gold-2));box-shadow:0 0 0 3px rgba(242,164,58,.16)}
.goal span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal small{font-weight:500;color:var(--ink-3);font-size:14px;margin-left:auto;white-space:nowrap}
.msg{height:40px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink-2);opacity:0}
.msg.bad{color:var(--red-ink)}
.msg.good{color:var(--green)}

.card{position:relative;width:var(--cw);height:var(--ch);background:#fff;border:1px solid var(--line);border-radius:30px;isolation:isolate;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 40px 70px -32px rgba(40,34,20,.22),0 10px 24px -12px rgba(0,0,0,.08);will-change:transform}
.card .ring{position:absolute;inset:-1px;border-radius:30px;pointer-events:none;opacity:0;z-index:20;
  box-shadow:0 0 0 2px var(--gold-2),0 0 0 7px rgba(242,164,58,.18)}
.clip{position:absolute;inset:0;border-radius:30px;overflow:hidden}
.lv{position:absolute;inset:0;padding:24px 26px 22px;will-change:transform,opacity}

/* ---------- shared card parts (from the Cursed UI kit) ---------- */
.app{display:flex;align-items:center;gap:12px;height:44px}
.icon{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(160deg,#2a2a33,#101014);display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 14px -6px rgba(0,0,0,.35)}
.app b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em}
.app span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:1px}
.x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-3);flex:none}
.h{margin-top:18px;font-weight:700;font-size:26px;letter-spacing:-.025em;line-height:1.1;display:flex;align-items:center;gap:10px;min-height:29px}
.sub{margin-top:6px;font-size:15px;color:var(--ink-2);font-weight:500;min-height:20px}
.sub b{color:var(--red-ink);font-weight:700}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:48px;border:0;border-radius:14px;background:var(--ink);color:#fff;
  font:700 15px "Satoshi",sans-serif;letter-spacing:-.01em;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 8px 18px -10px rgba(0,0,0,.6);will-change:transform}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line-2);box-shadow:none}
.chk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#eef6ee;flex:none}
.overlay{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;overflow:visible}

/* L1 badge */
.ibtn{margin-left:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;color:var(--ink);cursor:pointer;flex:none}
.list{list-style:none;padding:0;margin-top:14px;border:1px solid var(--line-2);border-radius:18px;overflow:hidden}
.list li{display:flex;align-items:center;gap:12px;height:58px;padding:0 14px}
.list li+li{border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.list p{flex:1;font-size:14.5px;line-height:1.3;color:var(--ink-2);font-weight:500}
.list p strong{color:var(--ink);font-weight:700}
.list time{font-size:12.5px;color:var(--ink-3);font-weight:500}
.lv-badge .btn{margin-top:14px}
.tabs{display:flex;justify-content:space-between;margin:14px -8px 0;padding-top:8px;border-top:1px solid var(--line)}
.tab{width:52px;height:42px;display:grid;place-items:center;color:var(--ink-3)}
.tab.on{color:var(--ink)}
.overlay text{font:700 13.5px "Satoshi",sans-serif;fill:#fff}

/* L2 gum */
.rows{margin-top:14px;border:1px solid var(--line-2);border-radius:18px}
.row{display:flex;align-items:center;gap:14px;height:70px;padding:0 16px}
.row+.row{border-top:1px solid var(--line)}
.row>div{flex:1;min-width:0}
.row b{display:block;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.row span{display:block;margin-top:2px;font-size:13.5px;color:var(--ink-3);font-weight:500}
.row span em{font-style:normal;font-weight:900;font-size:17px;color:var(--ink);display:inline-block;margin-right:3px}
.rate{position:relative;display:inline-block}
.plus{position:absolute;left:100%;top:0;font-style:normal;font-weight:900;font-size:15px;color:var(--red);opacity:0;pointer-events:none;white-space:nowrap}
.sw{position:relative;width:56px;height:34px;border-radius:17px;border:0;padding:0;flex:none;cursor:pointer;background:linear-gradient(180deg,#3cc66a,#28a956);box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.sw::after{content:"";position:absolute;top:3px;left:25px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04)}
.sw.gum{background:none;box-shadow:none}
.sw.gum::after{display:none}
.lock{display:inline-flex !important;vertical-align:-1px;margin-left:4px;color:var(--ink-3)}
.foot{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:15px;color:var(--ink-3);font-weight:500}
.foot i{width:7px;height:7px;border-radius:50%;background:#2fb35d;box-shadow:0 0 0 3px rgba(47,179,93,.15);flex:none}

/* L3 plan */
.plan{margin-top:16px;border:1px solid var(--line-2);border-radius:18px;padding:14px 16px 13px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 12px;background:linear-gradient(180deg,#fff,#fbfaf7)}
.badge{grid-row:span 2;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:900;font-size:13px;color:#7a4c10;background:linear-gradient(160deg,#ffe3a3,#f6b552);box-shadow:inset 0 0 0 1px rgba(168,104,26,.18)}
.plan b{font-weight:700;font-size:17px;letter-spacing:-.015em}
.plan .price{grid-row:span 2;text-align:right;font-weight:700;font-size:22px;letter-spacing:-.02em}
.plan .price small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.plan span{font-size:13px;color:var(--ink-3);font-weight:500}
.feats{list-style:none;padding:0;margin-top:10px}
.feats li{display:flex;align-items:center;gap:10px;height:30px;font-size:14.5px;font-weight:500;color:var(--ink-2)}
.feats li+li{border-top:1px solid var(--line)}
.actions{position:absolute;left:26px;right:26px;height:0}
.keep{position:absolute;left:0;right:0;top:0;height:52px;border:0;border-radius:14px;background:var(--ink);color:#fff;z-index:2;font:700 15px "Satoshi",sans-serif;letter-spacing:-.01em;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 8px 18px -10px rgba(0,0,0,.6);will-change:transform}
.keep em{display:block;font-style:normal;font-weight:500;font-size:.42em;letter-spacing:0;color:rgba(255,255,255,.62);height:0;opacity:0;overflow:hidden}
.cancel{position:absolute;left:50%;top:66px;white-space:nowrap;border:0;background:none;padding:6px 10px;cursor:pointer;font:500 16px "Satoshi",sans-serif;color:var(--ink-2);
  text-decoration:underline;text-decoration-color:rgba(18,18,20,.3);text-underline-offset:3px;transform-origin:50% 0;z-index:3}

/* L4 tilted slider */
.filter{margin-top:14px;border:1px solid var(--line-2);border-radius:18px;padding:13px 16px 4px;background:linear-gradient(180deg,#fff,#fbfaf7)}
.fhead{display:flex;align-items:center;gap:8px}
.fhead small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.val{font-weight:700;font-size:23px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:inline-block;transform-origin:0 60%;margin-left:2px}
.val small{font-size:13px;color:var(--ink-3);font-weight:500;letter-spacing:0}
.level{margin-left:auto;position:relative;width:84px;height:24px;border-radius:12px;flex:none;background:linear-gradient(180deg,#eaf3d9,#d7e8b8);box-shadow:inset 0 0 0 1px rgba(80,110,30,.22),inset 0 2px 3px rgba(80,110,30,.15)}
.level::before,.level::after{content:"";position:absolute;top:3px;bottom:3px;width:1.5px;background:rgba(80,110,30,.35)}
.level::before{left:31px}.level::after{right:31px}
.bubble{position:absolute;top:3px;left:32px;width:20px;height:18px;border-radius:9px;background:radial-gradient(circle at 40% 35%,#fff,#f4f9ea 60%,#e3efc9);box-shadow:0 0 0 1px rgba(80,110,30,.2)}
.area{position:relative;height:150px;margin:0 -6px}
.rail{position:absolute;left:50%;top:50%;height:8px;border-radius:4px;background:#ebe8e1;transform-origin:50% 50%;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--gold-1),var(--gold-2))}
.end{position:absolute;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.end.lo{left:-10px;top:16px}
.end.hi{right:-14px;top:-30px}
.stop{position:absolute;right:-5px;top:-7px;width:5px;height:22px;border-radius:2px;background:#cfcac0}
.goalmark{position:absolute;left:-6px;top:-8px;width:20px;height:24px;border-radius:6px;border:1.5px dashed rgba(168,104,26,.55)}
.knob{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;cursor:grab;box-shadow:0 0 0 1px rgba(18,18,20,.07),0 4px 10px -2px rgba(40,34,20,.28)}
.knob::after{content:"";position:absolute;inset:11px;border-radius:50%;background:linear-gradient(var(--gold-1),var(--gold-2))}
.knob svg{position:absolute;left:-9px;top:-9px;width:52px;height:52px;overflow:visible;pointer-events:none}
.tiers{display:flex;gap:8px;margin-top:14px}
.tier{flex:1;border:1px solid var(--line-2);border-radius:14px;padding:9px 11px;transition:none}
.tier b{display:block;font-weight:700;font-size:14px;letter-spacing:-.01em}
.tier span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:1px}
.tier.on{border-color:#e7c27e;background:#fffaf0;box-shadow:0 0 0 3px rgba(242,164,58,.12)}
.tier.out.on{border-color:#e9a59f;background:#fff5f4;box-shadow:0 0 0 3px rgba(217,71,61,.1)}

/* L5 sorted back */
.sort{margin-top:6px;display:flex;align-items:center;gap:6px;font-size:15px;color:var(--ink-3);font-weight:500;height:20px}
.sort b{font-weight:700;color:var(--ink);display:inline-block;transform-origin:0 60%}
.slist{position:relative;padding:0;list-style:none;margin-top:12px;height:226px;border:1px solid var(--line-2);border-radius:18px;background:#fbfaf7}
.srow{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;background:#fff;border-radius:16px;will-change:transform;cursor:grab}
.srow::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line)}
.srow.first::before,.srow.lift::before{display:none}
.srow.lift{box-shadow:0 18px 32px -14px rgba(40,34,20,.35),0 0 0 1px rgba(18,18,20,.07);cursor:grabbing}
.grip{width:22px;height:34px;display:grid;place-items:center;color:#b7b4ad;flex:none}
.rank{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13.5px;background:#f2efe8;color:var(--ink-2)}
.srow>div{flex:1;min-width:0}
.srow b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.srow div>span{display:block;margin-top:1px;font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.srow.bug .rank{background:#fdecea;color:var(--red-ink)}
.srow.bug b{color:var(--red-ink)}
.lv-sort .btn{margin-top:12px}

/* L6 honest rating */
.track{position:relative;height:84px;margin:18px auto 0;cursor:pointer;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.star{position:absolute;left:50%;top:42%;width:48px;height:48px;margin:-24px 0 0 -24px;padding:0;border:0;background:none;cursor:pointer;will-change:transform}
.star svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.star .on{transform-origin:50% 55%;filter:drop-shadow(0 6px 9px rgba(242,164,58,.38))}
.star i{position:absolute;left:0;right:0;top:100%;margin-top:3px;font-style:normal;text-align:center;font-weight:700;font-size:12px;color:var(--ink-3)}
.star.one i{color:var(--red-ink)}
.star.one svg>path{stroke:#e8a49d}
.slabel{height:22px;text-align:center;font-size:16px;font-weight:500;color:var(--ink-3);margin-top:6px}
.slabel.hot{color:var(--gold-ink);font-weight:700}
.quote{margin-top:16px;border:1px solid var(--line-2);border-radius:16px;padding:12px 15px;font-size:15px;line-height:1.4;color:var(--ink-3);font-weight:500;min-height:70px}
.quote b{color:var(--ink);font-weight:700}

/* L7 cookies */
.ghostline{height:12px;border-radius:6px;background:#f0eee9;margin-top:12px}
.banner{position:absolute;left:12px;right:12px;bottom:12px;height:300px;border-radius:22px;background:#fff;border:1px solid var(--line);
  box-shadow:0 -20px 50px -24px rgba(40,34,20,.35),0 0 0 1px rgba(18,18,20,.02);padding:20px 20px 18px;z-index:3;will-change:transform}
.lv-cookie .shade{position:absolute;inset:0;background:rgba(243,242,238,.55);z-index:2;pointer-events:none}
.banner h2{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.banner p{margin-top:7px;font-size:14px;line-height:1.4;color:var(--ink-2);font-weight:500}
.banner .btn{position:absolute;left:20px;right:20px;bottom:18px;width:auto;height:50px}
.reject{position:absolute;left:0;top:0;height:40px;padding:0 15px;border-radius:12px;border:1px solid var(--line-2);background:#fff;color:var(--ink);
  font:700 14px "Satoshi",sans-serif;white-space:nowrap;cursor:pointer;z-index:4;box-shadow:0 6px 14px -8px rgba(40,34,20,.3);will-change:transform}
.manage{position:absolute;left:20px;bottom:76px;border:0;background:none;padding:4px 0;font:500 13px "Satoshi",sans-serif;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* L8 undo */
.files{list-style:none;padding:0;margin-top:14px;border:1px solid var(--line-2);border-radius:18px;overflow:hidden;background:#fff}
.file{position:relative;overflow:hidden;height:56px}
.file+.file::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line);z-index:1}
.in{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 10px 0 14px}
.ft{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:900;font-size:9.5px;letter-spacing:.04em;color:#fff}
.in div{flex:1;min-width:0}
.in b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.in div span{display:block;margin-top:1px;font-size:13px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.trash{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--red);cursor:pointer;flex:none}
.locked{font-size:12px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:4px;white-space:nowrap}
.flash{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,215,114,.45),rgba(255,215,114,.12));opacity:0;pointer-events:none}
.slot{position:relative;height:56px;margin-top:14px}
.toast{position:absolute;left:0;right:0;top:0;height:56px;border-radius:16px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:4px;padding:0 6px 0 16px;box-shadow:0 14px 30px -14px rgba(0,0,0,.55);opacity:0;will-change:transform}
.tmsg{flex:1;font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px;transform-origin:0 50%;min-width:0;overflow:hidden}
.count{font-weight:900;font-size:15px;color:#121214;background:var(--gold-1);border-radius:8px;padding:0 7px 1px;display:none}
.undo{position:relative;height:40px;padding:0 13px;border:0;border-radius:11px;background:rgba(255,255,255,.08);color:var(--gold-1);font:700 15px "Satoshi",sans-serif;cursor:pointer;flex:none}
.undo .ring2{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:2px solid var(--gold-1);opacity:0;pointer-events:none}
.close{width:44px;height:44px;border:0;border-radius:11px;background:none;color:rgba(255,255,255,.7);display:grid;place-items:center;cursor:pointer;flex:none}
.timebar{position:absolute;left:16px;right:16px;bottom:5px;height:2px;border-radius:1px;background:rgba(255,215,114,.85);transform-origin:0 50%}

/* L9 hold */
.arena{position:relative;height:262px;margin:12px -8px 0;border-radius:20px;background:#fbfaf7;border:1px dashed #e2ded5}
.hold{position:absolute;left:0;top:0;width:196px;height:58px;margin:-29px 0 0 -98px;border:0;border-radius:16px;background:var(--ink);color:#fff;overflow:hidden;cursor:pointer;
  font:700 15.5px "Satoshi",sans-serif;letter-spacing:-.01em;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 14px 26px -12px rgba(0,0,0,.55);will-change:transform;z-index:2}
.hold .gfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,var(--gold-1),var(--gold-2));transform-origin:0 50%;transform:scaleX(0)}
.hold span{position:relative;z-index:1}
.hold.lit span{color:#121214}
.pct{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--ink-3);font-variant-numeric:tabular-nums}
.offer{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);
  box-shadow:0 14px 28px -14px rgba(40,34,20,.35);opacity:0;z-index:3;pointer-events:none}
.offer b{flex:1;font-weight:700;font-size:14px;letter-spacing:-.01em}
.offer b span{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.offer button{height:34px;padding:0 12px;border:0;border-radius:10px;background:linear-gradient(160deg,#ffe3a3,#f6b552);color:#5c3a0c;font:700 13px "Satoshi",sans-serif;cursor:pointer}

/* start + result */
.lv-start{display:flex;flex-direction:column}
.receipt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line-2);border-radius:18px;background:linear-gradient(180deg,#fff,#fbfaf7)}
.receipt b{display:block;font-weight:700;font-size:16px;letter-spacing:-.015em}
.receipt span{display:block;font-size:13px;color:var(--ink-3);font-weight:500;margin-top:1px}
.receipt .price{margin-left:auto;font-weight:700;font-size:22px;letter-spacing:-.02em}
.receipt .price small{font-size:13px;color:var(--ink-3);font-weight:500}
.big{margin-top:22px;font-weight:900;font-size:38px;line-height:1.02;letter-spacing:-.035em}
.lede{margin-top:10px;font-size:16px;line-height:1.4;color:var(--ink-2);font-weight:500}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.steps span{height:26px;padding:0 10px;border-radius:8px;background:#f4f2ed;font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;align-items:center}
.lv-start .btn{margin-top:auto;height:54px;font-size:16px}
.best{margin-top:10px;text-align:center;font-size:13px;font-weight:500;color:var(--ink-3);height:18px}
.best b{color:var(--ink);font-weight:700}
.lv-end{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.stamp{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,#ffe3a3,#f6b552);box-shadow:0 12px 24px -10px rgba(242,164,58,.75)}
.escaped{margin-top:14px;font-weight:700;font-size:17px;color:var(--ink-2);letter-spacing:-.01em}
.final{font-weight:900;font-size:66px;line-height:1;letter-spacing:-.045em;margin-top:4px;display:flex;align-items:baseline}
.final small{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--ink-3);margin-left:6px}
.final .d{display:inline-block;width:.58em;text-align:center}
.final .dot{display:inline-block;width:.24em;text-align:center}
.meta{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.meta span{height:28px;padding:0 11px;border-radius:9px;background:#f4f2ed;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.meta span.newbest{background:#fff3d6;color:#7a4c10}
.meta span.pen2{background:#fdecea;color:var(--red-ink)}
.splits{display:flex;gap:2px;width:100%;height:10px;margin-top:18px;border-radius:5px;overflow:hidden}
.splits i{display:block;height:100%;background:#e9e5dc;transform-origin:0 50%}
.splits i.slow{background:linear-gradient(90deg,var(--gold-1),var(--gold-2))}
.slowest{margin-top:8px;font-size:13px;color:var(--ink-3);font-weight:500;height:18px}
.slowest b{color:var(--ink);font-weight:700}
.endbtns{display:flex;gap:10px;width:100%;margin-top:auto}
.endbtns .btn{flex:1}
.endbtns .ghost{flex:0 0 auto;width:auto;padding:0 18px}
.comment{margin-top:12px;font-size:13.5px;font-weight:500;color:var(--ink-3)}
.comment a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px solid var(--line-2)}

@media (max-height:700px){ .game{justify-content:flex-start;padding-top:10px} .goal{height:38px} .msg{height:30px} }
/* short phones / in-app browsers: game.js scales the whole column down to fit (fitGame) */
.game.fit{justify-content:flex-start;transform-origin:50% 0}
@media (max-width:380px), (max-height:700px){ .steps{display:none} .big{font-size:35px} .lede{margin-top:12px} }
@media (max-width:380px){ .goal{font-size:15px;gap:8px} .goal small{font-size:12.5px} .where{font-size:18px} }
@media (pointer:coarse){ .hint-keys{display:none} }

/* ---------- reel mode: fixed 540x960 phone canvas, recorded at 2x ---------- */
.reel-top,.reel-out{display:none}
body.reel .game{display:block;width:540px;height:960px;margin:0 auto;padding:0}
body.reel .col,body.reel .card{position:absolute;left:60px;--cw:420px}
body.reel .hud{top:166px}
body.reel .bar{top:226px;margin:0}
body.reel .goal{top:236px}
body.reel .card{top:282px}
body.reel .msg{top:752px;font-size:19px;height:44px}
body.reel .reel-top{display:block;position:absolute;left:0;right:0;top:58px;text-align:center;font-weight:900;font-size:31px;line-height:1.1;letter-spacing:-.03em;padding:0 50px;text-wrap:balance;z-index:5}
body.reel .reel-top span{display:block;margin-top:8px;font-weight:500;font-size:13px;letter-spacing:.01em;color:var(--ink-3)}
body.reel .reel-out{display:block;position:absolute;left:0;right:0;top:58px;text-align:center;opacity:0;z-index:5;font-weight:900;font-size:27px;letter-spacing:-.025em}
.reel-out b{display:inline-block;font-weight:900;background:var(--ink);color:#fff;border-radius:10px;padding:1px 10px 3px;letter-spacing:.01em}
.reel-out small{display:block;margin-top:10px;font-weight:700;font-size:18px;letter-spacing:-.01em;color:#34343a}
.reel-out small em{font-style:normal;font-weight:500;color:var(--ink-2)}
body.reel, body.reel *{cursor:none !important}
#cursor{position:fixed;left:0;top:0;width:0;height:0;z-index:99;pointer-events:none;display:none}
body.reel #cursor{display:block}
#cursor svg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
#ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(18,18,20,.5);opacity:0}

@media (prefers-reduced-motion:reduce){ .bar li i{transition:none} }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="game" id="game">
  <p class="reel-top">Nobody has finished this under 30&nbsp;s.<span>Cancel your subscription: the game &middot; @zellap.app</span></p>
  <div class="reel-out"><span>Comment <b>CODE</b> to play it</span><small>Can you beat it? <em>&middot; @zellap.app</em></small></div>

  <header class="col hud">
    <div class="hud-l"><span class="step" id="step">Orbit Pro</span><b class="where" id="where">Ready to leave?</b></div>
    <div class="timer" id="timer" role="timer" aria-label="Elapsed time"><span id="tnum"></span><small>s</small><i class="pen" id="pen"></i></div>
  </header>
  <ol class="col bar" id="bar" aria-hidden="true"></ol>
  <p class="col goal" aria-live="polite"><i></i><span id="goalText">Cancel your subscription</span><small id="goalNote"></small></p>
  <main class="card" id="card">
    <div class="clip" id="clip"></div>
    <div class="ring" id="cardRing"></div>
  </main>
  <p class="col msg" id="msg" aria-live="assertive"></p>
</div>
<noscript><p style="position:fixed;inset:auto 0 20px;text-align:center">This game needs JavaScript. Of course it does.</p></noscript>
<script>/* inlined from game.js */
/* Cancel your subscription: the game · @zellap.app
   Nine levels built from the Cursed UI components. One sim clock (K.now, ms) drives everything:
   requestAnimationFrame in the browser, or window.__tick(ms) when ?manual=1 (frame-exact recording / tests).
   ?reel=1 adds the 540x960 reel overlays and a drawn cursor. ?level=N jumps straight to a level (dev). */
(() => {
  'use strict';
  const qs = new URLSearchParams(location.search);
  const REEL = qs.has('reel'), MANUAL = qs.has('manual');
  const PENALTY = 3000;
  const BEST_KEY = 'zellap-cancel-best';
  if (REEL) document.body.classList.add('reel');

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const NS = 'http://www.w3.org/2000/svg';

  /* ================================================================ kit */
  const K = { now: 0, px: -999, py: -999, down: false, touch: false };
  const tweens = [];
  const ease = {
    lin: t => t,
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
    back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  const tween = (dur, fn, e = ease.out, delay = 0) => { const tw = { t0: K.now + delay, dur, fn, e }; tweens.push(tw); return tw; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const spring = (s, target, k, z, dt) => { s.v += (k * (target - s.x) - 2 * Math.sqrt(k) * z * s.v) * dt; s.x += s.v * dt; };
  const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const inside = (el, x, y, pad = 0) => { const r = el.getBoundingClientRect(); return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad; };
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const store = {
    get() { try { const v = parseFloat(localStorage.getItem(BEST_KEY)); return isFinite(v) ? v : null; } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* private mode: no best time */ } }
  };
  const fmt = ms => (Math.max(0, ms) / 1000).toFixed(1);
  const digits = s => s.split('').map(c => c === '.' ? '<span class="dot">.</span>' : `<span class="d">${c}</span>`).join('');

  const ORBIT = '<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="5.2" fill="#fff"/><ellipse cx="13" cy="13" rx="11" ry="4.6" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" transform="rotate(-24 13 13)"/><circle cx="22.6" cy="8.6" r="2" fill="#f2a43a"/></svg>';
  const XICON = '<div class="x" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>';
  const app = (where, right = XICON, iconAttr = '') => `<div class="app"><div class="icon" ${iconAttr} aria-hidden="true">${ORBIT}</div><div><b>Orbit</b><span>${where}</span></div>${right}</div>`;
  const CHECK = '<span class="chk"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 7.4l2.6 2.6L11 4.6" fill="none" stroke="#2f8a3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

  /* ================================================================ shell */
  const card = $('#card'), clip = $('#clip'), ringEl = $('#cardRing');
  const stepEl = $('#step'), whereEl = $('#where'), goalEl = $('#goalText'), goalNote = $('#goalNote');
  const timerEl = $('#timer'), tnum = $('#tnum'), penEl = $('#pen'), msgEl = $('#msg'), barEl = $('#bar');

  const shake = { x: 0, v: 0 }, kick = { x: 0, v: 0 }, timerPop = { x: 0, v: 0 };
  let LEVELS = [];
  let idx = -1, inst = null, lvEl = null, phase = 'start';   // start | play | between | end
  let runT0 = 0, penalties = 0, penaltyCount = 0, finalMs = 0, levelT0 = 0, splits = [];
  let msgTw = null;

  function elapsed() {
    if (phase === 'start') return 0;
    if (phase === 'end') return finalMs;
    return K.now - runT0 + penalties;
  }

  function say(text, kind = '', ms = 1700) {
    msgEl.textContent = text; msgEl.className = 'col msg ' + kind;
    if (msgTw) msgTw.dead = true;
    msgTw = tween(ms, p => {
      const a = p < .12 ? p / .12 : p > .8 ? (1 - p) / .2 : 1;
      msgEl.style.opacity = a; msgEl.style.transform = `translateY(${(1 - Math.min(1, p / .12)) * 6}px)`;
    }, ease.lin);
  }

  function buildBar() {
    barEl.innerHTML = LEVELS.map(() => '<li><i></i></li>').join('');
  }
  function paintBar(doneN, cur) {
    $$('li', barEl).forEach((li, i) => { li.classList.toggle('cur', i === cur); if (i < doneN) li.firstChild.style.transform = 'scaleX(1)'; else li.firstChild.style.transform = 'scaleX(0)'; });
  }

  function setHud(step, where, goal, note = '') {
    stepEl.textContent = step; whereEl.textContent = where; goalEl.textContent = goal; goalNote.textContent = note;
    tween(320, p => { goalEl.parentNode.style.opacity = p; goalEl.parentNode.style.transform = `translateX(${(1 - p) * 10}px)`; });
  }

  /* level instance api: everything a level needs, scoped so timers die with it */
  function makeApi(own) {
    const timers = [];
    const api = {
      dead: false,
      later(ms, fn) { const t = { at: K.now + ms, fn }; timers.push(t); return t; },
      cancel(t) { const i = timers.indexOf(t); if (i >= 0) timers.splice(i, 1); },
      runTimers() { for (let i = timers.length - 1; i >= 0; i--) if (K.now >= timers[i].at) { const t = timers.splice(i, 1)[0]; if (!api.dead) t.fn(); } },
      tween(dur, fn, e, delay) { return tween(dur, p => { if (!api.dead) fn(p); }, e, delay); },
      win(text) { if (api.dead || own.won) return; own.won = true; levelWon(text); },
      fail(text, opt = {}) { if (api.dead || own.won) return; levelFailed(text, opt); },
      shake(power = 1) { shake.v += 900 * power * (Math.random() < .5 ? -1 : 1) * (REEL || MANUAL ? 1 : 1); kick.v += 6 * power; },
      say,
      overlay(html) {
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'overlay'); svg.setAttribute('aria-hidden', 'true');
        svg.innerHTML = html; document.body.appendChild(svg); own.overlays.push(svg); return svg;
      },
      uid: 'u' + Math.random().toString(36).slice(2, 8)
    };
    return api;
  }

  function mount(i, dir = 1) {
    const L = LEVELS[i];
    const old = lvEl, oldInst = inst;
    if (oldInst) destroy(oldInst);
    const el = document.createElement('section');
    el.className = 'lv lv-' + L.id;
    el.setAttribute('aria-label', L.where);
    el.innerHTML = L.html();
    clip.appendChild(el);
    const own = { won: false, overlays: [] };
    const api = makeApi(own);
    const ins = L.make(el, api) || {};
    ins.api = api; ins.own = own; ins.def = L; ins.el = el;
    inst = ins; lvEl = el; idx = i;
    setHud(`Step ${i + 1} of ${LEVELS.length}`, L.where, L.goal, L.note || '');
    paintBar(i, i);
    // slide: old out to the left, new in from the right
    if (old) {
      tween(260, p => { old.style.opacity = 1 - p; old.style.transform = `translateX(${-40 * p * dir}px) scale(${1 - .02 * p})`; }, ease.inOut);
      tween(1, () => old.remove(), ease.lin, 270);
    }
    el.style.opacity = 0;
    tween(380, p => { el.style.opacity = p; el.style.transform = `translateX(${46 * (1 - p) * dir}px)`; }, ease.out, old ? 120 : 0);
    levelT0 = K.now;
    if (ins.focus) tween(1, () => ins.focus(), ease.lin, 140);
  }
  function destroy(ins) {
    ins.api.dead = true;
    if (ins.destroy) ins.destroy();
    ins.own.overlays.forEach(svg => { const o = svg; tween(160, p => o.style.opacity = 1 - p); tween(1, () => o.remove(), ease.lin, 170); });
  }

  function levelWon(text) {
    splits[idx] = K.now - levelT0 + (splits[idx] || 0);
    if (text) say(text, 'good', 1300);
    // satisfying, confetti-free: gold ring sweeps the card, the progress segment springs full, the card pops
    tween(520, p => { ringEl.style.opacity = Math.sin(Math.PI * p) * .95; }, ease.lin);
    kick.v -= 5;
    const seg = barEl.children[idx] && barEl.children[idx].firstChild;
    if (seg) tween(420, p => seg.style.transform = `scaleX(${p})`, ease.back);
    phase = 'between';
    const next = idx + 1;
    tween(1, () => {
      if (next < LEVELS.length) { mount(next); phase = 'play'; }
      else finish();
    }, ease.lin, 560);
  }

  function levelFailed(text, { penalty = false, reset = true, delay = 520 } = {}) {
    inst.api.shake(penalty ? 1.25 : .7);
    if (penalty) {
      penalties += PENALTY; penaltyCount++;
      penEl.textContent = `+${PENALTY / 1000} s`;
      tween(1100, p => { penEl.style.opacity = p < .7 ? 1 : (1 - p) / .3; penEl.style.transform = `translateY(${-4 + 10 * ease.out(Math.min(1, p * 2))}px)`; }, ease.lin);
      timerPop.v += 14;
      timerEl.classList.add('hot'); tween(1, () => timerEl.classList.remove('hot'), ease.lin, 900);
    }
    if (text) say(text, 'bad', 1900);
    if (reset) {
      const keep = idx;
      splits[keep] = (splits[keep] || 0) + (K.now - levelT0);
      const own = inst.own; own.won = true;   // freeze input on the failed instance
      tween(1, () => { if (idx === keep && phase === 'play') remountSame(); }, ease.lin, delay);
    }
  }
  function remountSame() {
    const L = LEVELS[idx], old = lvEl;
    destroy(inst);
    const el = document.createElement('section');
    el.className = 'lv lv-' + L.id; el.innerHTML = L.html();
    clip.appendChild(el);
    const own = { won: false, overlays: [] }, api = makeApi(own);
    const ins = L.make(el, api) || {}; ins.api = api; ins.own = own; ins.def = L; ins.el = el;
    inst = ins; lvEl = el; levelT0 = K.now;
    tween(140, p => old.style.opacity = 1 - p); tween(1, () => old.remove(), ease.lin, 150);
    el.style.opacity = 0;
    tween(240, p => { el.style.opacity = p; el.style.transform = `scale(${.985 + .015 * p})`; }, ease.out, 60);
    if (ins.focus) tween(1, () => ins.focus(), ease.lin, 100);
  }

  /* ================================================================ start + end screens */
  function startScreen() {
    phase = 'start';
    const best = store.get();
    setHud('Orbit Pro', 'Ready to leave?', 'Cancel your subscription', matchMedia('(pointer: coarse)').matches ? '9 steps' : 'mouse · touch · keys');
    paintBar(0, -1);
    const el = document.createElement('section');
    el.className = 'lv lv-start';
    el.innerHTML = `
      <div class="receipt"><div class="icon" aria-hidden="true">${ORBIT}</div><div><b>Orbit Pro</b><span>Renews Nov 28</span></div><div class="price">$24<small>/mo</small></div></div>
      <h1 class="big">Cancel your subscription.</h1>
      <p class="lede">Nine steps. Every button fights back. The clock starts when you do.</p>
      <div class="steps">${LEVELS.map(l => `<span>${l.where}</span>`).join('')}</div>
      <button class="btn" id="startBtn">Start cancelling</button>
      <p class="best">${best ? `Your best: <b>${best.toFixed(1)} s</b>` : 'Nobody has finished this under 30 s.'}</p>`;
    if (lvEl) { const o = lvEl; tween(200, p => o.style.opacity = 1 - p); tween(1, () => o.remove(), ease.lin, 210); }
    clip.appendChild(el); lvEl = el; inst = null;
    el.style.opacity = 0; tween(380, p => { el.style.opacity = p; el.style.transform = `translateY(${8 * (1 - p)}px)`; }, ease.out, lvEl ? 120 : 0);
    const b = $('#startBtn', el);
    b.addEventListener('click', go);
        renderTimer();
  }
  function go(at = 0) {
    if (phase !== 'start') return;
    penalties = 0; penaltyCount = 0; splits = []; finalMs = 0;
    phase = 'play';
    mount(typeof at === 'number' ? at : 0);
    runT0 = K.now + 360;                       // clock starts when level 1 has landed
    levelT0 = runT0;
  }

  function finish() {
    phase = 'end';
    finalMs = K.now - runT0 + penalties;
    const sec = +(finalMs / 1000).toFixed(1);
    const prev = store.get();
    const isBest = prev == null || sec < prev;
    if (isBest) store.set(sec);
    paintBar(LEVELS.length, -1);
    setHud('Subscription', 'Cancelled', 'You escaped', 'share it');
    const old = lvEl;
    if (inst) destroy(inst); inst = null;
    const total = splits.reduce((a, b) => a + (b || 0), 0) || 1;
    let slow = 0; splits.forEach((s, i) => { if ((s || 0) > (splits[slow] || 0)) slow = i; });
    const el = document.createElement('section');
    el.className = 'lv lv-end';
    el.innerHTML = `
      <div class="stamp" id="stamp"><svg width="30" height="30" viewBox="0 0 28 28"><path d="M7 14.5l4.6 4.6L21.5 9" fill="none" stroke="#7a4c10" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <p class="escaped">You escaped in</p>
      <div class="final" id="final" aria-label="${sec.toFixed(1)} seconds">${digits('0.0')}<small>s</small></div>
      <div class="meta">${isBest ? '<span class="newbest">New best</span>' : `<span>Best ${prev.toFixed(1)} s</span>`}
        ${penaltyCount ? `<span class="pen2">${penaltyCount} trap${penaltyCount > 1 ? 's' : ''} · +${(penalties / 1000).toFixed(0)} s</span>` : '<span>No traps hit</span>'}</div>
      <div class="splits" id="splits" aria-hidden="true">${splits.map((s, i) => `<i class="${i === slow ? 'slow' : ''}" style="flex:${Math.max(.02, (s || 0) / total)}"></i>`).join('')}</div>
      <p class="slowest">Slowest: <b>${LEVELS[slow].where}</b> · ${fmt(splits[slow] || 0)} s</p>
      <div class="endbtns"><button class="btn" id="share">Share your time</button><button class="btn ghost" id="again">Play again</button></div>
      <p class="comment">Comment your time on <a href="https://www.instagram.com/zellap.app/" target="_blank" rel="noopener">@zellap.app</a></p>`;
    clip.appendChild(el); lvEl = el;
    if (old) { tween(220, p => { old.style.opacity = 1 - p; old.style.transform = `scale(${1 - .03 * p})`; }); tween(1, () => old.remove(), ease.lin, 230); }
    el.style.opacity = 0;
    tween(360, p => { el.style.opacity = p; }, ease.out, 140);
    const stamp = $('#stamp', el); stamp.style.transform = 'scale(0)';
    tween(620, p => stamp.style.transform = `scale(${p}) rotate(${(1 - p) * -30}deg)`, ease.back, 220);
    const fin = $('#final', el), small = '<small>s</small>';
    tween(900, p => fin.innerHTML = digits((sec * p).toFixed(1)) + small, ease.out, 300);
    tween(420, p => { fin.style.transform = `scale(${1 + .06 * Math.sin(Math.PI * p)})`; }, ease.out, 1180);
    $$('#splits i', el).forEach((s, i) => { s.style.transform = 'scaleX(0)'; tween(380, p => s.style.transform = `scaleX(${p})`, ease.out, 420 + i * 45); });
    kick.v -= 8; tween(700, p => { ringEl.style.opacity = Math.sin(Math.PI * p); }, ease.lin, 200);
    $('#share', el).addEventListener('click', () => share(sec));
    $('#again', el).addEventListener('click', () => startScreen());
    if (REEL) tween(1, () => outro(true), ease.lin, 1250);   // after the count-up settles
    window.__result = { sec, penalties: penaltyCount, splits: splits.slice() };
  }

  async function share(sec) {
    const url = location.origin + location.pathname;
    const text = `I cancelled my subscription in ${sec.toFixed(1)} s. Nobody has done it under 30. Your turn:`;
    const btn = $('#share');
    try {
      if (navigator.share) { await navigator.share({ title: 'Cancel your subscription: the game', text, url }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    let ok = false;
    try { await navigator.clipboard.writeText(`${text} ${url}`); ok = true; } catch (e) {
      try {
        const ta = document.createElement('textarea'); ta.value = `${text} ${url}`; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); ta.remove();
      } catch (e2) { ok = false; }
    }
    if (btn) { btn.textContent = ok ? 'Copied. Paste it anywhere' : 'Copy failed'; setTimeout(() => { if (btn.isConnected) btn.textContent = 'Share your time'; }, 1800); }
  }

  /* ================================================================ levels */

  /* ---------- 1 · Notifications (Cursed UI #3, split badge) ----------
     Clicking a badge splits it. Catch the flying half mid-air and both halves pop. */
  LEVELS.push({
    id: 'badge', where: 'Notifications', goal: 'Clear your notifications',
    html: () => `${app('Activity', `<button class="ibtn" data-a="bell" aria-label="Clear notification"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M5 8a5 5 0 0 1 10 0c0 4.2 1.6 5.6 1.6 5.6H3.4S5 12.2 5 8z"/><path d="M8.2 16.4a2 2 0 0 0 3.6 0"/></svg></button>`, 'data-a="icon"')}
      <h1 class="h" data-a="title"><span class="tt">2 new notifications</span></h1>
      <p class="sub" data-r="sub">Clear them to open Settings.</p>
      <ul class="list">
        <li><div class="av" data-a="av1" style="background:linear-gradient(160deg,#ffcf7a,#e9953a)">M</div><p><strong>Maya</strong> commented on <strong>Homepage v3</strong></p><time>2m</time></li>

      <svg id="c-arrow" width="26" height="34" viewBox="0 0 26 34"><path d="M2 2 L2 26 L8.2 20.4 L12.4 30.4 L16.6 28.6 L12.5 18.9 L20.8 18.6 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg id="c-hand" width="30" height="34" viewBox="0 0 30 34" style="display:none;left:-9px;top:-2px"><path d="M10 15V5.2a2.6 2.6 0 0 1 5.2 0V13 M15.2 12.6a2.5 2.5 0 0 1 5 0v1.8 M20.2 13.6a2.5 2.5 0 0 1 5 0v6.2c0 6.6-4 11.2-10 11.2-4.6 0-6.7-2.2-9.4-6.5L3 19.6a2.5 2.5 0 0 1 4.2-2.7L10 20.8V15" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <svg id="c-grab" width="30" height="30" viewBox="0 0 30 30" style="display:none;left:-15px;top:-13px"><path d="M8.2 11.4a2.4 2.4 0 0 1 4.8 0v-1a2.4 2.4 0 0 1 4.8 0v1a2.4 2.4 0 0 1 4.8 0v1.4a2.4 2.4 0 0 1 4.6.9v4.8c0 5.6-3.8 9.4-9.4 9.4-4.2 0-6.4-1.8-8.6-5.2l-2.4-3.8a2.3 2.3 0 0 1 3.4-3z M13 11.4v4 M17.8 11.4v4 M22.6 12.8v3" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg></div>`);
    cursor.el = $('#cursor'); cursor.ring = $('#ring'); cursor.shapes = { arrow: $('#c-arrow'), hand: $('#c-hand'), grab: $('#c-grab') };
  }
  function moveCursor() {
    if (!REEL) return;
    const el = document.elementFromPoint(K.px, K.py);
    const kind = K.down && el && (el.closest('.srow') || el.closest('.knob')) ? 'grab' : el && (el.closest('button') || el.closest('.srow') || el.closest('.track')) ? 'hand' : 'arrow';
    for (const k in cursor.shapes) cursor.shapes[k].style.display = k === kind ? '' : 'none';
    cursor.el.style.transform = `translate(${K.px}px,${K.py}px) scale(${cursor.scale})`;
  }
  function cursorPress() {
    if (!REEL) return;
    tween(90, p => { cursor.scale = 1 - .14 * p; moveCursor(); });
    tween(300, p => { cursor.scale = .86 + .14 * p; moveCursor(); }, ease.back, 120);
    tween(480, p => { cursor.ring.style.opacity = (1 - p) * .9; cursor.ring.style.transform = `scale(${.4 + p * 1.1})`; });
  }
  let outroOn = false;
  function outro(on) {
    if (on === outroOn) return; outroOn = on;
    const top = $('.reel-top'), out = $('.reel-out');
    tween(320, p => { const q = on ? p : 1 - p;
      top.style.opacity = clamp(1 - q / .35, 0, 1); top.style.transform = `translateY(${-q * 10}px)`;
      const o = clamp((q - .2) / .5, 0, 1); out.style.opacity = o; out.style.transform = `translateY(${(1 - o) * 10}px)`; }, ease.lin);
  }

  /* ================================================================ loop */
  function renderTimer() {
    const s = fmt(elapsed());
    if (tnum.dataset.v !== s) { tnum.dataset.v = s; tnum.innerHTML = digits(s); }
  }
  function tick(ms) {
    const n = Math.max(1, Math.ceil(ms / 4));
    for (let i = 0; i < n; i++) {
      const dt = ms / n / 1000;
      K.now += ms / n;
      if (inst && !inst.api.dead) { inst.api.runTimers(); if (inst.update && !(inst.own.won && phase !== 'between' && false)) inst.update(dt); }
      spring(shake, 0, 520, .16, dt); spring(kick, 0, 380, .35, dt); spring(timerPop, 0, 420, .3, dt);
    }
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (K.now < tw.t0) continue;
      const p = tw.dur <= 1 ? 1 : Math.min(1, (K.now - tw.t0) / tw.dur);
      if (!tw.dead) tw.fn(tw.e(p));
      if (p >= 1) { const j = tweens.indexOf(tw); if (j >= 0) tweens.splice(j, 1); }
    }
    if (inst && !inst.api.dead && inst.render) inst.render();
    card.style.transform = `translateX(${(shake.x * .022).toFixed(2)}px) rotate(${(shake.x * .0016).toFixed(3)}deg) scale(${(1 + kick.x * .004).toFixed(4)})`;
    timerEl.style.transform = `scale(${(1 + timerPop.x * .012).toFixed(4)})`;
    renderTimer();
  }
  window.__tick = tick;
  window.__probe = (name, ...a) => inst && inst.probe && inst.probe[name] ? inst.probe[name](...a) : null;
  window.__state = () => ({ phase, level: phase === 'play' || phase === 'between' ? LEVELS[idx].id : phase, idx, elapsed: elapsed(), penalties: penaltyCount, won: !!(inst && inst.own.won) });
  window.__go = go;
  window.__outro = outro;

  /* short screens (iPhone SE in the Instagram browser is ~550 px tall): scale the whole column instead of cutting the card.
     Hit-testing reads clientX/Y against getBoundingClientRect, so it stays exact under the transform. */
  const gameEl = $('#game');
  function fitGame() {
    if (REEL) return;
    gameEl.classList.remove('fit'); gameEl.style.transform = '';
    const need = gameEl.scrollHeight, have = innerHeight;
    if (need > have + 1) {
      const s = Math.max(.72, have / need);
      gameEl.classList.add('fit'); gameEl.style.transform = `scale(${s.toFixed(4)})`;
    }
  }
  addEventListener('resize', fitGame);
  if (window.visualViewport) visualViewport.addEventListener('resize', fitGame);

  buildBar();
  startScreen();
  fitGame();
  const jump = parseInt(qs.get('level'), 10);
  if (jump >= 1 && jump <= LEVELS.length) go(jump - 1);
  if (!MANUAL) {
    let last = performance.now();
    requestAnimationFrame(function loop(t) { tick(Math.min(50, t - last)); last = t; requestAnimationFrame(loop); });
  } else tick(16);
})();
</script>
