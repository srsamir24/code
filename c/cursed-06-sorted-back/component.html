<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorted Back</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<style>/* inlined from ../_kit/reel.css */
/* Shared shell for the Cursed UI pages: palette, backdrop, hook/outro, reel canvas, cursor. */
:root{
  --bg:#f3f2ee; --ink:#121214; --ink-2:#5f5f66; --ink-3:#8d8c92;
  --line:rgba(18,18,20,.085); --line-2:#e6e3dc;
  --gold-1:#ffd772; --gold-2:#f2a43a; --gold-ink:#a8681a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Satoshi",ui-sans-serif,sans-serif; -webkit-font-smoothing:antialiased;
  overflow:hidden; -webkit-user-select:none; user-select:none;
}
.backdrop{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(60% 45% at 50% 46%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
    linear-gradient(var(--bg),var(--bg));
}
.backdrop::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(18,18,20,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,18,20,.045) 1px,transparent 1px);
  background-size:28px 28px; background-position:center;
  -webkit-mask-image:radial-gradient(55% 42% at 50% 46%,#000 10%,transparent 75%);
          mask-image:radial-gradient(55% 42% at 50% 46%,#000 10%,transparent 75%);
}
.stage{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px}

.tag{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 9px;border-radius:99px;
  background:#fff;border:1px solid var(--line);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  box-shadow:0 4px 10px -6px rgba(40,34,20,.18)}
.tag i,.outro i{display:block;width:7px;height:7px;border-radius:50%;background:linear-gradient(var(--gold-1),var(--gold-2))}
.hook{font-weight:900;font-size:27px;line-height:1.12;letter-spacing:-.025em;text-align:center;max-width:430px;text-wrap:balance}
.handle{display:block;margin-top:10px;font-weight:500;font-size:12.5px;letter-spacing:.01em;color:var(--ink-3)}
.outro{font-weight:900;font-size:30px;letter-spacing:-.025em;color:var(--ink);opacity:0;text-align:center}
.outro span{display:inline-flex;align-items:center;gap:10px}
.outro i{width:14px;height:14px}
.outro b{display:inline-block;font-weight:900;background:var(--ink);color:#fff;border-radius:10px;padding:1px 10px 3px;margin:0 1px;letter-spacing:.01em}
.outro small{display:block;margin-top:14px;font-weight:700;font-size:19px;letter-spacing:-.01em;color:#34343a}
.outro small em{font-style:normal;font-weight:500;color:var(--ink-2)}

.card{position:relative;width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 40px 70px -32px rgba(40,34,20,.22),0 10px 24px -12px rgba(0,0,0,.08);
}
.app{display:flex;align-items:center;gap:12px}
.icon{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(160deg,#2a2a33,#101014);display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 14px -6px rgba(0,0,0,.35)}
.app b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em}
.app span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:1px}
.x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-3)}

/* reel mode: fixed 540x960 phone canvas (recorded at 2x = 1080x1920) */
body.reel .stage{display:block;width:540px;height:960px;margin:0 auto;padding:0}
body.reel .tag{position:absolute;top:154px;left:50%;transform:translateX(-50%)}
body.reel .hook{position:absolute;top:198px;left:50%;transform:translateX(-50%);width:450px;font-size:30px}
body.reel .card{position:absolute;top:318px;left:60px}
body.reel .outro{position:absolute;top:192px;left:0;right:0;font-size:25px}
body:not(.reel) .outro{display:none}
body.reel, body.reel *{cursor:none !important}
#cursor{position:fixed;left:0;top:0;width:0;height:0;z-index:99;pointer-events:none;display:none}
body.reel #cursor{display:block}
#cursor svg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
#ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(18,18,20,.5);opacity:0}
</style>
<style>
  .card{padding:24px 28px 22px}
  h1{margin-top:16px;font-weight:700;font-size:28px;letter-spacing:-.025em;line-height:1.1}
  .sort{margin-top:8px;display:flex;align-items:center;gap:6px;font-size:17px;color:var(--ink-3);font-weight:500;height:22px}
  .sort b{font-weight:700;color:var(--ink);display:inline-block;transform-origin:0 60%}
  .sort svg{color:var(--ink-3)}
  .list{position:relative;padding:0;list-style:none;margin-top:14px;height:258px;border:1px solid var(--line-2);border-radius:18px;background:#fbfaf7}
  .row{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px 0 10px;background:#fff;
    border-radius:16px;will-change:transform;cursor:grab}
  .row::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:var(--line)}
  .row.first::before{display:none}
  .row.lift{box-shadow:0 18px 32px -14px rgba(40,34,20,.35),0 0 0 1px rgba(18,18,20,.07);z-index:3;cursor:grabbing}
  .row.lift::before{display:none}
  .grip{width:22px;height:34px;display:grid;place-items:center;color:#b7b4ad;flex:none}
  .rank{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px;background:#f2efe8;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .row div{flex:1;min-width:0}
  .row b{display:block;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
  .row div>span{display:block;margin-top:2px;font-size:13.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}
  .row.bug .rank{background:#fdecea;color:#c23a31}
  .row.bug div>span{color:#c23a31;font-weight:700}
  .row.bug div>span em{font-style:normal;display:inline-block;margin:0 3px}
  .ava{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
  .foot{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:16px;color:var(--ink-3);font-weight:500}
  .foot i{width:7px;height:7px;border-radius:50%;background:#2fb35d;box-shadow:0 0 0 3px rgba(47,179,93,.15)}
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="stage">
  <div class="tag"><i></i>Cursed UI #6</div>
  <header class="hook">The list has other plans.<span class="handle">@zellap.app</span></header>

  <main class="card" id="card">
    <div class="app">
      <div class="icon" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="5.2" fill="#fff"/><ellipse cx="13" cy="13" rx="11" ry="4.6" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4" transform="rotate(-24 13 13)"/><circle cx="22.6" cy="8.6" r="2" fill="#f2a43a"/></svg>
      </div>
      <div><b>Orbit</b><span>Roadmap &middot; Sprint 24</span></div>
      <div class="x" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div>
    </div>
    <h1>Sprint priorities</h1>
    <p class="sort">Sorted by <b id="sortBy">Recommended</b><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></p>
    <ol class="list" id="list" role="listbox" aria-label="Sprint priorities"></ol>
    <p class="foot"><i></i><span id="footText">Order saved.</span></p>
  </main>

  <footer class="outro" id="outro"><span><i></i>Comment <b>CODE</b> for the source</span><small>Follow for more cursed UI <em>&middot; @zellap.app</em></small></footer>
</div>

<script>/* inlined from ../_kit/reel.js */
/* Shared runtime for the Cursed UI pages.
   - a simulation clock (K.now, ms) advanced by K.tick(ms): rAF in the browser, stepped by the recorder (?manual)
   - tweens, easing, the hook <-> outro swap (window.__outro), and the reel cursor driven by real pointer events */
window.ReelKit = function (opts) {
  const qs = new URLSearchParams(location.search);
  const REEL = qs.has('reel'), MANUAL = qs.has('manual');
  if (REEL) document.body.classList.add('reel');

  const K = { REEL, MANUAL, now: 0, px: -999, py: -999, down: false };
  const tweens = [];
  K.ease = {
    lin: t => t,
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
    back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  K.tween = (dur, fn, e = K.ease.out, delay = 0) => { const tw = { t0: K.now + delay, dur, fn, e }; tweens.push(tw); return tw; };
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.lerp = (a, b, t) => a + (b - a) * t;
  /* critically-ish damped spring step: z = damping ratio */
  K.spring = (s, target, k, z, dt) => { s.v += (k * (target - s.x) - 2 * Math.sqrt(k) * z * s.v) * dt; s.x += s.v * dt; };

  /* ---------- cursor ---------- */
  document.body.insertAdjacentHTML('beforeend', `<div id="cursor">
    <div id="ring"></div>
    <svg id="c-arrow" width="26" height="34" viewBox="0 0 26 34"><path d="M2 2 L2 26 L8.2 20.4 L12.4 30.4 L16.6 28.6 L12.5 18.9 L20.8 18.6 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    <svg id="c-hand" width="30" height="34" viewBox="0 0 30 34" style="display:none;left:-9px;top:-2px"><path d="M10 15V5.2a2.6 2.6 0 0 1 5.2 0V13 M15.2 12.6a2.5 2.5 0 0 1 5 0v1.8 M20.2 13.6a2.5 2.5 0 0 1 5 0v6.2c0 6.6-4 11.2-10 11.2-4.6 0-6.7-2.2-9.4-6.5L3 19.6a2.5 2.5 0 0 1 4.2-2.7L10 20.8V15" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <svg id="c-grab" width="30" height="30" viewBox="0 0 30 30" style="display:none;left:-15px;top:-13px"><path d="M8.2 11.4a2.4 2.4 0 0 1 4.8 0v-1a2.4 2.4 0 0 1 4.8 0v1a2.4 2.4 0 0 1 4.8 0v1.4a2.4 2.4 0 0 1 4.6.9v4.8c0 5.6-3.8 9.4-9.4 9.4-4.2 0-6.4-1.8-8.6-5.2l-2.4-3.8a2.3 2.3 0 0 1 3.4-3z M13 11.4v4 M17.8 11.4v4 M22.6 12.8v3" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
  </div>`);
  const $ = id => document.getElementById(id);
  const cur = $('cursor'), ring = $('ring'), shapes = { arrow: $('c-arrow'), hand: $('c-hand'), grab: $('c-grab') };
  let curScale = 1;
  function moveCursor() {
    if (!REEL) return;
    const el = document.elementFromPoint(K.px, K.py);
    const kind = (opts.cursorKind && opts.cursorKind(el)) || 'arrow';
    for (const k in shapes) shapes[k].style.display = k === kind ? '' : 'none';
    cur.style.transform = `translate(${K.px}px,${K.py}px) scale(${curScale})`;
  }
  K.moveCursor = moveCursor;
  window.addEventListener('pointermove', e => { K.px = e.clientX; K.py = e.clientY; moveCursor(); });
  window.addEventListener('pointerleave', () => { K.px = K.py = -999; });
  window.addEventListener('pointerdown', () => {
    K.down = true;
    if (!REEL) return;
    K.tween(90, p => { curScale = 1 - .14 * p; moveCursor(); });
    K.tween(300, p => { curScale = .86 + .14 * p; moveCursor(); }, K.ease.back, 120);
    K.tween(480, p => { ring.style.opacity = (1 - p) * .9; ring.style.transform = `scale(${.4 + p * 1.1})`; });
  });
  window.addEventListener('pointerup', () => { K.down = false; moveCursor(); });

  /* ---------- hook <-> outro ---------- */
  let outroOn = false;
  window.__outro = on => {
    if (on === outroOn) return; outroOn = on;
    const hook = document.querySelector('.hook'), outro = document.querySelector('.outro');
    K.tween(440, p => { const q = on ? p : 1 - p;
      hook.style.opacity = K.clamp(1 - q / .45, 0, 1);   // strictly sequential: never two lines at once
      const o = K.clamp((q - .55) / .45, 0, 1);
      outro.style.opacity = o; outro.style.transform = `translateY(${(1 - o) * 10}px)`; }, K.ease.lin);
  };

  /* ---------- clock ---------- */
  function tick(ms) {
    const n = Math.max(1, Math.ceil(ms / 4));
    for (let i = 0; i < n; i++) { K.now += ms / n; opts.update(ms / n / 1000); }
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (K.now < tw.t0) continue;
      const p = tw.dur <= 1 ? 1 : Math.min(1, (K.now - tw.t0) / tw.dur);
      tw.fn(tw.e(p));
      if (p >= 1) tweens.splice(i, 1);
    }
    opts.render();
  }
  window.__tick = tick;
  K.start = () => {
    if (!MANUAL) {
      let last = performance.now();
      requestAnimationFrame(function loop(t) { tick(Math.min(50, t - last)); last = t; requestAnimationFrame(loop); });
    } else tick(16);
  };
  return K;
};
</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const list = $('list'), sortBy = $('sortBy');
  const RH = 64;
  const ITEMS = [
    { id: 'ai', t: 'Add AI to the footer', m: 'Exec ask &middot; 8 pts', a: ['JD', '#7a6cf0'] },
    { id: 'logo', t: 'Make the logo bigger', m: 'CEO &middot; 3 pts', a: ['MK', '#e08a3c'] },
    { id: 'err', t: 'Rebrand the 404 page', m: 'Q4 OKR &middot; 5 pts', a: ['SL', '#3aa6a0'] },
    { id: 'bug', t: 'Fix checkout crash', m: 'P0 &middot; <em id="users">312</em> users affected', a: ['YOU', '#121214'] }];
  const RECOMMENDED = ITEMS.map(i => i.id);
  const SORT_DELAY = [1000, 600, 300, 60, 0, 0];   // ms after you drop it: every attempt, it gives up pretending sooner
  const SORT_MS = [600, 450, 350, 260, 220, 220];
  const USERS = [312, 640, 1204, 2391, 4870, 9958, 12480];

  const rows = {};
  for (const it of ITEMS) {
    const el = document.createElement('li');
    el.className = 'row' + (it.id === 'bug' ? ' bug' : '');
    el.innerHTML = `<span class="grip" aria-hidden="true"><svg width="10" height="16" viewBox="0 0 10 16">${[2, 8, 14].map(y => `<circle cx="2" cy="${y}" r="1.6" fill="currentColor"/><circle cx="8" cy="${y}" r="1.6" fill="currentColor"/>`).join('')}</svg></span>
      <span class="rank"></span><div><b>${it.t}</b><span>${it.m}</span></div><span class="ava" style="background:${it.a[1]};font-size:${it.a[0].length > 2 ? 8.5 : 11}px">${it.a[0]}</span>`;
    el.setAttribute('role', 'option');
    list.appendChild(el);
    rows[it.id] = { el, y: { x: 0, v: 0 }, k: 420, lift: { x: 0, v: 0 }, tw: false, ghost: false };
  }

  let order = [...RECOMMENDED], dragging = null, grabDY = 0, dragY = 0, attempt = 0, users = 0;
  const timers = [];
  const later = (ms, fn) => timers.push({ at: K.now + ms, fn });

  const K = ReelKit({
    cursorKind: el => dragging ? 'grab' : (el && el.closest('.list')) ? 'hand' : 'arrow',
    update, render
  });

  function listTop() { return list.getBoundingClientRect().top + 1; }
  function rowAt(y) { const i = Math.floor((y - listTop()) / RH); return order[i]; }

  window.addEventListener('pointerdown', e => {
    const id = rowAt(e.clientY);
    const lr = list.getBoundingClientRect();
    if (!id || e.clientX < lr.left || e.clientX > lr.right) return;
    dragging = id; dragY = rows[id].y.x; grabDY = e.clientY - dragY; K.moveCursor();
  });
  window.addEventListener('pointerup', () => {
    if (!dragging) return;
    const id = dragging; dragging = null; K.moveCursor();
    order = placed(id);
    $('footText').textContent = 'Order saved.';
    swapText(sortBy, 'You');
    const n = attempt++;
    later(SORT_DELAY[Math.min(n, SORT_DELAY.length - 1)], () => sortBack(n));
  });

  function placed(id) {
    const rest = order.filter(x => x !== id);
    const i = K.clamp(Math.round(dragY / RH), 0, rest.length);
    rest.splice(i, 0, id); return rest;
  }

  /* quietly: soft springs, no toast, the footer still says "Order saved." */
  function sortBack(n) {
    if (dragging) return;
    order = [...RECOMMENDED];
    const ms = SORT_MS[Math.min(n, SORT_MS.length - 1)];
    // every row moves at once on one eased curve; the bug row is lifted by an invisible hand
    order.forEach((id, i) => {
      const r = rows[id], y0 = r.y.x, y1 = i * RH;
      if (Math.abs(y1 - y0) < .5) return;
      r.tw = true; r.ghost = id === 'bug';
      K.tween(ms, p => { r.y.x = K.lerp(y0, y1, p); r.y.v = 0; if (p >= 1) { r.tw = false; r.ghost = false; } }, K.ease.inOut);
    });
    swapText(sortBy, 'Recommended');
    users = Math.min(users + 1, USERS.length - 1);
    const u = $('users');
    later(ms * .6, () => { u.textContent = USERS[users].toLocaleString('en-US'); K.tween(420, p => u.style.transform = `scale(${1 + .18 * (1 - p)})`); });
  }

  function swapText(el, txt) {
    if (el.textContent === txt) return;
    el.textContent = txt;                                   // one step, no dissolve
    const back = txt === 'Recommended';
    K.tween(700, p => { el.style.color = back && p < .75 ? '#c23a31' : ''; el.style.transform = `scale(${1 + .12 * (1 - p)})`; });
  }

  function update(dt) {
    for (let i = timers.length - 1; i >= 0; i--) if (K.now >= timers[i].at) timers.splice(i, 1)[0].fn();
    let view = order;
    if (dragging) {
      dragY = K.clamp(K.py - grabDY, -8, (order.length - 1) * RH + 8);
      view = placed(dragging);
    }
    view.forEach((id, i) => {
      const r = rows[id];
      if (id === dragging) { r.y.x = dragY; r.y.v = 0; }
      else if (!r.tw) K.spring(r.y, i * RH, r.k, .9, dt);
      K.spring(r.lift, id === dragging || r.ghost ? 1 : 0, 500, .7, dt);
    });
  }

  function render() {
    for (const id in rows) {
      const r = rows[id], l = r.lift.x;
      r.el.style.transform = `translateY(${r.y.x.toFixed(2)}px) scale(${(1 + .025 * l).toFixed(4)})`;
      r.el.classList.toggle('lift', id === dragging || l > .3);
      r.el.classList.toggle('first', Math.abs(r.y.x) < 2);
      r.el.querySelector('.rank').textContent = K.clamp(Math.round(r.y.x / RH), 0, 3) + 1;   // the badge follows where the row actually is
      r.el.style.zIndex = id === dragging ? 3 : l > .05 ? 2 : 1;
    }
  }

  window.__grip = id => { const r = rows[id || 'bug'].el.querySelector('.grip').getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  window.__slotY = i => listTop() + i * RH + RH / 2;
  window.__reset = () => {
    attempt = 0; users = 0;
    const u = $('users');
    K.tween(160, p => u.style.opacity = 1 - p);
    later(170, () => { u.textContent = USERS[0]; u.style.transform = ''; K.tween(240, p => u.style.opacity = p); });
  };

  order.forEach((id, i) => rows[id].y.x = i * RH);
  K.start();
})();
</script>
</body>
</html>
