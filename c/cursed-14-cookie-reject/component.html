<style>/* inlined from ../_kit/reel.css */
/* Shared shell for the Cursed UI pages: palette, backdrop, hook/outro, reel canvas, cursor. */
:root{
  --bg:#f3f2ee; --ink:#121214; --ink-2:#5f5f66; --ink-3:#8d8c92;
  --line:rgba(18,18,20,.085); --line-2:#e6e3dc;
  --gold-1:#ffd772; --gold-2:#f2a43a; --gold-ink:#a8681a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Satoshi",ui-sans-serif,sans-serif; -webkit-font-smoothing:antialiased;
  overflow:hidden; -webkit-user-select:none; user-select:none;
}
.backdrop{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(60% 45% at 50% 46%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%),
    linear-gradient(var(--bg),var(--bg));
}
.backdrop::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(18,18,20,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(18,18,20,.045) 1px,transparent 1px);
  background-size:28px 28px; background-position:center;
  -webkit-mask-image:radial-gradient(55% 42% at 50% 46%,#000 10%,transparent 75%);
          mask-image:radial-gradient(55% 42% at 50% 46%,#000 10%,transparent 75%);
}
.stage{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px}

.tag{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px 0 9px;border-radius:99px;
  background:#fff;border:1px solid var(--line);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
  box-shadow:0 4px 10px -6px rgba(40,34,20,.18)}
.tag i,.outro i{display:block;width:7px;height:7px;border-radius:50%;background:linear-gradient(var(--gold-1),var(--gold-2))}
.hook{font-weight:900;font-size:27px;line-height:1.12;letter-spacing:-.025em;text-align:center;max-width:430px;text-wrap:balance}
.handle{display:block;margin-top:10px;font-weight:500;font-size:12.5px;letter-spacing:.01em;color:var(--ink-3)}
.outro{font-weight:900;font-size:30px;letter-spacing:-.025em;color:var(--ink);opacity:0;text-align:center}
.outro span{display:inline-flex;align-items:center;gap:10px}
.outro i{width:14px;height:14px}
.outro b{display:inline-block;font-weight:900;background:var(--ink);color:#fff;border-radius:10px;padding:1px 10px 3px;margin:0 1px;letter-spacing:.01em}
.outro small{display:block;margin-top:14px;font-weight:700;font-size:19px;letter-spacing:-.01em;color:#34343a}
.outro small em{font-style:normal;font-weight:500;color:var(--ink-2)}

.card{position:relative;width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:30px;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 40px 70px -32px rgba(40,34,20,.22),0 10px 24px -12px rgba(0,0,0,.08);
}
.app{display:flex;align-items:center;gap:12px}
.icon{width:44px;height:44px;border-radius:12px;flex:none;background:linear-gradient(160deg,#2a2a33,#101014);display:grid;place-items:center;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 14px -6px rgba(0,0,0,.35)}
.app b{display:block;font-weight:700;font-size:15px;letter-spacing:-.01em}
.app span{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:1px}
.x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-3)}

/* reel mode: fixed 540x960 phone canvas (recorded at 2x = 1080x1920) */
body.reel .stage{display:block;width:540px;height:960px;margin:0 auto;padding:0}
body.reel .tag{position:absolute;top:154px;left:50%;transform:translateX(-50%)}
body.reel .hook{position:absolute;top:198px;left:50%;transform:translateX(-50%);width:450px;font-size:30px}
body.reel .card{position:absolute;top:318px;left:60px}
body.reel .outro{position:absolute;top:192px;left:0;right:0;font-size:25px}
body:not(.reel) .outro{display:none}
body.reel, body.reel *{cursor:none !important}
#cursor{position:fixed;left:0;top:0;width:0;height:0;z-index:99;pointer-events:none;display:none}
body.reel #cursor{display:block}
#cursor svg{position:absolute;left:0;top:0;overflow:visible;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
#ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid rgba(18,18,20,.5);opacity:0}
</style>

.cu-ck .hero i{position:absolute;left:18px;bottom:14px;width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cu-ck .hero i::after{content:"";position:absolute;left:12px;top:15px;width:22px;height:16px;border-radius:5px;background:var(--ink)}
.cu-ck p.lede{margin-top:13px;font-size:14px;line-height:1.45;font-weight:500;color:var(--ink-2)}

.cu-ck .banner{position:absolute;left:10px;right:10px;bottom:10px;padding:17px 18px 14px;border-radius:22px;background:#fff;
  box-shadow:0 0 0 1px var(--line),0 -18px 40px -22px rgba(30,24,10,.35),0 2px 6px -2px rgba(0,0,0,.06)}
.cu-ck .banner h3{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.015em}
.cu-ck .banner p{margin-top:6px;font-size:13.5px;line-height:1.4;font-weight:500;color:var(--ink-2)}
.cu-ck .banner p a{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(18,18,20,.3);text-underline-offset:2px}
.cu-ck .row{display:flex;gap:10px;margin-top:13px}
.cu-ck .slot{position:relative;flex:1;height:46px}
.cu-ck .ghost{position:absolute;inset:0;border-radius:13px;border:1.5px dashed #d6d2c9;opacity:0}
.cu-ck .row button{height:46px;border-radius:13px;font:700 15.5px "Satoshi",sans-serif;letter-spacing:-.01em;cursor:pointer;white-space:nowrap}
.cu-ck .rej{position:absolute;left:0;top:0;width:100%;z-index:5;background:#fff;color:var(--ink);border:0;
  box-shadow:0 0 0 1px rgba(18,18,20,.16) inset,0 1px 2px rgba(0,0,0,.04);will-change:transform}
.cu-ck .acc{flex:1;border:0;color:#fff;background:linear-gradient(170deg,#2a2a31,#0f0f12);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 10px 20px -12px rgba(0,0,0,.6)}
.cu-ck .more{display:block;margin:10px auto 0;border:0;background:none;font:500 13px "Satoshi",sans-serif;color:var(--ink-3);cursor:pointer;text-decoration:underline;text-decoration-color:rgba(18,18,20,.2);text-underline-offset:2px}
</style>

<div class="backdrop"></div>
<div class="stage">
  <div class="tag"><i></i>Cursed UI #14</div>
  <header class="hook">Just click Reject all.<span class="handle">@zellap.app</span></header>

<script>/* inlined from ../_kit/reel.js */
/* Shared runtime for the Cursed UI pages.
   - a simulation clock (K.now, ms) advanced by K.tick(ms): rAF in the browser, stepped by the recorder (?manual)
   - tweens, easing, the hook <-> outro swap (window.__outro), and the reel cursor driven by real pointer events
   - opts.embedded: a private clock for a component mounted elsewhere (the game): no reel cursor, no globals, own rAF loop,
     K.stop() ends it. Pointer position is still tracked (K.px/K.py) */
window.ReelKit = function (opts) {
  if (opts.embedded) return ReelKit.embedded(opts);
  const qs = new URLSearchParams(location.search);
  const REEL = qs.has('reel'), MANUAL = qs.has('manual');
  if (REEL) document.body.classList.add('reel');

  const K = { REEL, MANUAL, now: 0, px: -999, py: -999, down: false };
  const tweens = [];
  K.ease = {
    lin: t => t,
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
    back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  K.tween = (dur, fn, e = K.ease.out, delay = 0) => { const tw = { t0: K.now + delay, dur, fn, e }; tweens.push(tw); return tw; };
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.lerp = (a, b, t) => a + (b - a) * t;
  /* critically-ish damped spring step: z = damping ratio */
  K.spring = (s, target, k, z, dt) => { s.v += (k * (target - s.x) - 2 * Math.sqrt(k) * z * s.v) * dt; s.x += s.v * dt; };

  /* ---------- cursor ---------- */
  document.body.insertAdjacentHTML('beforeend', `<div id="cursor">
    <div id="ring"></div>
    <svg id="c-arrow" width="26" height="34" viewBox="0 0 26 34"><path d="M2 2 L2 26 L8.2 20.4 L12.4 30.4 L16.6 28.6 L12.5 18.9 L20.8 18.6 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
    <svg id="c-hand" width="30" height="34" viewBox="0 0 30 34" style="display:none;left:-9px;top:-2px"><path d="M10 15V5.2a2.6 2.6 0 0 1 5.2 0V13 M15.2 12.6a2.5 2.5 0 0 1 5 0v1.8 M20.2 13.6a2.5 2.5 0 0 1 5 0v6.2c0 6.6-4 11.2-10 11.2-4.6 0-6.7-2.2-9.4-6.5L3 19.6a2.5 2.5 0 0 1 4.2-2.7L10 20.8V15" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <svg id="c-grab" width="30" height="30" viewBox="0 0 30 30" style="display:none;left:-15px;top:-13px"><path d="M8.2 11.4a2.4 2.4 0 0 1 4.8 0v-1a2.4 2.4 0 0 1 4.8 0v1a2.4 2.4 0 0 1 4.8 0v1.4a2.4 2.4 0 0 1 4.6.9v4.8c0 5.6-3.8 9.4-9.4 9.4-4.2 0-6.4-1.8-8.6-5.2l-2.4-3.8a2.3 2.3 0 0 1 3.4-3z M13 11.4v4 M17.8 11.4v4 M22.6 12.8v3" fill="#fff" stroke="#111" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
  </div>`);
  const $ = id => document.getElementById(id);
  const cur = $('cursor'), ring = $('ring'), shapes = { arrow: $('c-arrow'), hand: $('c-hand'), grab: $('c-grab') };
  let curScale = 1;
  function moveCursor() {
    if (!REEL) return;
    const el = document.elementFromPoint(K.px, K.py);
    const kind = (opts.cursorKind && opts.cursorKind(el)) || 'arrow';
    for (const k in shapes) shapes[k].style.display = k === kind ? '' : 'none';
    cur.style.transform = `translate(${K.px}px,${K.py}px) scale(${curScale})`;
  }
  K.moveCursor = moveCursor;
  window.addEventListener('pointermove', e => { K.px = e.clientX; K.py = e.clientY; moveCursor(); });
  window.addEventListener('pointerleave', () => { K.px = K.py = -999; });
  window.addEventListener('pointerdown', () => {
    K.down = true;
    if (!REEL) return;
    K.tween(90, p => { curScale = 1 - .14 * p; moveCursor(); });
    K.tween(300, p => { curScale = .86 + .14 * p; moveCursor(); }, K.ease.back, 120);
    K.tween(480, p => { ring.style.opacity = (1 - p) * .9; ring.style.transform = `scale(${.4 + p * 1.1})`; });
  });
  window.addEventListener('pointerup', () => { K.down = false; moveCursor(); });

  /* ---------- hook <-> outro ---------- */
  let outroOn = false;
  window.__outro = on => {
    if (on === outroOn) return; outroOn = on;
    const hook = document.querySelector('.hook'), outro = document.querySelector('.outro');
    K.tween(440, p => { const q = on ? p : 1 - p;
      hook.style.opacity = K.clamp(1 - q / .45, 0, 1);   // strictly sequential: never two lines at once
      const o = K.clamp((q - .55) / .45, 0, 1);
      outro.style.opacity = o; outro.style.transform = `translateY(${(1 - o) * 10}px)`; }, K.ease.lin);
  };

  /* ---------- clock ---------- */
  function tick(ms) {
    const n = Math.max(1, Math.ceil(ms / 4));
    for (let i = 0; i < n; i++) { K.now += ms / n; opts.update(ms / n / 1000); }
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (K.now < tw.t0) continue;
      const p = tw.dur <= 1 ? 1 : Math.min(1, (K.now - tw.t0) / tw.dur);
      tw.fn(tw.e(p));
      if (p >= 1) tweens.splice(i, 1);
    }
    opts.render();
  }
  window.__tick = tick;
  K.start = () => {
    if (!MANUAL) {
      let last = performance.now();
      requestAnimationFrame(function loop(t) { tick(Math.min(50, t - last)); last = t; requestAnimationFrame(loop); });
    } else tick(16);
  };
  return K;
};

ReelKit.embedded = function (opts) {
  const K = { REEL: false, MANUAL: false, embedded: true, now: 0, px: -999, py: -999, down: false };
  const tweens = [];
  K.ease = {
    lin: t => t,
    out: t => 1 - Math.pow(1 - t, 3),
    inOut: t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2,
    back: t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
  };
  K.tween = (dur, fn, e = K.ease.out, delay = 0) => { const tw = { t0: K.now + delay, dur, fn, e }; tweens.push(tw); return tw; };
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.lerp = (a, b, t) => a + (b - a) * t;
  K.spring = (s, target, k, z, dt) => { s.v += (k * (target - s.x) - 2 * Math.sqrt(k) * z * s.v) * dt; s.x += s.v * dt; };
  K.moveCursor = () => {};
  const mv = e => { K.px = e.clientX; K.py = e.clientY; };
  const dn = () => { K.down = true; }, up = () => { K.down = false; };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerdown', dn); window.addEventListener('pointerup', up);
  function tick(ms) {
    const n = Math.max(1, Math.ceil(ms / 4));
    for (let i = 0; i < n; i++) { K.now += ms / n; opts.update(ms / n / 1000); }
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      if (K.now < tw.t0) continue;
      const p = tw.dur <= 1 ? 1 : Math.min(1, (K.now - tw.t0) / tw.dur);
      tw.fn(tw.e(p));
      if (p >= 1) tweens.splice(i, 1);
    }
    opts.render();
  }
  K.tick = tick;
  let raf = 0, alive = false;
  K.start = () => {
    if (alive) return; alive = true;
    let last = performance.now();
    raf = requestAnimationFrame(function loop(t) { if (!alive) return; tick(Math.min(50, t - last)); last = t; raf = requestAnimationFrame(loop); });
  };
  K.stop = () => {
    alive = false; cancelAnimationFrame(raf);
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerdown', dn); window.removeEventListener('pointerup', up);
  };
  return K;
};
</script>
<script>/* inlined from component.js */
/* Cursed UI #14: a GDPR-compliant cookie banner. Both buttons equal size, equal weight. "Reject all" just doesn't
   want to be clicked: it runs from the pointer, and when you corner it, it blinks out and reappears across the page.
   Leave it alone for a moment and it walks back to its slot.

   Self-contained level. Needs ../_kit/reel.js (ReelKit clock) and component.css.
     const api = CursedUI.cookieReject.init(el, { onWin, onLose })   // el: an empty container, e.g. a .card
     el.addEventListener('cursed:win', e => ...)                     // also 'cursed:lose' (bubbles)
     api.reset(); api.destroy();
   Rules: "Accept all" loses. The pointer can't catch "Reject all", but the keyboard can:
   Tab to it and press Enter (it never runs from focus). Win.
   Pass { K } to drive it from an outside clock (the reel page does); otherwise it runs its own rAF loop.
   { scripted: true } (the reel): no automatic fleeing; the recorder choreographs it with api.to() / press() /
   exit() / back() / twitch(), timed against the cursor, so it never lands on Accept all or on the banner text. */
(function () {
  const CU = window.CursedUI = window.CursedUI || {};
  const NEAR = 44, RUN = 130, PAD = 12, CALM = 1100;

  CU.cookieReject = {
    id: 'cookie-reject', n: 14,
    title: 'Just click Reject all',
    goal: 'Reject the cookies.',
    init(root, opts = {}) {
      root.classList.add('cu-ck');
      root.innerHTML = `
        <div class="bar"><span class="logo"><svg width="14" height="14" viewBox="0 0 26 26"><circle cx="13" cy="13" r="5.6" fill="#fff"/><ellipse cx="13" cy="13" rx="11" ry="4.6" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" transform="rotate(-24 13 13)"/></svg></span><b>Orbit Journal</b><nav><span>Essays</span><span>Notes</span></nav></div>
        <div class="art">
          <div class="kick">Design notes &middot; 6 min read</div>
          <h2>In praise of boring, honest buttons</h2>
          <div class="hero"><i></i></div>
          <p class="lede">A button should do what it says, sit where you expect it, and stay put when you reach for it.</p>
        </div>
        <section class="banner" role="dialog" aria-label="Cookie consent">
          <h3><svg width="18" height="18" viewBox="0 0 18 18"><path d="M15.6 9.6A6.7 6.7 0 1 1 8.4 2.4a2.4 2.4 0 0 0 3 3 2.4 2.4 0 0 0 3 3 .9.9 0 0 1 1.2 1.2z" fill="#e9c58d" stroke="#b9853f" stroke-width="1.1"/><circle cx="6.4" cy="8" r="1" fill="#7a4f1d"/><circle cx="9.6" cy="12" r="1" fill="#7a4f1d"/><circle cx="6.2" cy="12.2" r=".8" fill="#7a4f1d"/></svg>We value your privacy</h3>
          <p>We and our <a>847 partners</a> store and access information on your device to personalise ads and content.</p>
          <div class="row">
            <div class="slot" data-slot><span class="ghost" data-ghost></span><button class="rej" data-rej>Reject all</button></div>
            <button class="acc" data-acc>Accept all</button>
          </div>
          <button class="more" data-more>Manage options</button>
        </section>`;
      const q = s => root.querySelector(`[data-${s}]`);
      const rej = q('rej'), slot = q('slot'), ghost = q('ghost'), acc = q('acc');

      const own = !opts.K;
      const K = opts.K || ReelKit({ embedded: true, update: (dt) => api.update(dt), render: () => api.render() });
      const timers = [];
      const later = (ms, fn) => timers.push({ at: K.now + ms, fn });

      const o = { x: { x: 0, v: 0 }, y: { x: 0, v: 0 } };
      let tx = 0, ty = 0, scale = 1, blinking = false, lastNear = -1e9, home = null, done = false, gone = false, grow = 0;
      let mode = 'home', ft = 0, fx0 = 0, fy0 = 0, twX = 0, pressS = 1;

      function measure() {
        const r = root.getBoundingClientRect(), s = slot.getBoundingClientRect(), k = r.width / root.offsetWidth || 1;   // local px, even when the card is scaled
        home = { x: (s.left - r.left + s.width / 2) / k, y: (s.top - r.top + s.height / 2) / k, w: s.width / k, h: s.height / k, W: r.width / k, H: r.height / k, k };
      }
      const clampX = x => K.clamp(x, PAD + home.w / 2, home.W - PAD - home.w / 2);
      const clampY = y => K.clamp(y, PAD + home.h / 2, home.H - PAD - home.h / 2);

      function blinkTo(x, y) {                                   // cornered: vanish, reappear across the page
        blinking = true;
        K.tween(110, p => scale = 1 - p, K.ease.inOut);
        later(115, () => { o.x.x = tx = x - home.x; o.y.x = ty = y - home.y; o.x.v = o.y.v = 0; if (opts.scripted) mode = 'home'; });
        K.tween(300, p => scale = p, K.ease.back, 125);
        later(430, () => blinking = false);
      }
      function flee() {
        if (!home || blinking || done || gone) return;
        const r = root.getBoundingClientRect();
        const px = (K.px - r.left) / home.k, py = (K.py - r.top) / home.k;
        const cx = home.x + o.x.x, cy = home.y + o.y.x;
        const dx = Math.max(Math.abs(px - cx) - home.w / 2, 0), dy = Math.max(Math.abs(py - cy) - home.h / 2, 0);
        if (Math.hypot(dx, dy) > NEAR) return;
        lastNear = K.now;
        let ux = cx - px, uy = cy - py; const n = Math.hypot(ux, uy);
        if (n < 1) { ux = 1; uy = 0; } else { ux /= n; uy /= n; }
        const nx = clampX(cx + ux * RUN), ny = clampY(cy + uy * RUN * .8);
        if (Math.hypot(nx - px, (ny - py) * 1.6) < 88) {          // no room left on this side
          blinkTo(clampX(home.W - cx), clampY(home.H - cy < cy ? PAD + home.h / 2 + 40 : home.H - PAD - home.h / 2 - 60));
          return;
        }
        tx = nx - home.x; ty = ny - home.y;
      }
      function fire(name) {
        root.dispatchEvent(new CustomEvent(name, { bubbles: true, detail: { id: 'cookie-reject' } }));
        if (name === 'cursed:win' && opts.onWin) opts.onWin();
        if (name === 'cursed:lose' && opts.onLose) opts.onLose();
      }

      const offs = [];
      const on = (el, ev, fn) => { el.addEventListener(ev, fn); offs.push(() => el.removeEventListener(ev, fn)); };
      on(rej, 'click', () => { if (done || opts.scripted) return;      // the reel: it escapes on mousedown, the click never lands
        done = true; tx = ty = 0; rej.textContent = 'Rejected'; fire('cursed:win'); });
      on(acc, 'click', () => fire('cursed:lose'));

      function update(dt) {
        for (let i = timers.length - 1; i >= 0; i--) if (K.now >= timers[i].at) timers.splice(i, 1)[0].fn();
        if (!home) measure();
        if (opts.scripted) {
          if (gone) {                                              // hop, then fall off the page: real gravity, a spin
            ft += dt;
            o.x.x = fx0 + 46 * ft; o.y.x = fy0 - 260 * ft + 1500 * ft * ft; o.x.v = 0;
            return;
          }
          const k = mode === 'dash' ? 300 : 200, z = mode === 'dash' ? .62 : .8;
          K.spring(o.x, tx, k, z, dt); K.spring(o.y, ty, k, z, dt);
          return;
        }
        flee();
        if (gone) { tx = 0; ty = home.H - home.y + home.h; }          // dropped off the bottom edge of the page
        const calm = K.now - lastNear > CALM && !blinking && !gone;
        if (calm) { tx = 0; ty = 0; }
        const k = gone ? 140 : calm ? 200 : 300, z = gone ? .9 : calm ? .8 : .6;
        K.spring(o.x, tx, k, z, dt); K.spring(o.y, ty, k, z, dt);
      }
      function render() {
        const fall = home ? K.clamp(o.y.x / (home.H - home.y), 0, 1) : 0;
        const rot = opts.scripted ? K.clamp(o.x.v * .011, -9, 9) + (gone ? 50 * ft : -5 * fall)
                                  : K.clamp(o.x.v * .011, -9, 9) + (gone ? 14 * fall : -6 * fall);
        /* with Reject all gone, Accept all takes the whole row */
        slot.style.flex = `${(1 - grow).toFixed(4)} 1 0`; slot.style.minWidth = '0';
        slot.style.marginRight = (-10 * grow).toFixed(2) + 'px';
        if (home) rej.style.width = grow > 0 ? home.w + 'px' : '';
        rej.style.transform = `translate(${(o.x.x + twX).toFixed(2)}px,${o.y.x.toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${Math.max(0, scale * pressS).toFixed(4)})`;
        ghost.style.opacity = (K.clamp(Math.hypot(o.x.x, o.y.x) / 50, 0, 1) * (1 - grow)).toFixed(3);   // no dashed sliver once Accept owns the row
        const lift = K.clamp(Math.hypot(o.x.x, o.y.x) / 30, 0, 1);
        rej.style.boxShadow = `0 0 0 1px rgba(18,18,20,.16) inset,0 ${(1 + 13 * lift).toFixed(1)}px ${(2 + 24 * lift).toFixed(1)}px -${(10 * lift).toFixed(1)}px rgba(30,24,10,${(.04 + .3 * lift).toFixed(3)})`;
      }
      function reset() {
        timers.length = 0; o.x.x = o.x.v = o.y.x = o.y.v = 0; tx = ty = 0; scale = 1; blinking = false; done = false;
        lastNear = -1e9; rej.textContent = 'Reject all'; home = null; gone = false; grow = 0; mode = 'home'; ft = 0; twX = 0; pressS = 1;
      }

      const api = {
        update, render, reset,
        /* the reel's punchline: cornered, it jumps off the page and Accept all fills the row; later it climbs back */
        exit() {
          if (!home) measure();
          if (opts.scripted) { gone = true; ft = 0; fx0 = o.x.x; fy0 = o.y.x; K.tween(520, p => grow = p, K.ease.inOut, 380); return; }
          gone = true; o.y.v = -260; K.tween(520, p => grow = p, K.ease.inOut, 260);
        },
        back() {
          if (opts.scripted) {                                   // climbs back up from under the card edge
            K.tween(500, p => grow = 1 - p, K.ease.inOut);
            later(160, () => { gone = false; mode = 'home'; tx = ty = 0; o.x.x = -10; o.y.x = home.H - home.y + home.h; o.x.v = 0; o.y.v = -900; });
            return;
          }
          K.tween(520, p => grow = 1 - p, K.ease.inOut); later(200, () => { gone = false; lastNear = -1e9; });
        },
        /* reel choreography, card-relative centre positions */
        to(x, y, m = 'dash') {
          if (!home) measure();
          if (m === 'blink') { blinkTo(x, y); return; }
          mode = m; tx = x - home.x; ty = y - home.y;
        },
        home() { mode = 'home'; tx = ty = 0; },
        press() { K.tween(70, p => pressS = 1 - .06 * p); K.tween(200, p => pressS = .94 + .06 * p, K.ease.back, 80); },
        twitch() { K.tween(480, p => twX = Math.sin(p * Math.PI * 4) * 7 * (1 - p), K.ease.lin); },
        homePt() { if (!home) measure(); return [home.x, home.y, home.w, home.h]; },
        el: { root, rej, acc, slot, more: q('more') },
        destroy() { offs.forEach(f => f()); if (own) K.stop(); root.innerHTML = ''; root.classList.remove('cu-ck'); }
      };
      reset();
      if (own) K.start();
      return api;
    }
  };
})();
</script>
<script>
(() => {
  let api;
  const K = ReelKit({
    cursorKind: el => el && el.closest('button') ? 'hand' : 'arrow',
    update: dt => api.update(dt), render: () => api.render()
  });
  api = CursedUI.cookieReject.init(document.getElementById('card'), { K, scripted: true });
  const c = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  window.__pt = k => c(api.el[k]);
  window.__exit = () => api.exit();
  window.__to = (x, y, m) => api.to(x, y, m);
  window.__home = () => api.home();
  window.__press = () => api.press();
  window.__twitch = () => api.twitch();
  window.__homePt = () => api.homePt();
  /* card-relative (unscaled) centre of an element, for choreography targets */
  window.__rel = s => { const card = document.getElementById('card'), k = card.getBoundingClientRect().width / card.offsetWidth;
    const a = card.getBoundingClientRect(), b = document.querySelector(s).getBoundingClientRect();
    return [(b.left - a.left) / k, (b.top - a.top) / k, b.width / k, b.height / k]; };
  window.__back = () => api.back();
  K.start();
})();
</script>
