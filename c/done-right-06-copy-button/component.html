<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copy button · Done right #6 · @zellap.app</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@700&f[]=general-sans@400,500,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap">

<!-- Demo page only. Not part of the component. -->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 48px 20px;
    background: #ECE8E0; color: #1D1B18; line-height: 1.5;
    font-family: "General Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .demo { width: min(100%, 540px); }
  .demo-eyebrow { font: 500 .8125rem/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: #645E55; margin: 0 0 12px; }
  .demo h1 { font: 700 clamp(2rem, 7vw, 2.75rem)/1.05 Satoshi, "General Sans", system-ui, sans-serif; letter-spacing: -.035em; margin: 0; }
  .demo-lede { color: #4F4A43; margin: 12px 0 28px; }
  .demo-card { background: #FFFFFF; border: 1px solid rgba(40, 32, 20, .12); border-radius: 24px; padding: 32px; box-shadow: 0 24px 50px -28px rgba(40, 32, 20, .28); }
  .demo-notes { font: 400 .8125rem/1.7 "Geist Mono", ui-monospace, monospace; color: #645E55; margin-top: 20px; }
</style>

<!-- Component: copy this block. -->
<style id="component">
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  .copy { display: grid; gap: 8px; color: #1D1B18; }
  .copy > label { font-weight: 600; font-size: 1.0625rem; }
  .copy-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
  }
  .copy-input {
    min-width: 0;
    min-height: 48px;
    padding: 0 14px;
    border: 1px solid #857E73;
    border-radius: 12px;
    background: #F7F5F1;
    color: #1D1B18;
    font: 500 .9375rem/1 "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .copy-input:focus-visible { outline: 2.5px solid #1D1B18; outline-offset: 2px; }

  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 18px;
    border: 0;
    border-radius: 12px;
    background: #1D1B18;
    color: #FFFFFF;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .2s;
  }
  .copy-btn:hover { background: #3A3631; }
  .copy-btn:focus-visible { outline: 2.5px solid #1D1B18; outline-offset: 3px; }
  .copy-btn:disabled { opacity: .45; cursor: not-allowed; }
  .copy-btn svg { width: 18px; height: 18px; flex: none; }

  /* Both labels share one grid cell, so the width never jumps. */
  .copy-labels { display: grid; }
  .copy-labels > * { grid-area: 1 / 1; }
  .copy-btn .is-done,
  .copy-btn[data-state="done"] .is-idle {
    visibility: hidden;
  }
  .copy-btn[data-state="done"] .is-done {
    visibility: visible;
  }
  .copy-btn[data-state="done"] { background: #2D6A3E; }

  .copy-hint { margin: 0; font-size: .875rem; font-weight: 500; color: #8A3A12; }

  @media (prefers-reduced-motion: reduce) {
    .copy-btn { transition: none; }
  }
</style>
</head>
<body>
<main class="demo">
  <p class="demo-eyebrow">Done right #6 · @zellap.app</p>
  <h1>Copy button</h1>
  <p class="demo-lede">Clipboard API first, a fallback for old browsers and blocked permissions, a label that never jumps in width, and a status message for screen readers.</p>

  <div class="demo-card">
    <div class="copy">
      <label for="cmd">Start a project</label>
      <div class="copy-row">
        <input class="copy-input" id="cmd" readonly
               value="npm create vite@latest">
        <button class="copy-btn" type="button" data-copy="cmd">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15.5 5.5v-.5a1.5 1.5 0 0 0-1.5-1.5H6A2.5 2.5 0 0 0 3.5 6v8A1.5 1.5 0 0 0 5 15.5h.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="copy-labels">
            <span class="is-idle">Copy</span>
            <span class="is-done">Copied</span>
          </span>
        </button>
      </div>
      <p class="copy-hint" hidden></p>
      <p class="copy-status sr-only" role="status"></p>
    </div>
  </div>

  <p class="demo-notes">Works on https and localhost. Open the file over http:// or block clipboard access to see the fallback.</p>
</main>

<!-- Component: copy this block. -->
<script id="component">
  for (const btn of document.querySelectorAll('.copy-btn')) {
    const field = document.getElementById(btn.dataset.copy);
    const box = btn.closest('.copy');
    const status = box.querySelector('.copy-status');
    const hint = box.querySelector('.copy-hint');
    const key = /Mac|iPhone|iPad/.test(navigator.userAgent) ? '⌘C' : 'Ctrl+C';
    let timer;

    const show = (state, message) => {
      clearTimeout(timer);
      btn.dataset.state = state;
      status.textContent = message;
      hint.hidden = state !== 'manual';
      hint.textContent = state === 'manual' ? message : '';
      if (state === 'done') timer = setTimeout(() => {
        btn.dataset.state = 'idle';
        status.textContent = '';
      }, 2000);
    };

    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(field.value);
        show('done', 'Copied to clipboard');
      } catch {
        // http://, an old browser or a blocked permission.
        field.select();
        if (document.execCommand('copy')) {
          show('done', 'Copied to clipboard');
        } else {
          show('manual', `Selected. Press ${key} to copy.`);
        }
      }
    });
  }
</script>
</body>
</html>
