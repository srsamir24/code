<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envelope send</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: oklch(0.87 0.135 118);
    --stage-lift: oklch(0.93 0.11 115);
    --ink: oklch(0.25 0.06 130);
    --paper: oklch(0.99 0.003 110);
    --paper-back: oklch(0.945 0.008 110);
    --line: oklch(0.88 0.012 110);
    --ptext: oklch(0.25 0.02 260);
    --ptext-2: oklch(0.5 0.015 260);
    --env: oklch(0.96 0.012 95);
    --env-2: oklch(0.925 0.016 92);
    --env-3: oklch(0.89 0.018 90);
    --red: oklch(0.57 0.2 27);
    --navy: oklch(0.33 0.11 262);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Inter Tight", system-ui, sans-serif;
    background: radial-gradient(60% 50% at 50% 42%, var(--stage-lift), var(--stage));
    background-color: var(--stage);
    color: var(--ink);
    display: grid; place-items: center;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  ::selection { background: var(--navy); color: var(--paper); }
  em, i { font-style: normal; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* a fixed 480 x 720 scene, scaled as one piece */
  .fit { position: relative; width: 480px; height: 720px; flex: none; perspective: 1500px; perspective-origin: 50% 46%; }

  /* the letter is the real form */
  .letter {
    position: absolute; left: 44px; top: 0; width: 392px; height: 474px; z-index: 6;
    padding: 26px 28px 24px; background: var(--paper); color: var(--ptext);
    box-shadow: 0 1px 2px oklch(0.3 0.07 125 / 0.2), 0 26px 40px -20px oklch(0.3 0.09 125 / 0.45);
  }
  .letter h1 { font-size: 25px; font-weight: 800; letter-spacing: -0.025em; }
  .letter > p { margin-top: 3px; font-size: 14.5px; font-weight: 500; color: var(--ptext-2); }
  .field { position: relative; display: block; margin-top: 13px; }
  .field span { display: block; font-size: 13.5px; font-weight: 600; color: var(--ptext); }
  .field input, .field textarea {
    display: block; width: 100%; margin-top: 3px; padding: 7px 0; border: 0; border-radius: 0;
    border-bottom: 2px solid var(--line); background: none;
    font: inherit; font-size: 16px; font-weight: 500; color: var(--ptext); caret-color: var(--red);
    outline: none; resize: none; transition: border-color 140ms ease;
  }
  .field textarea { height: 84px; line-height: 28px; padding: 0; border: 0; background: repeating-linear-gradient(transparent 0 26px, var(--line) 26px 28px); background-attachment: local; }
  .field input:focus { border-bottom-color: var(--navy); }
  .field textarea:focus { background: repeating-linear-gradient(transparent 0 26px, oklch(0.33 0.11 262 / 0.55) 26px 28px); background-attachment: local; }
  .field input::placeholder, .field textarea::placeholder { color: oklch(0.68 0.012 260); }
  .field .err { display: none; position: absolute; right: 0; top: 1px; font-size: 13px; font-weight: 600; color: var(--red); }
  .field.bad .err { display: block; }
  .field.bad input { border-bottom-color: var(--red); }
  .field.bad textarea { background: repeating-linear-gradient(transparent 0 26px, var(--red) 26px 28px); background-attachment: local; }
  .send {
    display: block; width: 100%; height: 50px; margin-top: 15px; border: 0; border-radius: 13px;
    background: var(--navy); color: var(--paper); font: inherit; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: transform 140ms var(--ease-out), background 150ms ease;
  }
  .send:active { transform: scale(0.97); }
  .send:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
  @media (hover: hover) and (pointer: fine) { .send:hover { background: oklch(0.38 0.12 262); } }
  .letter.nudge { animation: nudge 300ms var(--ease-out); }
  @keyframes nudge { 25% { translate: -5px 0; } 55% { translate: 4px 0; } 80% { translate: -2px 0; } }

  /* the envelope: two faces back to back, flap on a hinge along the top edge */
  .env { position: absolute; left: 20px; top: 416px; width: 440px; height: 282px; transform-style: preserve-3d; will-change: transform; z-index: 2; }
  .side { position: absolute; inset: 0; border-radius: 9px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d; }
  .side.rear { box-shadow: 0 26px 34px -18px oklch(0.3 0.09 125 / 0.55); background: oklch(0.33 0.05 262); }
  .side.face { transform: rotateY(180deg) translateZ(2px); background: var(--env); box-shadow: 0 26px 34px -18px oklch(0.3 0.09 125 / 0.55); overflow: hidden; }
  /* airmail border */
  .side.face::before { content: ""; position: absolute; inset: 0; padding: 11px; border-radius: inherit; background: repeating-linear-gradient(-45deg, var(--red) 0 16px, var(--env) 16px 24px, var(--navy) 24px 40px, var(--env) 40px 48px); -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
  /* front panels of the flap side */
  .panel { position: absolute; inset: 0; border-radius: 9px; transform: translateZ(3px); overflow: hidden; pointer-events: none; }
  .panel svg { display: block; }
  /* the flap, hinged at the top edge. 180deg = open, standing up behind the letter */
  .flap { position: absolute; left: 0; right: 0; top: 0; height: 168px; transform-origin: 50% 0; transform-style: preserve-3d; pointer-events: none; }
  .flap svg { position: absolute; inset: 0; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flap .in { transform: rotateX(180deg); }

  /* the folded letter lives inside the envelope's 3D space while it travels */
  .fold { position: absolute; left: 24px; width: 392px; height: 474px; transform-style: preserve-3d; display: none; pointer-events: none; }
  .ply { position: absolute; left: 0; width: 392px; height: 158px; transform-style: preserve-3d; }
  .ply .f, .ply .b { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .ply .f { background: var(--paper); }
  .ply .b { background: var(--paper-back); transform: rotateX(180deg); }
  .ply .shade { position: absolute; inset: 0; background: oklch(0.25 0.03 260); opacity: 0; pointer-events: none; }
  .ply .copy { position: absolute; left: 0; width: 392px; height: 474px; }
  .ply.t { top: 0; transform-origin: 50% 100%; }
  .ply.m { top: 158px; }
  .ply.m .f { box-shadow: 0 22px 30px -14px oklch(0.3 0.09 125 / 0.5); }
  .ply.u { top: 316px; transform-origin: 50% 0; }

  /* the address side */
  .addr { position: absolute; left: 34px; top: 34px; right: 120px; font-size: 13.5px; font-weight: 500; line-height: 1.35; color: var(--ptext-2); }
  .addr b, .addr span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .addr b { color: var(--ptext); font-weight: 700; }
  .to { position: absolute; left: 150px; top: 138px; font-size: 20px; font-weight: 700; line-height: 1.26; letter-spacing: -0.015em; color: var(--ptext); }
  .to small { display: block; font-size: 16px; font-weight: 500; letter-spacing: 0; color: var(--ptext); }
  /* a stamp with real perforations: holes cut by a mask */
  .stamp {
    position: absolute; right: 30px; top: 28px; width: 84px; height: 104px; z-index: 3;
    --r: 3.4px; --g: 10.5px;
    background: var(--paper);
    -webkit-mask: linear-gradient(#000 0 0) center / calc(100% - 7px) calc(100% - 7px) no-repeat, radial-gradient(circle var(--r), #0000 97%, #000) calc(var(--g) / -2) calc(var(--g) / -2) / var(--g) var(--g);
    mask: linear-gradient(#000 0 0) center / calc(100% - 7px) calc(100% - 7px) no-repeat, radial-gradient(circle var(--r), #0000 97%, #000) calc(var(--g) / -2) calc(var(--g) / -2) / var(--g) var(--g);
    will-change: transform;
  }
  .stampshadow { position: absolute; right: 30px; top: 28px; width: 84px; height: 104px; background: oklch(0.3 0.03 90 / 0.35); filter: blur(3px); z-index: 2; will-change: transform, opacity; }
  .stamp svg { position: absolute; inset: 7px; width: 70px; height: 90px; display: block; }
  .post { position: absolute; right: 74px; top: 42px; width: 136px; height: 104px; z-index: 4; mix-blend-mode: multiply; opacity: 0; transform-origin: 40% 50%; }
  .post text { font-family: "Inter Tight", sans-serif; font-weight: 700; }

  /* under the envelope, once it's gone */
  .after { position: absolute; left: 20px; right: 20px; top: 138px; z-index: 1; text-align: center; opacity: 0; visibility: hidden; transition: opacity 240ms var(--ease-out); }
  .after.on { opacity: 1; visibility: visible; }
  .after h2 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .after p { margin-top: 8px; font-size: 16px; font-weight: 500; }
  .again {
    margin-top: 16px; height: 46px; padding: 0 20px; border: 0; border-radius: 13px; background: var(--ink); color: var(--stage-lift);
    font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 140ms var(--ease-out);
  }
  .again:active { transform: scale(0.97); }
  .again:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
</style>
</head>
<body>
<div class="fit" id="fit">
  <div class="after" id="after">
    <h2>On its way</h2>
    <p id="afterLine">We answer within two working days.</p>
    <button class="again" id="again" type="button">Write another</button>
  </div>

  <div class="env" id="env">
    <div class="side rear">
      <div class="fold" id="fold"></div>
      <div class="panel">
        <svg width="440" height="282" viewBox="0 0 440 282" aria-hidden="true">
          <defs>
            <filter id="lay" x="-10%" y="-20%" width="120%" height="130%"><feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="oklch(0.35 0.03 90)" flood-opacity="0.28"/></filter>
            <linearGradient id="sl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="var(--env)"/><stop offset="1" stop-color="var(--env-2)"/></linearGradient>
            <linearGradient id="sr" x1="1" x2="0" y1="0" y2="0"><stop offset="0" stop-color="var(--env-2)"/><stop offset="1" stop-color="var(--env-3)"/></linearGradient>
          </defs>
          <path fill="url(#sl)" d="M0 0 L222 150 L0 282 Z"/>
          <path fill="url(#sr)" filter="url(#lay)" d="M440 0 L218 150 L440 282 Z"/>
          <path fill="var(--env)" filter="url(#lay)" d="M0 282 L208 138 Q220 130 232 138 L440 282 Z"/>
          <path fill="none" stroke="oklch(1 0 0 / 0.7)" stroke-width="1.5" d="M0 282 L208 138 Q220 130 232 138 L440 282"/>
          <!-- airmail stripes run round the edge of this side too -->
          <path fill="none" stroke="var(--red)" stroke-width="9" stroke-dasharray="20 44" d="M4.5 28 V277.5 H435.5 V31"/>
          <path fill="none" stroke="var(--navy)" stroke-width="9" stroke-dasharray="20 44" stroke-dashoffset="-32" d="M4.5 28 V277.5 H435.5 V31"/>
        </svg>
      </div>
      <div class="flap" id="flap">
        <svg class="out" width="440" height="168" viewBox="0 0 440 168" aria-hidden="true">
          <defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--env)"/><stop offset="1" stop-color="oklch(0.975 0.01 95)"/></linearGradient></defs>
          <path fill="url(#fl)" d="M0 0 H440 L236 158 Q220 170 204 158 Z"/>
        </svg>
        <svg class="in" width="440" height="168" viewBox="0 0 440 168" aria-hidden="true">
          <!-- drawn upside down: this face is turned over on its own centre line, so the hinge lands back at the top -->
          <g transform="matrix(1 0 0 -1 0 168)">
            <path fill="var(--env-3)" d="M0 0 H440 L236 158 Q220 170 204 158 Z"/>
            <path fill="oklch(0.84 0.05 85)" d="M34 12 H406 L232 148 Q220 156 208 148 Z"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="side face">
      <div class="addr"><b id="fromName">Maren Aas</b><span id="fromMail">maren@halden.no</span></div>
      <div class="to">Halden Studio<small>Storgata 14<br>0184 Oslo</small></div>
      <div class="stampshadow" id="stampShadow"></div>
      <div class="stamp" id="stamp">
        <svg viewBox="0 0 70 90" aria-hidden="true">
          <rect width="70" height="90" fill="var(--red)"/>
          <circle cx="50" cy="26" r="12" fill="oklch(0.9 0.14 95)"/>
          <path fill="var(--navy)" d="M0 66 L20 36 L32 52 L44 34 L70 68 V90 H0 Z"/>
          <path fill="var(--paper)" d="M20 36 L27 45.5 L22 50 L18 46 L12 48 Z M44 34 L53 45 L47 49 L43 45 L38 43 Z"/>
          <text x="6" y="83" font-family="Inter Tight, sans-serif" font-weight="800" font-size="13" fill="var(--paper)">24 kr</text>
        </svg>
      </div>
      <svg class="post" id="post" viewBox="0 0 136 104" aria-hidden="true">
        <defs><path id="arc" d="M22 52 A30 30 0 1 1 82 52"/></defs>
        <g fill="none" stroke="var(--navy)">
          <circle cx="52" cy="52" r="42" stroke-width="2.6" stroke-dasharray="60 2 90 1.5 70 3"/>
          <circle cx="52" cy="52" r="25.5" stroke-width="1.8"/>
          <path stroke-width="2.6" stroke-linecap="round" d="M96 28 q10 -7 20 0 t20 0 M97 42 q10 -7 20 0 t20 0 M97 56 q10 -7 20 0 t20 0 M96 70 q10 -7 20 0 t20 0"/>
        </g>
        <g fill="var(--navy)" text-anchor="middle">
          <text font-size="10"><textPath href="#arc" startOffset="50%">OSLO SENTRUM</textPath></text>
          <text id="postDay" x="52" y="51" font-size="11.5"></text>
          <text id="postTime" x="52" y="63" font-size="10"></text>
        </g>
      </svg>
    </div>
  </div>

  <form class="letter" id="letter" novalidate>
    <h1>Write to us</h1>
    <p>A real person reads every letter.</p>
    <label class="field" id="fName"><span>Your name</span><input id="name" name="name" autocomplete="name" placeholder="Maren Aas"><small class="err">Sign it, so we know who to answer.</small></label>
    <label class="field" id="fMail"><span>Email</span><input id="mail" name="email" type="email" autocomplete="email" inputmode="email" placeholder="maren@halden.no"><small class="err">That address won't reach you.</small></label>
    <label class="field" id="fMsg"><span>Letter</span><textarea id="msg" name="message" placeholder="What are you working on?"></textarea><small class="err">An empty letter is a strange thing to post.</small></label>
    <button class="send" id="send" type="submit">Fold and send</button>
  </form>
</div>
<div class="sr" id="live" aria-live="polite"></div>

<script>
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const fit = $('fit'), env = $('env'), letter = $('letter'), fold = $('fold'), flap = $('flap');
  const stamp = $('stamp'), stampShadow = $('stampShadow'), post = $('post'), after = $('after'), live = $('live');
  const say = t => { live.textContent = ''; setTimeout(() => live.textContent = t, 30); };

  function resize() {
    const scale = Math.min(1, (innerWidth - 16) / 480, (innerHeight - 16) / 720);
    fit.style.transform = `scale(${scale})`;
    fit.style.margin = `${(720 * scale - 720) / 2}px ${(480 * scale - 480) / 2}px`;
  }
  addEventListener('resize', resize); resize();

  // the postmark carries the real date and time
  function stampDate() {
    const d = new Date();
    $('postDay').textContent = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }).toUpperCase();
    $('postTime').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  // three plies, each an inert copy of the form clipped to one third
  function cutPlies() {
    fold.innerHTML = '';
    const copyForm = () => {
      const c = letter.cloneNode(true);
      c.removeAttribute('id'); c.inert = true;
      c.classList.remove('nudge');
      c.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      c.querySelectorAll('input, textarea').forEach((n, i) => {
        const real = letter.querySelectorAll('input, textarea')[i];
        n.value = real.value; if (n.tagName === 'TEXTAREA') n.textContent = real.value;
      });
      c.style.cssText = 'position:absolute;left:0;top:0;box-shadow:none;width:392px;height:474px';
      return c;
    };
    return ['t', 'm', 'u'].map((name, i) => {
      const ply = document.createElement('div');
      ply.className = 'ply ' + name;
      const f = document.createElement('div'); f.className = 'f';
      const w = document.createElement('div'); w.className = 'copy'; w.style.top = -158 * i + 'px';
      w.appendChild(copyForm()); f.appendChild(w);
      const shade = document.createElement('div'); shade.className = 'shade'; f.appendChild(shade);
      const b = document.createElement('div'); b.className = 'b';
      const shadeBack = document.createElement('div'); shadeBack.className = 'shade'; b.appendChild(shadeBack);
      ply.append(f, b); fold.appendChild(ply);
      return { ply, shade, shadeBack };
    });
  }

  // helpers: every beat is a function of one clock, so stills and reverse need no extra code
  const clamp = (a, b, v) => Math.max(a, Math.min(b, v));
  const seg = (t, a, b) => clamp(0, 1, (t - a) / (b - a));
  const inOut = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const outC = u => 1 - Math.pow(1 - u, 3);
  // paper: slow to start, a touch past flat at the end
  const crease = u => inOut(Math.min(1, u / 0.82)) + (u > 0.82 ? Math.sin((u - 0.82) / 0.18 * Math.PI) * 0.02 : 0);
  // an underdamped spring, sampled: overshoots 1 and settles
  const spring = (u, f = 3.2, d = 5.5) => u <= 0 ? 0 : 1 - Math.exp(-d * u) * Math.cos(f * Math.PI * u);

  const T = {
    foldU: [0, 520], foldT: [120, 620], drop: [560, 980], flap: [960, 1340],
    flip: [1320, 1880], stamp: [1900, 2320], mark: [2300, 2560], end: 2800,
  };
  let plies = null;
  const LETTER_TOP = -416;                       // the letter's top, in the envelope's coordinates

  function pose(ms) {
    if (plies) {
      const [t, m, u] = plies;
      const fu = crease(seg(ms, ...T.foldU));
      const ft = crease(seg(ms, ...T.foldT));
      u.ply.style.transform = `translateZ(${0.6 + fu}px) rotateX(${fu * 178}deg)`;
      t.ply.style.transform = `translateZ(${1.2 + ft * 2}px) rotateX(${-ft * 178}deg)`;
      // both faces of a ply darken as it passes the light
      u.shade.style.opacity = Math.sin(Math.min(1, fu) * Math.PI) * 0.3;
      t.shade.style.opacity = Math.sin(Math.min(1, ft) * Math.PI) * 0.2;
      u.shadeBack.style.opacity = Math.sin(Math.min(1, fu) * Math.PI) * 0.13;
      t.shadeBack.style.opacity = Math.sin(Math.min(1, ft) * Math.PI) * 0.1;
      // the packet drops into the pocket: it starts where the letter was, ends inside the envelope
      const d = inOut(seg(ms, ...T.drop));
      const lift = Math.sin(seg(ms, 0, 620) * Math.PI) * 26;          // the paper leaves the desk as it folds
      const y = LETTER_TOP + (50 - 158 - LETTER_TOP) * d;          // the middle ply ends 50px inside the mouth
      // in front of everything until its lower edge reaches the envelope, then flat and behind the front panels
      const sink = seg(d, 0, 0.3);
      fold.style.transform = `translate3d(0, ${y}px, ${8 - 7 * sink + lift}px) rotateZ(${Math.sin(seg(ms, 0, 620) * Math.PI) * -2.4}deg) scaleZ(${1 - 0.9 * sink})`;
      fold.style.display = 'block';
      fold.style.opacity = ms >= T.flap[1] ? 0 : 1;
    }
    // flap: 180 is open, 0 is closed. It overshoots the envelope and presses flat
    const fl = spring(seg(ms, ...T.flap), 1.8, 6);
    flap.style.transform = `translateZ(${0.5 + fl * 5.5}px) rotateX(${180 - fl * 180}deg)`;

    // the envelope comes up from the bottom of the scene, centres, and flips to its address side
    const rise = inOut(seg(ms, T.flap[0] + 140, T.flip[1]));
    const fl2 = spring(seg(ms, ...T.flip), 1.5, 6);
    const dipU = seg(ms, T.stamp[0] + 120, T.stamp[0] + 460);
    const dip = dipU > 0 ? Math.exp(-6 * dipU) * Math.sin(dipU * Math.PI * 4) * 9 : 0;
    const hitU = seg(ms, T.mark[0], T.mark[0] + 240);
    const hit = hitU > 0 ? Math.exp(-7 * hitU) * Math.sin(hitU * Math.PI * 3.4) * 6 : 0;
    env.style.transform = `translateY(${rise * -96 + dip + hit}px) rotateZ(${rise * -1.4}deg) rotateY(${fl2 * 180}deg)`;

    // the stamp lands from above with its own shadow closing in under it
    const su = seg(ms, ...T.stamp);
    const s = spring(su, 2.4, 6.5);
    stamp.style.opacity = su > 0 ? 1 : 0;
    stamp.style.transform = `translate(${(1 - s) * -22}px, ${(1 - s) * -40}px) scale(${1 + (1 - s) * 0.85}) rotate(${(1 - s) * -26 + 2.6}deg)`;
    stampShadow.style.opacity = su > 0 ? 0.25 + 0.55 * outC(su) : 0;
    stampShadow.style.transform = `translate(${(1 - s) * 16}px, ${(1 - s) * 24 + 1.5}px) scale(${1 + (1 - s) * 0.5}) rotate(${(1 - s) * -26 + 2.6}deg)`;

    // the postmark bangs down and stays a little uneven
    const mu = seg(ms, ...T.mark);
    post.style.opacity = mu > 0 ? 0.16 + 0.68 * outC(mu * 3 > 1 ? 1 : mu * 3) : 0;
    post.style.transform = `scale(${1 + (1 - outC(seg(ms, T.mark[0], T.mark[0] + 90))) * 0.2}) rotate(-11deg)`;
  }

  function rest() {
    fold.style.display = 'none'; plies = null;
    letter.style.visibility = 'visible';
    letter.style.opacity = '';
    after.classList.remove('on');
    pose(0);
  }

  let running = 0;
  function play(from, to, done) {
    cancelAnimationFrame(running);
    const start = performance.now(), dur = Math.abs(to - from) / (to > from ? 1 : 1.9);
    (function frame(now) {
      const u = dur ? Math.min(1, (now - start) / dur) : 1;
      pose(from + (to - from) * u);
      if (u < 1) running = requestAnimationFrame(frame); else done?.();
    })(start);
  }

  // validation first: a bad letter never folds
  const valid = {
    name: v => v.trim().length > 1,
    mail: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()),
    msg: v => v.trim().length > 0,
  };
  const FIELDS = [['name', 'fName'], ['mail', 'fMail'], ['msg', 'fMsg']];
  function check() {
    let first = null;
    FIELDS.forEach(([id, wrap]) => {
      const ok = valid[id]($(id).value);
      $(wrap).classList.toggle('bad', !ok);
      $(id).setAttribute('aria-invalid', !ok);
      if (!ok && !first) first = $(id);
    });
    return first;
  }
  FIELDS.forEach(([id, wrap]) => $(id).addEventListener('input', () => {
    if ($(wrap).classList.contains('bad') && valid[id]($(id).value)) { $(wrap).classList.remove('bad'); $(id).setAttribute('aria-invalid', 'false'); }
  }));

  function prepare() {
    $('fromName').textContent = $('name').value.trim();
    $('fromMail').textContent = $('mail').value.trim();
    stampDate();
    plies = cutPlies();
    letter.style.visibility = 'hidden';
  }

  letter.addEventListener('submit', e => {
    e.preventDefault();
    const bad = check();
    if (bad) {
      bad.focus();
      if (!reduce) { letter.classList.remove('nudge'); letter.offsetWidth; letter.classList.add('nudge'); }
      say('Check the letter: ' + bad.closest('.field').querySelector('.err').textContent);
      return;
    }
    prepare();
    say('Folding your letter');
    // your network call goes here; the animation runs while it does
    if (reduce) { pose(T.end); finished(); return; }
    play(0, T.end, finished);
  });

  function finished() {
    after.classList.add('on');
    $('afterLine').textContent = `We'll answer ${$('name').value.trim().split(' ')[0]} within two working days.`;
    say('Letter sent. We answer within two working days.');
    $('again').focus({ preventScroll: true });
  }
  $('again').addEventListener('click', () => {
    letter.reset();
    FIELDS.forEach(([id, wrap]) => { $(wrap).classList.remove('bad'); $(id).removeAttribute('aria-invalid'); });
    after.classList.remove('on');
    const unwind = () => { rest(); $('name').focus({ preventScroll: true }); };
    if (reduce) { unwind(); return; }
    // the envelope turns back, opens and hands you a blank sheet: the same clock, backwards
    plies = cutPlies();
    play(T.end, 0, unwind);
  });

  rest();

  // stills and the demo loop
  const params = new URLSearchParams(location.search);
  const still = params.get('still');
  const fill = () => {
    $('name').value = 'Maren Aas'; $('mail').value = 'maren@halden.no';
    $('msg').value = 'We need a booking page for the bakery, and it has to feel like us. Can we talk on Thursday?';
  };
  if (still) {
    document.fonts.ready.then(() => {
      fill();
      if (still === 'form') return;
      prepare();
      if (still === 'fold') pose(Number(params.get('t') || 270));
      if (still === 'sent') { pose(T.end); finished(); document.activeElement?.blur(); }
    });
  }
  if (params.has('demo')) {
    const wait = ms => new Promise(r => setTimeout(r, ms));
    (async function loop() {
      fill(); await wait(1200); letter.requestSubmit();
      await wait(4200); $('again').click();
      await wait(2200); loop();
    })();
  }
</script>
</body>
</html>
